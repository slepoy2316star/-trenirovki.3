огда мышцы разогреты. Держи позицию 30–60 секунд, 2–3 подхода, до ощущения натяжения, но не боли. Силовые в полной амплитуде тоже улучшают гибкость. Прогресс заметен через 4–8 недель регулярной практики."},{"c":"Тренировки","q":"Что такое подвижность и чем она отличается от растяжки?","k":["мобильность","подвижность суставов","мобилити","mobility","скованность","растяжка или мобильность"],"a":"Растяжка — пассивная длина мышц, подвижность — способность активно и под контролем двигаться в этой амплитуде. Для подвижности подходят глубокий присед с удержанием, круги в плечах и тазе, кошка-корова, выпады с поворотом. Делай 5–10 минут перед тренировкой или как отдельную короткую сессию."},{"c":"Тренировки","q":"Как сесть в глубокий присед, если не получается?","k":["глубокий присед","не могу присесть глубоко","пятки отрываются","подвижность голеностопа","присед ниже параллели"],"a":"Частые причины — голеностоп и тазобедренные. Делай удержание в приседе с опорой за стойку 2–3 минуты в день, растяжку икр у стены и выпады с выносом колена вперёд. Временно можно ставить блины 1–2,5 см под пятки или использовать штангетки. Носки чуть в стороны, колени идут по линии носков."},{"c":"Тренировки","q":"Как улучшить осанку и раскрыть плечи?","k":["осанка","сутулость","круглые плечи","плечи вперёд","исправить осанку","грудной отдел"],"a":"Укрепляй спину и заднюю дельту: тяги, face pull, обратные махи — подходов на тягу должно быть не меньше, чем на жим. Растягивай грудные в дверном проёме по 30–60 секунд и мобилизируй грудной отдел на ролике. Меньше сиди без перерыва: вставай каждые 30–45 минут."},{"c":"Тренировки","q":"Что такое МФР и нужен ли массажный ролик?","k":["мфр","массажный ролик","раскатка","фоам роллер","миофасциальный релиз","мяч для массажа"],"a":"Ролик даёт кратковременное улучшение подвижности и снижает ощущение скованности. Катай мышцу 30–90 секунд перед тренировкой или после, медленно, без сильной боли. Не катай прямо по суставам и пояснице. Это приятное дополнение, а не обязательный пункт."},{"c":"Тренировки","q":"Сколько кардио нужно делать?","k":["сколько кардио","кардио в неделю","нужно ли кардио","кардио для здоровья","аэробная нагрузка сколько"],"a":"Для здоровья: 150–300 минут умеренного кардио в неделю или 75–150 минут интенсивного, плюс 8–10 тыс. шагов в день. Для набора массы хватит 2–3 сессий по 20–30 минут. Для похудения кардио помогает, но главное — дефицит калорий."},{"c":"Тренировки","q":"Когда делать кардио — до или после силовой?","k":["кардио до или после","кардио после силовой","кардио перед залом","когда делать кардио","совмещать кардио и силовые"],"a":"Если цель — сила и мышцы, делай кардио после силовой или в отдельный день. Интенсивное кардио и тренировку ног лучше развести на 6+ часов или в разные дни. Перед силовой — только 5–10 минут лёгкой разминки."},{"c":"Тренировки","q":"Какое кардио лучше для похудения?","k":["лучшее кардио","кардио для жиросжигания","дорожка или велик","эллипс или беговая","какое кардио выбрать"],"a":"Лучшее — то, которое ты будешь делать регулярно: ходьба в горку, велосипед, эллипс, плавание, бег. Ходьба почти не мешает восстановлению и подходит всем. Важен итоговый расход за неделю, а не тип тренажёра."},{"c":"Тренировки","q":"Что лучше — интервалы (HIIT) или спокойное кардио?","k":["hiit","интервальная тренировка","интервалы","кардио в зоне 2","низкоинтенсивное кардио","табата"],"a":"HIIT экономит время: 15–20 минут, например 30 секунд быстро / 90 секунд медленно ×8. Но он утомляет, больше 2 раз в неделю не нужно. Спокойное кардио (пульс, при котором можешь говорить) можно делать часто и долго. Оптимально сочетать: 1–2 интервальных и 2–3 спокойных."},{"c":"Тренировки","q":"Правда, что жир начинает гореть только через 30 минут кардио?","k":["жир горит после 30 минут","жиросжигание через 20 минут","миф 30 минут","когда начинает гореть жир"],"a":"Миф. Организм использует жиры и углеводы в любой момент, просто в разных пропорциях. Для похудения важен общий расход калорий за день и неделю, а не минута, на которой «включился жир». 15 минут тоже засчитываются."},{"c":"Тренировки","q":"Кардио натощак сжигает больше жира?","k":["кардио натощак","бег натощак","утреннее кардио на голодный желудок","тренировка натощак жир"],"a":"На длинной дистанции разницы в потере жира нет — решает суточный дефицит калорий. Натощак можно, если тебе так комфортно. Если кружится голова или нет сил — съешь лёгкий перекус за 30–60 минут: банан или йогурт."},{"c":"Тренировки","q":"Шаги считаются за кардио? Сколько ходить?","k":["шаги","10000 шагов","ходьба","сколько шагов в день","ходьба для похудения","neat"],"a":"Да, ходьба — отличная базовая активность. Ориентир — 7–10 тыс. шагов в день: это 250–400 ккал и почти ноль нагрузки на восстановление. Если сейчас 4 тыс., добавляй по 1–2 тыс. в неделю."},{"c":"Тренировки","q":"Как начать бегать с нуля?","k":["бег с нуля","начать бегать","бег для начинающих","как научиться бегать","не могу бежать долго"],"a":"Начни с чередования: 1 минута бега / 2 минуты ходьбы ×8–10, 3 раза в неделю. Каждую неделю увеличивай бег и уменьшай ходьбу; через 6–8 недель выйдешь на 20–30 минут без остановки. Темп — такой, чтобы мог говорить. Общий объём увеличивай не больше чем на 10% в неделю."},{"c":"Тренировки","q":"Как правильно бегать, чтобы не болели колени?","k":["техника бега","болят колени от бега","бег колени","правильный бег","кроссовки для бега"],"a":"Делай короткие частые шаги (около 170–180 в минуту), ставь стопу под себя, а не далеко вперёд. Не наращивай объём резко и бегай в удобных кроссовках. Укрепляй ноги и ягодицы силовыми 2 раза в неделю. Если боль острая или держится дольше нескольких дней — остановись и обратись к врачу."},{"c":"Тренировки","q":"Можно ли совмещать бег и тренажёрный зал?","k":["бег и зал","бег мешает массе","силовые и бег","бегать и качаться","бег сжигает мышцы"],"a":"Можно. Умеренный бег 2–3 раза в неделю по 20–40 минут почти не мешает росту мышц, если ешь достаточно. Разводи тяжёлые ноги и интенсивный бег по разным дням. Мышцы «сгорают» не от бега, а от большого дефицита калорий и белка."},{"c":"Тренировки","q":"Нужна ли скакалка, и как с ней заниматься?","k":["скакалка","прыжки на скакалке","скакалка для похудения","скакалка кардио"],"a":"Скакалка — компактное интенсивное кардио. Начни с 10–15 интервалов по 30 секунд прыжков / 30 секунд отдыха. Прыгай на носках, невысоко, вращай кистями. При лишнем весе или проблемах с коленями начинай с ходьбы или велосипеда."},{"c":"Тренировки","q":"Когда лучше тренироваться — утром или вечером?","k":["утром или вечером","лучшее время для тренировки","утренняя тренировка","вечерняя тренировка","тренировка поздно вечером"],"a":"Лучшее время — то, в которое ты стабильно можешь ходить. Вечером сила обычно немного выше, утром проще не пропускать. Утром дай себе более долгую разминку. Если тренируешься поздно и плохо засыпаешь — заканчивай за 2–3 часа до сна."},{"c":"Тренировки","q":"Можно ли тренироваться перед сном?","k":["тренировка перед сном","поздняя тренировка","тренировка в 22","не могу уснуть после зала"],"a":"Можно, большинство людей спит нормально. Если сон ухудшается — заканчивай за 2–3 часа до сна, убери предтреники и кофеин после 14–16 часов, сделай заминку. После тренировки нормально поесть, например творог или яйца с хлебом."},{"c":"Тренировки","q":"Можно ли тренироваться, если болят мышцы после прошлой тренировки?","k":["крепатура","болят мышцы после тренировки","забились мышцы","можно ли тренироваться с болью в мышцах","мышцы болят на второй день"],"a":"Отсроченная боль (крепатура) обычная через 24–72 часа, особенно после нового упражнения. Тренироваться можно: начни с лёгкой разминки, боль часто уменьшается. Если мышца сильно болит — нагрузи другую группу. Острая боль в суставе или резкая боль во время движения — повод остановиться и обратиться к врачу."},{"c":"Тренировки","q":"Нужны ли дни отдыха?","k":["день отдыха","отдых от тренировок","сколько отдыхать между тренировками","восстановление мышц","можно без выходных"],"a":"Да, мышцы растут во время восстановления. Одну мышечную группу тяжело нагружай не чаще чем раз в 48 часов. Минимум 1–2 дня в неделю без силовых. В день отдыха полезна ходьба и лёгкая растяжка."},{"c":"Тренировки","q":"Можно ли тренироваться при простуде?","k":["тренировка при простуде","можно ли в зал с насморком","заболел тренировка","температура тренировка"],"a":"Правило шеи: если симптомы только выше шеи (насморк, лёгкое першение) — можно лёгкую тренировку. При температуре, ломоте, кашле в груди, слабости — отдыхай полностью. После болезни с температурой возвращайся постепенно, с 50–70% нагрузки."},{"c":"Тренировки","q":"Почему кружится голова на тренировке?","k":["кружится голова","темнеет в глазах","тошнит на тренировке","плохо на тренировке","голова кружится в зале"],"a":"Частые причины: мало еды или воды, резкий подъём из положения лёжа, задержка дыхания при натуживании. Остановись, сядь, попей воды. Ешь за 1,5–3 часа до тренировки и дыши ровно. Если повторяется, сопровождается болью в груди, одышкой или обмороком — прекрати тренировки и обратись к врачу."},{"c":"Тренировки","q":"Как правильно дышать при выполнении упражнений?","k":["дыхание при упражнениях","как дышать","дыхание в жиме","вдох выдох","задержка дыхания"],"a":"Общее правило: вдох в лёгкой фазе, выдох при усилии. В тяжёлом приседе и становой опытные атлеты делают вдох животом и держат корпус напряжённым на 1–2 повтора — это нормально, но при давлении и проблемах с сердцем от этого лучше отказаться. В лёгких упражнениях просто не задерживай дыхание."},{"c":"Тренировки","q":"Нужен ли пояс для тяжёлой атлетики?","k":["пояс","атлетический пояс","пояс для становой","нужен ли пояс","пояс на присед"],"a":"Новичку не нужен: сначала научись держать корпус сам. Пояс полезен в тяжёлых подходах приседа и становой (от 80% максимума), помогает создать внутрибрюшное давление. На лёгких подходах и в изоляции его не надевай."},{"c":"Тренировки","q":"Нужны ли лямки и перчатки?","k":["лямки","кистевые лямки","перчатки для зала","хват устаёт","мозоли на руках"],"a":"Лямки полезны, когда хват сдаётся раньше спины — в тяжёлых тягах. Но хват тоже тренируй: часть подходов делай без лямок, добавь висы. Перчатки по желанию, против мозолей; мел даёт лучший хват. Мозоли — норма, их можно спиливать пемзой."},{"c":"Тренировки","q":"Как правильно приседать со штангой?","k":["техника приседа","приседания со штангой","как приседать","присед правильно","спина в приседе"],"a":"Ноги на ширине плеч или чуть шире, носки на 15–30° врозь. Вдох, напряги корпус, начни движение тазом назад и коленями вперёд одновременно, колени идут по линии носков. Опускайся до параллели или глубже с нейтральной спиной. Вставай, толкая пол всей стопой. Для начала сними себя на видео сбоку."},{"c":"Тренировки","q":"Как правильно делать становую тягу?","k":["техника становой","становая тяга","как делать становую","становая болит спина","становая правильно"],"a":"Штанга над серединой стопы, гриф почти касается голени. Таз выше колен, спина прямая, лопатки над грифом. Вдох, напряги корпус, «выжимай пол» ногами, гриф скользит по ногам. Наверху встань прямо, не прогибаясь назад. Опускай так же, отводя таз назад. Если округляется поясница — снизь вес."},{"c":"Тренировки","q":"Как правильно жать лёжа?","k":["жим лёжа техника","как жать лёжа","жим лёжа плечи болят","жим штанги лёжа","мост в жиме"],"a":"Лопатки сведи и опусти, небольшой прогиб в грудном отделе, ноги упираются в пол. Хват чуть шире плеч, локти под 45–70° к корпусу, а не в стороны на 90°. Опускай гриф на низ груди с контролем, выжимай вверх и немного к лицу. Обязательно страховщик или стопоры на тяжёлых подходах."},{"c":"Тренировки","q":"Болит спина после становой или приседа — что делать?","k":["болит спина после становой","поясница после приседа","сорвал спину","боль в пояснице зал","прострел спина"],"a":"Лёгкая мышечная усталость в спине проходит за 1–3 дня — двигайся, гуляй. Уменьши вес и проверь технику по видео. Острая боль, боль, отдающая в ногу, онемение или слабость в ноге — остановись и обратись к врачу, не тренируйся через боль."},{"c":"Тренировки","q":"Щёлкают суставы на тренировке — это опасно?","k":["хрустят суставы","щелкают колени","хруст в плечах","щелчки в суставах"],"a":"Безболезненные щелчки и хруст обычно безопасны — это газ в суставной жидкости или скольжение сухожилий. Повод насторожиться — если щелчок сопровождается болью, отёком или нестабильностью. Тогда снизь нагрузку и обратись к врачу."},{"c":"Тренировки","q":"Девушка не перекачается от силовых?","k":["перекачаюсь","девушке качаться","станут ли ноги большими","девушка в зале","боюсь перекачаться","женщины и штанга"],"a":"Нет. У женщин в 10–20 раз меньше тестостерона, и мышцы растут медленно: 0,25–0,5 кг в месяц в лучшем случае на старте. Объём «перекачанности» обычно даёт жир над мышцами, а не сами мышцы. Силовые с весами делают фигуру подтянутой и улучшают обмен веществ."},{"c":"Тренировки","q":"Как тренироваться девушке в зале?","k":["тренировки для девушек","программа для девушки","девушка с чего начать","женская программа"],"a":"Принципы те же, что у мужчин: 3 тренировки в неделю, база (присед, румынская тяга, ягодичный мост, тяга блока, жим гантелей, отжимания) и постепенное увеличение веса. Больше акцента на ягодицы и спину можно добавить по желанию. Розовые гантели по 1 кг на 50 повторов результата почти не дадут."},{"c":"Тренировки","q":"Можно ли тренироваться во время месячных?","k":["тренировки и месячные","менструация тренировка","зал во время месячных","критические дни спорт"],"a":"Можно, если самочувствие нормальное: лёгкая и умеренная нагрузка часто даже уменьшает спазмы. В первые 1–2 дня снизь интенсивность или выбери ходьбу, йогу, растяжку. Перевёрнутые позы запрета не имеют. Очень сильная боль или обильное кровотечение — повод обратиться к врачу."},{"c":"Тренировки","q":"Как менять тренировки по фазам цикла?","k":["тренировки по циклу","фазы цикла и спорт","фолликулярная фаза тренировки","лютеиновая фаза сила","цикл и сила"],"a":"Строгой привязки не требуется — данные о преимуществах «циклических» программ слабые. Ориентируйся на самочувствие: в дни, когда сил больше, работай тяжелее; перед и в первые дни месячных можно снизить вес или объём. Во второй половине цикла вес на весах может подрастать на 0,5–2 кг из-за воды — это нормально."},{"c":"Тренировки","q":"Можно ли тренироваться при беременности?","k":["беременность тренировки","спорт при беременности","зал беременной","упражнения беременным"],"a":"Обычно умеренная активность при беременности полезна, но объём и упражнения обязательно согласуй с врачом. Как правило, избегают контактных видов спорта, падений, работы до отказа и долгого лежания на спине после первого триместра. Боль, кровотечение, головокружение — немедленно остановись и обратись к врачу."},{"c":"Тренировки","q":"Как вернуться к тренировкам после родов?","k":["после родов тренировки","восстановление после родов","диастаз","живот после родов","тренировки после кесарева"],"a":"Сначала получи разрешение врача: обычно через 6–8 недель после естественных родов и позже после кесарева. Начни с дыхания, мышц тазового дна, ходьбы и лёгких упражнений на корпус. Проверь диастаз; при нём не делай классические скручивания, пока специалист не разрешит. Нагрузку повышай постепенно."},{"c":"Тренировки","q":"Можно ли подростку качаться?","k":["подросток в зале","со скольки лет в зал","качаться в 14 лет","силовые подросткам","рост и штанга"],"a":"Можно с 12–14 лет под присмотром тренера и с хорошей техникой. Миф, что штанга «останавливает рост», не подтверждён. Начни с собственного веса и умеренных весов на 8–15 повторов, без попыток на максимум. Важен сон 8–10 часов и нормальное питание."},{"c":"Тренировки","q":"Не поздно начинать тренироваться в 40–50 лет?","k":["тренировки после 40","тренировки после 50","не поздно ли начать","силовые в возрасте","зал в 45"],"a":"Не поздно — мышцы растут в любом возрасте, а силовые после 40 особенно важны для костей, суставов и обмена веществ. Начни с умеренных весов, увеличь разминку до 10–15 минут, прибавляй постепенно. Если есть давление, болезни сердца или суставов — сначала обсуди нагрузку с врачом."},{"c":"Тренировки","q":"Как тренироваться пожилым людям?","k":["тренировки после 60","пожилым зал","силовые для пожилых","упражнения для пожилых","тренировки в 65"],"a":"Силовые 2–3 раза в неделю: приседания со стула, жим ногами, тяга блока, отжимания от стены или стола, по 2–3 подхода по 10–15. Добавь упражнения на равновесие (стойка на одной ноге у опоры) и ежедневные прогулки. Нагрузку согласуй с врачом при хронических болезнях."},{"c":"Тренировки","q":"Как вернуться к тренировкам после перерыва?","k":["перерыв в тренировках","вернуться в зал","после долгого перерыва","забросил тренировки","снова начать заниматься"],"a":"Начни с 50–60% прежних весов и 2/3 объёма. Первые 1–2 недели — без отказа, чтобы не словить сильную крепатуру. Мышечная память работает: вернуться к прежним весам обычно получается за 3–8 недель — быстрее, чем на старте."},{"c":"Тренировки","q":"Сколько времени уходят мышцы, если не тренироваться?","k":["мышцы уходят","потеря мышц без тренировок","через сколько пропадет форма","детренированность","отпуск без зала"],"a":"За 1–2 недели мышцы почти не теряются — уходят вода и гликоген, сила может даже вырасти от отдыха. Заметная потеря силы и массы начинается через 3–4 недели. Если ешь белок и хотя бы 1–2 раза в неделю делаешь что-то силовое, форма держится долго."},{"c":"Тренировки","q":"Что делать, если пропустил тренировку?","k":["пропустил тренировку","пропустил день","не пошёл в зал","пропуск тренировки"],"a":"Ничего страшного — просто сделай следующую по плану. Не пытайся втиснуть две тренировки в один день. Если пропуски регулярные — сократи программу до реальных 2–3 дней в неделю."},{"c":"Тренировки","q":"Как найти мотивацию ходить в зал регулярно?","k":["нет мотивации","лень идти в зал","как не бросить","мотивация к тренировкам","постоянно бросаю"],"a":"Опирайся на привычку, а не на мотивацию: фиксированные дни и время, сумка собрана заранее. Ставь маленькие цели (+2,5 кг в жиме за месяц) и записывай тренировки — прогресс в цифрах мотивирует. В тяжёлый день договорись с собой сделать хотя бы разминку и одно упражнение."},{"c":"Тренировки","q":"Как тренироваться после травмы?","k":["после травмы","травма и тренировки","восстановление после травмы","вернуться после травмы"],"a":"Сначала — разрешение врача и, по возможности, программа реабилитации. Тренируй то, что не болит, а повреждённую зону возвращай с очень лёгких весов и полной амплитуды без боли. Повышай нагрузку на 10–20% в неделю. Боль, отёк или нестабильность — повод остановиться и показаться врачу снова."},{"c":"Тренировки","q":"Можно ли тренироваться с больными коленями?","k":["болят колени","колени и присед","больные колени зал","упражнения при больных коленях"],"a":"Часто да, но сначала нужен диагноз от врача. Обычно хорошо переносятся жим ногами в комфортной амплитуде, ягодичный мост, румынская тяга, приседания на ящик, велосипед. Боль во время упражнения до 2–3 из 10, которая не усиливается на следующий день, как правило, допустима. Острая боль, отёк, блок колена — остановись и обратись к врачу."},{"c":"Тренировки","q":"Почему одна сторона тела сильнее другой?","k":["асимметрия","одна рука сильнее","одна сторона больше","дисбаланс мышц"],"a":"Небольшая асимметрия — норма. Добавь упражнения на одну сторону: жим и тяга одной гантелью, болгарские сплит-приседания. Начинай со слабой стороны и делай на сильную столько же повторов, сколько смог слабой. Обычно разница уменьшается за 2–3 месяца."},{"c":"Тренировки","q":"Свободные веса или тренажёры — что лучше?","k":["тренажёры или штанга","свободные веса","машины или гантели","тренажёры для новичка","смит"],"a":"Оба варианта работают для роста мышц. Свободные веса развивают координацию и стабилизаторы, тренажёры проще в освоении и позволяют безопасно работать близко к отказу. Оптимально сочетать: база со штангой или гантелями плюс тренажёры для изоляции."},{"c":"Тренировки","q":"Сколько упражнений делать за тренировку?","k":["сколько упражнений","количество упражнений","упражнений на мышцу","сколько упражнений на тренировку"],"a":"Обычно 4–7 упражнений за тренировку. На одну мышцу за сессию хватает 1–3 упражнения. Начинай с самого тяжёлого базового, заканчивай изоляцией. Если упражнений больше 8, качество последних обычно падает."},{"c":"Тренировки","q":"В каком порядке делать упражнения?","k":["порядок упражнений","что делать сначала","база или изоляция сначала","последовательность упражнений"],"a":"Сначала — тяжёлые многосуставные упражнения, пока ты свеж (присед, жим, тяга). Затем вспомогательные, потом изоляция, пресс и кардио в конце. Приоритетную отстающую мышцу можно ставить первой."},{"c":"Тренировки","q":"Почему у меня не растут мышцы?","k":["мышцы не растут","нет результата","занимаюсь но не расту","не набираю массу","почему нет прогресса"],"a":"Проверь 4 вещи: профицит калорий 200–300 ккал и белок 1,6–2,2 г/кг; прогрессию — растут ли веса или повторы; достаточно ли тяжёлые подходы (0–3 повтора в запасе); сон 7–9 часов. Записывай тренировки и вес тела, иначе сложно понять, что не так."},{"c":"Тренировки","q":"Как быстро будет виден результат?","k":["когда будет результат","через сколько видно мышцы","сколько ждать результат","как быстро накачаться"],"a":"Сила растёт уже в первые 2–4 недели, визуальные изменения заметны через 2–3 месяца регулярных тренировок. Новичок может набрать 0,5–1 кг мышц в месяц в первый год, потом медленнее. Фото раз в 2–4 недели при одинаковом свете помогают увидеть прогресс."},{"c":"Тренировки","q":"Можно ли тренировать одну группу мышц каждый день?","k":["одну мышцу каждый день","качать бицепс каждый день","ежедневная тренировка одной группы","та же мышца два дня подряд"],"a":"Тяжело — нет: мышце нужно 48–72 часа на восстановление. Лёгкие подходы на мелкие группы (пресс, икры, задняя дельта) можно делать чаще, если общий объём умеренный. Лучше 2–3 качественные тренировки мышцы в неделю."},{"c":"Тренировки","q":"Что такое RIR и RPE?","k":["rir","rpe","повторы в запасе","шкала усилий","сколько повторов в запасе"],"a":"RIR — сколько повторов ты мог бы ещё сделать (RIR 2 = остановился за 2 до отказа). RPE — оценка тяжести от 1 до 10, где 10 — отказ; RPE 8 ≈ RIR 2. Для роста мышц большинство подходов делай при RIR 0–3 (RPE 7–10)."},{"c":"Тренировки","q":"Как узнать свой максимум (1ПМ) без риска?","k":["1пм","разовый максимум","одноповторный максимум","посчитать максимум","сколько я жму на раз"],"a":"Не обязательно жать на раз. Сделай подход на 3–5 повторов до RIR 0–1 и посчитай: максимум ≈ вес × (1 + повторы / 30). Например, 80 кг × 5 → около 93 кг. Если всё-таки проверяешь максимум — с хорошей разминкой и страховщиком."},{"c":"Тренировки","q":"Как тренироваться, если очень мало времени?","k":["мало времени","тренировка 30 минут","быстрая тренировка","нет времени на зал","короткая тренировка"],"a":"2–3 тренировки по 30–40 минут на всё тело дадут большую часть результата. Выбери 4–5 базовых упражнений, сделай по 2–3 тяжёлых подхода, объединяй их в суперсеты (например, жим + тяга). Разминка короткая, но обязательная: 3–5 минут и 1–2 разминочных подхода."},{"c":"Тренировки","q":"Помогает ли пот похудеть, и есть ли смысл в пленке и костюме-сауне?","k":["пленка для похудения","сауна костюм","потеть похудеть","обмотаться пленкой","чем больше потеешь тем больше худеешь"],"a":"Нет. Пот — это вода, которая возвращается, как только попьёшь. Плёнка и костюмы-сауны лишь повышают риск перегрева и обезвоживания. Жир уходит от дефицита калорий, а не от пота."},{"c":"Тренировки","q":"Сколько пить воды на тренировке?","k":["вода на тренировке","пить во время тренировки","сколько воды пить в зале","обезвоживание тренировка"],"a":"Ориентир — 150–250 мл каждые 15–20 минут или по жажде, примерно 0,5–1 л за часовую тренировку. В жару и при сильном потоотделении больше. Для тренировки до часа обычной воды достаточно."},{"c":"Тренировки","q":"Как тренироваться при лишнем весе, чтобы не навредить суставам?","k":["лишний вес тренировки","ожирение спорт","тренировки при большом весе","суставы при лишнем весе","толстый в зале"],"a":"Выбирай нагрузку с малой ударной составляющей: ходьба, велосипед, эллипс, плавание. Силовые 2–3 раза в неделю в тренажёрах и с гантелями — они защищают суставы. Прыжки и бег отложи до снижения веса. Если есть давление, диабет или проблемы с сердцем — согласуй старт с врачом."},{"c":"Тренировки","q":"Нужен ли персональный тренер?","k":["персональный тренер","нужен ли тренер","тренироваться самому или с тренером","стоит ли брать тренера"],"a":"Не обязательно, но 3–5 занятий в начале помогут поставить технику базовых упражнений и избежать ошибок. Дальше можно тренироваться самостоятельно, периодически снимая себя на видео. Хороший тренер объясняет «почему» и строит прогрессию, а не просто считает повторы."},{"c":"Тренировки","q":"Медленный или быстрый темп выполнения?","k":["темп повторений","медленные повторы","быстро или медленно делать","негативная фаза","взрывные повторы"],"a":"Рабочий ориентир: опускание с контролем 2–3 секунды, подъём — уверенно, без рывка. Сверхмедленные повторы (10 секунд) не дают преимущества и снижают рабочий вес. Для силы и мощности полезно поднимать как можно быстрее при чистой технике."},{"c":"Тренировки","q":"Почему трясутся мышцы во время подхода?","k":["трясутся руки","дрожат мышцы","трясёт в подходе","дрожь в мышцах"],"a":"Это нормальная усталость нервной системы и мышц, особенно у новичков и при близости к отказу. С опытом и укреплением стабилизаторов дрожь уменьшается. Если дрожь сопровождается слабостью и головокружением — проверь, поел ли ты, и остановись."},{"c":"Программа","q":"Зачем в программе тяжёлые и лёгкие дни?","k":["тяжёлый и лёгкий день","волновая периодизация","лёгкая тренировка зачем","разная нагрузка по дням","heavy light"],"a":"Это волнообразная нагрузка: в тяжёлый день работаешь с большим весом и малыми повторами (например, 4×5), в лёгкий — с меньшим весом на технику и объём (3×10–12 на 70%). Так мышцы получают частую нагрузку, а нервная система и суставы успевают восстановиться. Лёгкий день не пропускай — он часть прогресса."},{"c":"Программа","q":"Что такое разгрузочная неделя и когда её делать?","k":["разгрузка","разгрузочная неделя","deload","делоад","неделя отдыха","когда делать разгрузку"],"a":"Это неделя со сниженной нагрузкой: те же упражнения, но на 40–50% меньше подходов или на 10–20% меньше вес. Делай раз в 4–8 недель или когда падает сила, плохой сон, ноют суставы и нет желания тренироваться. После разгрузки обычно приходит прибавка в весах."},{"c":"Программа","q":"Что такое суперсеты и стоит ли их делать?","k":["суперсет","суперсеты","сеты подряд","два упражнения без отдыха","трисет"],"a":"Суперсет — два упражнения подряд без отдыха, затем отдых. Лучше всего сочетать противоположные мышцы: жим + тяга, бицепс + трицепс — это экономит 20–30% времени без потери качества. Для тяжёлой базы (присед, становая) суперсеты не нужны."},{"c":"Программа","q":"Как менять тренировки на массонаборе?","k":["набор массы тренировки","массонабор","тренировки на массе","как качаться на массу","программа на массу"],"a":"Главное — профицит 200–300 ккал и белок 1,6–2,2 г/кг. Тренировки: 10–20 подходов на мышцу в неделю, 6–12 повторов, прогрессия весов. Объём можно постепенно увеличивать, ведь энергии хватает. Кардио оставь 2–3 раза по 20–30 минут для здоровья."},{"c":"Программа","q":"Как менять тренировки на сушке?","k":["сушка тренировки","как тренироваться на сушке","сушка много повторов","программа на сушку","тренировка при похудении"],"a":"Главное — сохранить мышцы: оставь тяжёлые веса и базу, не переходи на «лёгкий вес на 30 повторов». Объём можно снизить на 20–30%, если плохо восстанавливаешься. Добавь шаги до 8–12 тыс. и 2–4 кардио-сессии. Дефицит — 300–500 ккал, белок до 2–2,2 г/кг."},{"c":"Программа","q":"Что такое рекомпозиция — набор мышц и потеря жира одновременно?","k":["рекомпозиция","рекомп","набрать мышцы и сбросить жир","одновременно похудеть и накачаться"],"a":"Это реально для новичков, тех, кто возвращается после перерыва, и людей с лишним весом. Нужно: калории около поддержки или небольшой дефицит 200–300 ккал, белок 2 г/кг, силовые с прогрессией 3–4 раза в неделю, сон 7–9 часов. Вес на весах может почти не меняться — следи за обхватами и фото."},{"c":"Программа","q":"Что лучше — фулбади или сплит?","k":["фулбади","сплит","full body","верх низ","push pull legs","какой сплит выбрать"],"a":"При 2–3 тренировках в неделю лучше фулбади. При 4 — верх/низ. При 5–6 — тяни/толкай/ноги. Результат определяют общий объём на мышцу и частота 2 раза в неделю, а не название схемы — выбирай ту, что подходит твоему графику."},{"c":"Программа","q":"Как часто менять программу?","k":["менять программу","мышцы привыкают","сменить упражнения","шокировать мышцы","как долго делать одну программу"],"a":"Пока растут веса и повторы — не меняй. Обычно программу держат 8–12 недель, затем меняют диапазон повторов или пару упражнений. Миф про «мышцы привыкают» неверен: они привыкают к одинаковому весу, поэтому решает прогрессия, а не постоянная новизна."},{"c":"Программа","q":"Что такое периодизация?","k":["периодизация","линейная периодизация","циклы тренировок","мезоцикл","блоковая периодизация"],"a":"Это плановое изменение нагрузки во времени. Пример: 3–5 недель с постепенным ростом веса или объёма, затем разгрузочная неделя и новый цикл с чуть более высокой стартовой точкой. Новичку достаточно простой прогрессии от тренировки к тренировке, сложная периодизация нужна позже."},{"c":"Программа","q":"Что такое прогрессивная перегрузка?","k":["прогрессивная перегрузка","прогрессия нагрузки","progressive overload","как прогрессировать"],"a":"Это постепенное увеличение нагрузки, без которого нет роста: больше вес, больше повторов, больше подходов, лучше техника или амплитуда. Записывай каждую тренировку и пытайся хоть немного побить прошлый результат. Прогресс не всегда линейный, но тренд за месяц должен быть вверх."},{"c":"Программа","q":"Как построить тренировочную неделю?","k":["составить программу","план на неделю","как распланировать тренировки","расписание тренировок","структура недели"],"a":"Определи число дней (3–5) и выбери схему: фулбади, верх/низ или ТТН. В каждый день поставь 1–2 базовых упражнения, 2–3 вспомогательных и 1–2 изолирующих. Проверь, что каждая мышца получает 10–20 подходов в неделю и отдыхает 48 часов. Кардио — в дни отдыха или после силовой."},{"c":"Программа","q":"Что такое дропсет и рест-пауза?","k":["дропсет","рест пауза","drop set","rest pause","интенсивные техники"],"a":"Дропсет: делаешь подход до отказа, сразу снимаешь 20–30% веса и продолжаешь, 1–2 сброса. Рест-пауза: подход до отказа, 15–20 секунд отдыха, ещё несколько повторов, ещё раз. Это экономит время в изоляции, но сильно утомляет. Используй в последнем подходе 1–2 упражнений, а не во всей тренировке."},{"c":"Восстановление","q":"Сколько нужно спать, чтобы росли мышцы?","k":["сколько спать для роста мышц","сон и тренировки","мало сплю можно ли тренироваться","норма сна спортсмену","сон для восстановления"],"a":"Ориентир — 7–9 часов в сутки. При сне меньше 6 часов падают силовые, хуже восстановление и аппетит сложнее контролировать. Ложись и вставай в одно время, даже в выходные. Если ночью недоспал, дневной сон 20–30 минут частично выручает."},{"c":"Восстановление","q":"Как улучшить сон после вечерней тренировки?","k":["не могу уснуть после тренировки","бессонница после зала","вечерняя тренировка и сон","трудно заснуть после трени","возбуждение после тренировки"],"a":"Заканчивай тяжёлую тренировку за 2–3 часа до сна. Не пей кофе и предтрены после 15–16 часов. После зала — тёплый душ, лёгкий ужин и приглушённый свет. За час до сна убери телефон, в спальне держи 18–20 °C и темноту."},{"c":"Восстановление","q":"Что такое крепатура и почему болят мышцы на следующий день?","k":["крепатура","болят мышцы после тренировки","мышцы болят на второй день","забитость мышц","DOMS","почему болит после зала"],"a":"Это отсроченная мышечная боль: микроповреждения волокон после непривычной нагрузки. Пик — через 24–72 часа, проходит сама за 3–5 дней. Она не показатель эффективности тренировки: со временем к той же нагрузке боль почти пропадает. Это не молочная кислота — та уходит из мышц за час."},{"c":"Восстановление","q":"Как быстрее избавиться от крепатуры?","k":["как убрать крепатуру","что делать если болят мышцы","как снять боль в мышцах после зала","мышцы болят что делать","ускорить восстановление мышц"],"a":"Лучше всего помогает лёгкое движение: прогулка 20–30 минут, велосипед, разминка той же группы с малым весом. Немного облегчают массаж, ролл и тёплая ванна. Высыпайся и добирай белок. Обезболивающие ради крепатуры пить не нужно — она проходит сама."},{"c":"Восстановление","q":"Можно ли тренироваться, если мышцы ещё болят?","k":["тренироваться с крепатурой","болят мышцы идти ли в зал","трениться если болит после прошлой","крепатура тренировка","можно ли качаться через боль в мышцах"],"a":"Если это лёгкая тянущая крепатура — да, после разминки она обычно стихает. Если мышца болит сильно и амплитуда ограничена, сделай тренировку на другие группы или снизь вес на 20–30%. Острая, колющая или односторонняя боль в суставе — не крепатура, такое упражнение пропусти."},{"c":"Восстановление","q":"Сколько отдыхать между тренировками одной группы мышц?","k":["сколько дней отдыхать между тренировками","через сколько тренировать ту же мышцу","перерыв между тренировками","отдых между занятиями","можно ли каждый день качать одно и то же"],"a":"Обычно 48–72 часа между тяжёлыми тренировками одной группы. Поэтому схемы «фулбади через день» или «верх/низ» работают хорошо. Мелкие мышцы и пресс восстанавливаются быстрее. Ориентируйся на самочувствие: если веса в рабочих подходах падают, отдыхай дольше."},{"c":"Восстановление","q":"Сколько дней в неделю нужно отдыхать?","k":["сколько выходных от зала","дни отдыха в неделю","можно ли тренироваться каждый день","нужен ли отдых от тренировок","без выходных в зал"],"a":"Новичку и большинству любителей хватает 3–4 тренировок в неделю и 3–4 дней отдыха. Хотя бы 1–2 дня в неделю без силовой нагрузки нужны всем. В дни отдыха полезна активность: ходьба 8–10 тысяч шагов, лёгкое кардио, растяжка."},{"c":"Восстановление","q":"Что такое перетренированность и как её распознать?","k":["перетренированность признаки","перетрен","признаки переутомления от спорта","как понять что перетренировался","синдром перетренированности"],"a":"Признаки: веса падают 2+ недели подряд, постоянная усталость, плохой сон, раздражительность, пропал аппетит или желание тренироваться, пульс в покое выше обычного на 5–10 ударов. У любителей чаще бывает недовосстановление из-за сна, стресса и питания, а не настоящая перетренированность. Помогает разгрузочная неделя и наведение порядка со сном и едой."},{"c":"Восстановление","q":"Что делать при перетренированности?","k":["перетренировался что делать","как восстановиться после перетренированности","выгорел от зала","нет прогресса и усталость","как выйти из перетрена"],"a":"Сделай разгрузочную неделю: те же упражнения с 60% рабочего веса и меньшим числом подходов. Спи 8+ часов, ешь не в дефиците, белок 1,6–2,2 г/кг. Если через 2 недели не стало лучше или есть необычные симптомы (сердцебиение, долгая слабость) — сходи к врачу и сдай базовые анализы."},{"c":"Восстановление","q":"Нет сил на тренировку — идти или пропустить?","k":["нет сил на тренировку","не хочу идти в зал","устал идти ли на тренировку","лень тренироваться","нет энергии в зал"],"a":"Начни с разминки и первого упражнения: часто через 10 минут силы появляются. Если нет — сделай короткую тренировку на 70% веса или только базу. Если несколько тренировок подряд без сил, ищи причину: сон, еда (дефицит калорий), стресс, болезнь. В приложении для таких дней есть отметка плохого сна — вес снизится на 10%."},{"c":"Восстановление","q":"Руки «забиты» и не разгибаются после тренировки — что делать?","k":["руки забиты","бицепс забит не разгибается рука","не могу разогнуть руку после зала","забились руки","руки не сгибаются после тренировки"],"a":"После непривычной работы на бицепс это частая крепатура: делай лёгкие движения, разгибай руку без рывков, тёплый душ. Через 3–5 дней обычно проходит. Срочно к врачу, если сильный отёк, рука твёрдая, моча стала тёмной (цвета чая или колы) — это признаки рабдомиолиза. Не тренируй эту группу, пока боль не уйдёт."},{"c":"Восстановление","q":"Помогает ли массаж восстановиться?","k":["массаж после тренировки","спортивный массаж","нужен ли массаж","массаж для мышц","массаж и крепатура"],"a":"Массаж немного уменьшает крепатуру и даёт ощущение лёгкости, но рост мышц не ускоряет. Это приятное дополнение, а не обязательное условие. Сон, еда и разумная нагрузка важнее. Если сильная боль — массаж не заменяет врача."},{"c":"Восстановление","q":"Как пользоваться массажным роллом?","k":["ролл для мышц","мфр","массажный ролик как пользоваться","фоам роллер","раскатка мышц","роллер для спины"],"a":"Катай мышцу медленно 30–60 секунд, на болезненной точке задержись на 10–20 секунд и дыши. Не катай по суставам, позвоночнику и пояснице, по передней поверхности шеи. Можно до тренировки 2–3 минуты как часть разминки и после, чтобы расслабиться. Боль должна быть терпимой — до 6–7 из 10."},{"c":"Восстановление","q":"Полезна ли баня или сауна после тренировки?","k":["баня после зала","сауна после тренировки","можно ли в баню после трени","парилка и спорт","хамам после тренировки"],"a":"Можно, если хорошо переносишь: многим это помогает расслабиться. Подожди 20–30 минут после тренировки, выпей воды. Заходы по 5–15 минут, всего не больше 3–4. Не ходи в баню при высоком давлении, температуре, головокружении и сразу после тяжёлой изнуряющей тренировки."},{"c":"Восстановление","q":"Полезен ли холодный душ после тренировки?","k":["холодный душ после зала","ледяная ванна","контрастный душ","закаливание и тренировки","криотерапия"],"a":"Холодный душ бодрит и уменьшает ощущение крепатуры. Но регулярные ледяные ванны сразу после силовой могут немного снижать прирост мышц — если цель масса, ставь холод через 4+ часа или в дни отдыха. Контрастный душ 2–3 минуты — нормальный вариант. При болезнях сердца и давлении сначала посоветуйся с врачом."},{"c":"Восстановление","q":"Как стресс влияет на тренировки?","k":["стресс и тренировки","нервы мешают прогрессу","стресс на работе и зал","кортизол и мышцы","сессия и тренировки"],"a":"Сильный стресс ухудшает сон и восстановление, силы падают. В такие периоды не гонись за рекордами: держи рабочие веса или снизь на 10%, сократи число подходов. При этом умеренная тренировка сама снижает стресс. Главное — сон и регулярность, а не тяжесть."},{"c":"Восстановление","q":"Можно ли тренироваться, если плохо спал?","k":["не выспался идти в зал","плохо спал тренировка","тренировка после бессонной ночи","мало поспал можно качаться","недосып и зал"],"a":"Можно, но облегчённо: сними 10% с рабочих весов и не делай подходы до отказа. После недосыпа выше риск травмы и ниже сила. В приложении отметь плохой сон перед тренировкой — оно само снизит веса на 10%. Если не спал совсем, лучше прогулка или лёгкое кардио."},{"c":"Восстановление","q":"Что съесть после тренировки для восстановления?","k":["что есть после тренировки","питание после зала","еда после трени","белок после тренировки","углеводное окно"],"a":"В течение 1–3 часов поешь нормально: 25–40 г белка и углеводы. Примеры: курица с рисом, творог с бананом, омлет с хлебом, протеин с овсянкой. Жёсткого «углеводного окна» в 30 минут нет — важнее белок за весь день: 1,6–2,2 г на кг веса."},{"c":"Восстановление","q":"Помогает ли растяжка после тренировки?","k":["растяжка после зала","заминка","нужно ли тянуться","стретчинг после тренировки","растягиваться ли после качалки"],"a":"Растяжка улучшает гибкость, но крепатуру почти не уменьшает. Если хочешь — 5–10 минут после тренировки, по 20–30 секунд на мышцу, без боли. Перед тренировкой вместо долгой статической растяжки лучше динамическая разминка."},{"c":"Восстановление","q":"Что делать в день отдыха?","k":["активный отдых","чем заняться в выходной от зала","день отдыха что делать","кардио в день отдыха","как отдыхать между тренировками"],"a":"Активный отдых: прогулка 40–60 минут, 8–10 тысяч шагов, велосипед, плавание в спокойном темпе. Можно растяжку или ролл 10–15 минут. Питайся как обычно, белок не снижай. Тяжёлую силовую на те же мышцы не делай."},{"c":"Восстановление","q":"Как понять, что я восстановился к следующей тренировке?","k":["восстановился ли я","готов ли к тренировке","как понять что мышцы восстановились","признаки восстановления","можно ли уже тренировать снова"],"a":"Признаки: мышца почти не болит, нормальный сон, есть желание тренироваться, на разминке веса идут легко. Если в первых подходах веса ощущаются тяжелее обычного и повторы не идут — недовосстановился. Тогда сделай облегчённую тренировку или добавь день отдыха."},{"c":"Восстановление","q":"Нужны ли добавки для восстановления?","k":["бцаа для восстановления","добавки для восстановления","глютамин","что пить для восстановления мышц","спортпит восстановление"],"a":"Без сна и еды добавки не работают. Доказанные: креатин 3–5 г в день и протеин как удобный источник белка. BCAA и глютамин при достаточном белке в рационе пользы почти не дают. Витамин D — если дефицит по анализу."},{"c":"Восстановление","q":"Сколько нужно отдыхать после долгого перерыва или травмы перед полной нагрузкой?","k":["возвращение после перерыва","давно не был в зале","как вернуться к тренировкам","перерыв в тренировках месяц","начать снова после паузы"],"a":"После 2–4 недель перерыва начни с 60–70% прежних весов и меньше подходов. Через 2–3 недели обычно возвращаешься к прежнему уровню — мышечная память помогает. Первую неделю жди сильную крепатуру. После травмы — только после разрешения врача."},{"c":"Восстановление","q":"Почему тянет мышцы и сводит после тренировки вечером?","k":["тянет мышцы вечером","ноет тело после зала","ломит мышцы","мышцы гудят","тяжесть в ногах после тренировки"],"a":"Обычно это усталость и начало крепатуры. Помогает прогулка, тёплый душ, вода и нормальный ужин с белком и углеводами. Если ломит всё тело и есть температура — возможно, начинается простуда, тогда следующую тренировку пропусти."},{"c":"Восстановление","q":"Можно ли тренироваться два раза в день?","k":["две тренировки в день","тренироваться утром и вечером","двухразовые тренировки","два раза в зал за день"],"a":"Любителю это не нужно: результат зависит от недельного объёма и восстановления. Если хочешь — разнеси силовую и лёгкое кардио, между ними 6+ часов. Две тяжёлые силовые в день быстро ведут к недовосстановлению."},{"c":"Восстановление","q":"Помогает ли алкоголь расслабиться после тренировки?","k":["алкоголь после тренировки","пиво после зала","можно ли пить после тренировки","алкоголь и мышцы","выпить после трени"],"a":"Алкоголь ухудшает сон, синтез белка и восстановление, особенно в дозах больше 1–2 порций. Если пьёшь — не в день тренировки и после нормальной еды. Перед тренировкой и на следующий день после выпивки силовая будет слабее."},{"c":"Восстановление","q":"Нормально ли, что после тренировки трясутся руки и ноги?","k":["дрожат руки после тренировки","трясутся ноги после зала","тремор после тренировки","дрожь в мышцах"],"a":"После тяжёлой тренировки дрожь от утомления — нормально и проходит за 10–30 минут. Поешь и выпей воды: иногда это от голода и низкого сахара. Если дрожь с головокружением, холодным потом, болью в груди или не проходит — прекрати и обратись к врачу."},{"c":"Восстановление","q":"Как восстановиться после тяжёлой тренировки ног?","k":["болят ноги после приседа","не могу ходить после ног","ноги после тренировки","восстановление ног","день ног болят ноги"],"a":"Ходи: прогулка 20–30 минут и лестница в спокойном темпе разгоняют кровь. Лёгкая езда на велосипеде, ролл на бёдра и ягодицы, тёплая ванна. Спи и ешь с белком. Следующую тяжёлую тренировку ног — через 3–4 дня."},{"c":"Здоровье","q":"Когда при боли нужно сразу остановить тренировку?","k":["когда прекращать тренировку при боли","боль во время упражнения","больно на тренировке что делать","стоп сигналы на тренировке","какая боль опасна"],"a":"Останови упражнение сразу при:\n— острой, колющей или стреляющей боли\n— боли в суставе, а не в мышце\n— щелчке с болью, отёке, онемении\n— боли в груди, одышке, головокружении\nЖжение в мышце в конце подхода — нормально. Если острая боль не прошла за 1–2 дня, иди к врачу."},{"c":"Здоровье","q":"Болит колено при приседаниях — что делать?","k":["болит колено","боль в колене при приседе","колени болят после тренировки","колено при выпадах","хрустит и болит колено"],"a":"Остановись и не приседай через боль. Проверь технику: колено идёт по линии носка, глубина без боли, вес на всей стопе. Снизь вес на 30–50% или замени упражнение на сегодня через «Не получается?» (например, на ягодичный мост). Если боль держится больше недели, есть отёк или колено «заклинивает» — к ортопеду."},{"c":"Здоровье","q":"Болит поясница после становой или приседа — что делать?","k":["болит спина после становой","поясница после приседаний","боль в спине после зала","сорвал спину","защемило поясницу"],"a":"Прекрати тяжёлые упражнения на спину на несколько дней, но не лежи пластом: спокойная ходьба ускоряет восстановление. Проверь технику: нейтральная спина, без округления внизу. Срочно к врачу, если боль отдаёт в ногу, есть онемение, слабость в ноге или проблемы с мочеиспусканием. Если просто ноет и не проходит 1–2 недели — тоже к врачу."},{"c":"Здоровье","q":"Болит плечо при жиме — что делать?","k":["болит плечо","плечо при жиме лёжа","боль в плече после зала","плечо щёлкает и болит","не могу поднять руку"],"a":"Убери упражнения, которые вызывают боль, остальное делай. Часто помогает сузить хват, опускать штангу ниже на грудь и не разводить локти на 90°, заменить штангу на гантели. Добавь разминку плеч и упражнения на заднюю дельту. Если боль ночью, слабость в руке или больше 2 недель — к врачу."},{"c":"Здоровье","q":"Хрустят суставы при упражнениях — это опасно?","k":["хруст в суставах","хрустят колени","щелкает плечо","хруст при приседаниях","трещат суставы"],"a":"Хруст без боли обычно безопасен: это пузырьки газа в суставной жидкости или смещение сухожилия. Тревожно, если хруст с болью, отёком, ощущением заклинивания или нестабильности. Тогда убери упражнение и покажись ортопеду."},{"c":"Здоровье","q":"Кружится голова и тошнит на тренировке — что делать?","k":["головокружение на тренировке","тошнит в зале","кружится голова после подхода","мутит на тренировке","темнеет в глазах"],"a":"Сразу прекрати, сядь или ляг, подними ноги. Выпей воды, если давно не ел — что-нибудь сладкое. Частые причины: тренировка натощак, жара, мало воды, задержка дыхания. Если не проходит за 10–15 минут, есть боль в груди, одышка, слабость в руке — вызывай скорую."},{"c":"Здоровье","q":"Можно ли тренироваться при повышенном давлении?","k":["давление и тренировки","гипертония можно ли в зал","высокое давление качаться","давление после тренировки","давление поднимается в зале"],"a":"С контролируемым давлением силовые обычно разрешают и даже рекомендуют, но согласуй это с врачом. Не задерживай дыхание: выдох на усилии. Избегай подходов до отказа и очень тяжёлых весов. Если давление выше 160/100, болит голова или «мушки» в глазах — в этот день не тренируйся."},{"c":"Здоровье","q":"Можно ли тренироваться при температуре?","k":["температура и тренировка","37 можно ли в зал","температура 37.2 тренировка","трениться с температурой"],"a":"Нет. При температуре от 37,5 и выше — никаких тренировок. Нагрузка во время инфекции может дать осложнения на сердце. Возвращайся через 1–2 дня после нормализации температуры."},{"c":"Здоровье","q":"Как вернуться к тренировкам после болезни?","k":["тренировка после болезни","после простуды в зал","после ковида тренировки","после гриппа когда тренироваться","вернуться после болезни"],"a":"Начни через 1–2 дня после того как прошла температура и самочувствие нормальное. Первая неделя — 50–70% весов и меньше подходов. После гриппа, ковида или тяжёлой болезни — ещё осторожнее, 2 недели на возврат. Если одышка, сердцебиение или боль в груди при нагрузке — остановись и к врачу."},{"c":"Здоровье","q":"Что делать, если свело судорогой мышцу?","k":["судорога","свело ногу","сводит икру","судороги на тренировке","спазм мышцы"],"a":"Прекрати упражнение и мягко растяни мышцу: при судороге икры потяни носок на себя. Помассируй, походи. Пей воду, особенно в жару, и следи за солью и калием в еде (бананы, картофель, молочка). Частые судороги без причины — повод сходить к врачу."},{"c":"Здоровье","q":"Как избежать мозолей на руках от штанги?","k":["мозоли на руках","мозоли от грифа","натёрла руки","как убрать мозоли","перчатки для зала"],"a":"Держи гриф ближе к основанию пальцев, а не в центре ладони — кожа меньше собирается. Используй мел или перчатки. Подпиливай загрубевшие мозоли пемзой, увлажняй кожу. Если мозоль сорвало — промой, наклей пластырь и пару дней обходись без тяжёлых тяг."},{"c":"Здоровье","q":"Что делать сразу после травмы на тренировке?","k":["первая помощь при травме","потянул мышцу что делать","растяжение","подвернул ногу","ушиб на тренировке"],"a":"Прекрати тренировку. Первые 1–2 дня:\n— холод на 15–20 минут через ткань, каждые 2–3 часа\n— эластичный бинт без пережатия\n— приподнятое положение конечности\n— покой для травмированного места, но двигайся остальным телом\nСильная боль, деформация, не можешь наступить или пошевелить — сразу в травмпункт."},{"c":"Здоровье","q":"Когда при травме нужно идти к врачу?","k":["когда идти к врачу","травма нужен ли врач","когда в травмпункт","серьёзная ли травма","тревожные симптомы"],"a":"Сразу к врачу, если:\n— не можешь опереться на ногу или двигать суставом\n— видна деформация, сильный отёк, синяк быстро растёт\n— онемение, покалывание, слабость\n— был громкий щелчок с резкой болью\nИ если боль не уменьшается за 5–7 дней."},{"c":"Здоровье","q":"Болит в груди на тренировке — что делать?","k":["боль в груди","давит в груди на тренировке","колет сердце","сердце болит в зале","жжение в груди"],"a":"Немедленно прекрати нагрузку и сядь. Если боль давящая, отдаёт в руку, челюсть или спину, есть одышка, пот, тошнота — вызывай скорую (103 или 112). Не продолжай тренировку и не жди, что «само пройдёт». Даже если прошло — сходи к кардиологу перед следующими тренировками."},{"c":"Здоровье","q":"Почему колет в боку при беге?","k":["колет в боку","болит бок при беге","колика в боку","боль под рёбрами при беге"],"a":"Обычно это спазм диафрагмы или связок: от еды незадолго до бега и сбитого дыхания. Сбавь темп, глубоко дыши, надави на место боли и наклонись вперёд. Ешь за 1,5–2 часа до бега. Если боль сильная и не проходит в покое — к врачу."},{"c":"Здоровье","q":"Можно ли тренироваться с грыжей или протрузией?","k":["грыжа позвоночника тренировки","протрузия можно ли качаться","грыжа и зал","больная спина упражнения","остеохондроз и тренировки"],"a":"Часто можно и нужно, но программу должен одобрить врач или реабилитолог. Обычно сначала исключают тяжёлые осевые нагрузки (присед и становая со штангой) и делают упражнения на корпус, тренажёры, гиперэкстензию. Любая отдающая в ногу боль, онемение — стоп и к врачу."},{"c":"Здоровье","q":"Почему болит голова после тренировки?","k":["болит голова после зала","головная боль на тренировке","давит голову при жиме","мигрень после спорта"],"a":"Частые причины: задержка дыхания и натуживание, обезвоживание, голод, недосып. Дыши: выдох на усилии. Пей воду, ешь за 1,5–2 часа до тренировки. Если головная боль резкая, «как удар», с рвотой или нарушением зрения — сразу вызывай скорую."},{"c":"Здоровье","q":"Можно ли тренироваться при болях в животе или после отравления?","k":["отравление и тренировка","болит живот можно ли в зал","диарея тренировка","после отравления спорт"],"a":"Нет, пока не пройдут боль, рвота и диарея. После — 1–2 дня отдыха, пей воду с электролитами. Первая тренировка — лёгкая. Сильная или долгая боль в животе — повод для врача, не для зала."},{"c":"Здоровье","q":"Болит запястье при жиме и отжиманиях — что делать?","k":["болят запястья","запястье при жиме","кисть болит при отжиманиях","боль в запястье в зале"],"a":"Держи запястье прямым: гриф над предплечьем, а не на пальцах. Отжимания делай на кулаках или упорах. Можно использовать кистевые бинты на тяжёлых подходах. Разминай кисти перед тренировкой. Боль больше 2 недель или отёк — к врачу."},{"c":"Здоровье","q":"Болит локоть после тренировок — что делать?","k":["болит локоть","локоть при подтягиваниях","локоть после бицепса","боль в локте в зале","локоть тенниста"],"a":"Часто это перегрузка сухожилий от большого объёма на бицепс, трицепс и тяги. Снизь вес и объём, замени упражнения, которые болят (например, штангу на гантели нейтральным хватом). Не тренируй через боль. Если не проходит 3–4 недели — к врачу."},{"c":"Здоровье","q":"Можно ли тренироваться с варикозом?","k":["варикоз и тренировки","вены на ногах приседания","варикоз зал","можно ли качать ноги при варикозе"],"a":"Обычно умеренные тренировки полезны, но согласуй с флебологом. Часто рекомендуют компрессионный трикотаж, избегать тяжёлых приседаний и натуживания, больше делать в положении лёжа и сидя. Боль, отёк и покраснение ноги — сразу к врачу."},{"c":"Здоровье","q":"Можно ли тренироваться при сколиозе?","k":["сколиоз и зал","кривая спина тренировки","сколиоз можно ли качаться","осанка и тренировки"],"a":"При лёгком сколиозе силовые обычно разрешены и полезны для мышц корпуса. Делай упражнения симметрично, следи за техникой, начинай с умеренных весов. При выраженном сколиозе или боли — программа только с врачом или реабилитологом."},{"c":"Здоровье","q":"Почему немеют руки или пальцы на тренировке?","k":["немеют руки","онемение пальцев","покалывание в руке","немеет рука при жиме"],"a":"Иногда это пережатие нерва положением или хватом — прекрати упражнение, разомни кисти. Если онемение не проходит за несколько минут, повторяется, сопровождается слабостью или болью в шее — обратись к врачу. Внезапное онемение половины тела или лица — сразу скорая."},{"c":"Здоровье","q":"Нормально ли, что после тренировки повышается пульс и долго не успокаивается?","k":["пульс после тренировки","сердцебиение после зала","высокий пульс","сердце колотится после тренировки"],"a":"Сразу после нагрузки пульс высокий, за 5–10 минут он обычно возвращается почти к норме. Если сердце бьётся неровно, пульс долго больше 100 в покое, есть боль в груди или головокружение — прекрати тренировки и сходи к кардиологу."},{"c":"Здоровье","q":"Можно ли тренироваться при месячных?","k":["тренировка при месячных","месячные и зал","цикл и тренировки","во время менструации качаться"],"a":"Можно, если самочувствие нормальное. В первые 1–2 дня многим комфортнее снизить вес и объём. При сильной боли — отдых или лёгкая прогулка. Если месячные очень болезненные или пропадают на фоне тренировок и диеты — к гинекологу."},{"c":"Здоровье","q":"Как не получить травму в зале?","k":["как избежать травмы","профилактика травм","безопасность в зале","как тренироваться безопасно"],"a":"— разминка 5–10 минут и подводящие подходы\n— техника важнее веса, прибавляй постепенно\n— не делай каждый подход до отказа\n— высыпайся и делай разгрузку раз в 4–8 недель\n— при острой боли — сразу стоп"},{"c":"Здоровье","q":"Можно ли пить обезболивающее перед тренировкой?","k":["обезболивающее перед залом","ибупрофен перед тренировкой","таблетки от боли и спорт","нурофен и тренировка"],"a":"Не рекомендую: боль — сигнал, а таблетка его заглушает, и можно усугубить травму. Регулярный приём противовоспалительных ради тренировок вредит желудку и почкам. Если без таблетки тренироваться больно — нужен врач, а не таблетка."},{"c":"Приложение","q":"Как отметить подход и вес?","k":["отметить подход","записать вес","как записывать тренировку","галочка подход"],"a":"Открой упражнение (нажми на название). В строках подходов впиши вес и повторы и нажми галочку справа — подход засчитан, запустится таймер отдыха. Когда все подходы отмечены, упражнение станет выполненным. Всё сохраняется само."},{"c":"Приложение","q":"Что такое «План на сегодня»?","k":["план на сегодня","какой вес сегодня","подсказка веса"],"a":"Это блок внутри упражнения: какой вес и сколько повторов делать сегодня и почему. Он считается по твоей прошлой тренировке с этим упражнением, а вес сразу подставляется в подходы."},{"c":"Приложение","q":"Как приложение подбирает вес?","k":["автоподбор веса","как считается вес","прогрессия веса","само считает вес"],"a":"По прошлой тренировке с этим упражнением:\n— все подходы на верхней границе повторов → +2,5 кг (в изоляции +1 кг)\n— не добрал повторы → тот же вес\n— два раза подряд не добрал → вес −10%, потом снова вверх\n— плохой сон или самочувствие → −10% на сегодня\n— разгрузочная неделя → около 60%\nВ первый раз вес считается от твоего веса тела, пола и опыта."},{"c":"Приложение","q":"Откуда берутся стартовые веса?","k":["стартовый вес","первый раз какой вес","серые цифры в полях"],"a":"Серые цифры в полях — стартовые веса, рассчитанные от твоего веса тела, пола и опыта (задаются при первом запуске и в «Настройках»). Это осторожный старт: если легко, прибавь. После первой тренировки вес считается уже по твоим результатам."},{"c":"Приложение","q":"Почему вес снизился на 10%?","k":["вес уменьшился","снизил вес","минус 10 процентов"],"a":"Причины две: ты два раза подряд не добрал повторы с этим весом или отметил плохой сон/самочувствие в «Восстановлении». Это нормально — сделай подходы чисто, и вес снова начнёт расти."},{"c":"Приложение","q":"Как отметить плохой сон или самочувствие?","k":["плохо спал","отметить сон","самочувствие","не выспался"],"a":"«Ещё» → «Восстановление»: укажи часы сна и самочувствие. Если сна меньше 6 часов или самочувствие плохое, на главной появится подсказка, а веса на сегодня станут на 10% меньше."},{"c":"Приложение","q":"Как работает разгрузочная неделя?","k":["разгрузка","разгрузочная неделя","deload","цикл неделя из 6"],"a":"Приложение считает недели цикла. После 6 недель тренировок на главной появится предложение разгрузки: «Начинаю разгрузку» или «Через неделю». В разгрузку вес около 60%, подходов меньше — тело восстанавливается, потом прогресс идёт быстрее."},{"c":"Приложение","q":"Что делает кнопка «Не получается?»","k":["не получается","слишком тяжело упражнение","не могу сделать упражнение","облегчить упражнение"],"a":"Открой упражнение и нажми «Не получается?». Появятся подсказки «Проще» и «Сложнее» и 2–3 похожих упражнения — одно нажатие заменит упражнение только на сегодня. Завтра вернётся исходное, раньше — кнопкой «Вернуть»."},{"c":"Приложение","q":"Как заменить упражнение насовсем?","k":["заменить упражнение","поменять упражнение","другое упражнение"],"a":"Открой упражнение → «Заменить» → выбери новое из списка похожих. Оно встанет в программу навсегда. Если нужно только на сегодня — «Не получается?»."},{"c":"Приложение","q":"Как работает таймер отдыха?","k":["таймер","отдых между подходами таймер","таймер отдыха"],"a":"Таймер внизу экрана: быстрые кнопки 1 мин, 90 с, 2 мин, кнопка настроек и кнопка, чтобы свернуть его. После отметки подхода отдых запускается сам: дольше после базовых упражнений, короче после изолирующих."},{"c":"Приложение","q":"Что такое крупный режим?","k":["крупный режим","большие кнопки","режим тренировки"],"a":"Кнопка «Крупный режим» в карточке дня: упражнения по одному, крупные цифры и кнопки, таймер на весь экран. Удобно, когда телефон лежит рядом на скамье."},{"c":"Приложение","q":"Как включить разминку с таймером?","k":["разминка","разминка с таймером","размяться"],"a":"«Ещё» → «Разминка» или кнопка «Разминка» в карточке дня. Приложение ведёт по упражнениям на всё тело с таймером, 6–12 минут."},{"c":"Приложение","q":"Как выбрать или сменить программу?","k":["сменить программу","выбрать программу","другая программа","программы для девушек"],"a":"«Ещё» → «Программы»: готовые программы под разные цели, в том числе для девушек. Нажми «Все упражнения», чтобы посмотреть, и «Загрузить». Текущая программа сама сохранится в «Мои программы»."},{"c":"Приложение","q":"Что такое «Мои программы»?","k":["мои программы","прошлые программы","история программ","вернуть программу"],"a":"«Ещё» → «Программы» → «Мои программы»: твои прошлые программы. Перед каждой загрузкой новой текущая сохраняется сюда автоматически, можно сохранить и вручную. Любую можно загрузить обратно — веса совпадающих упражнений сохранятся."},{"c":"Приложение","q":"Где посмотреть историю тренировок?","k":["история тренировок","журнал","прошлые тренировки","календарь"],"a":"«Ещё» → «История»: журнал по дням, календарь, итоги недели и сравнение месяцев. Графики силы, замеры и фото — в «Ещё» → «Прогресс»."},{"c":"Приложение","q":"Как изменить свою программу?","k":["редактор","изменить программу","добавить упражнение","порядок упражнений","суперсет"],"a":"«Ещё» → «Редактор»: выбери день, добавляй и удаляй упражнения, меняй порядок, подходы и повторы, объединяй в суперсеты, переименовывай день."},{"c":"Приложение","q":"Как поделиться программой?","k":["поделиться программой","отправить программу другу","qr код программы","ссылка на программу"],"a":"«Ещё» → «Поделиться»: приложение делает ссылку и QR-код. Друг открывает ссылку в браузере и нажимает «Загрузить». Передаётся только программа, без твоих весов и записей."},{"c":"Приложение","q":"Как перенести данные на другой телефон?","k":["перенос данных","новый телефон","перенести на другой телефон","сменил телефон"],"a":"«Ещё» → «Перенос». На старом телефоне — «Отправить файл с данными» (например, себе в Telegram). На новом установи приложение, открой «Перенос» → «Загрузить файл» и подтверди. Переносится всё, кроме фото прогресса."},{"c":"Приложение","q":"Как сделать резервную копию?","k":["резервная копия","бэкап","сохранить данные","копия данных"],"a":"«Ещё» → «Перенос» → «Отправить файл с данными» или «Ещё» → «Экспорт» → «Полная резервная копия». Храни файл в облаке или у себя в мессенджере и обновляй раз в 1–2 недели."},{"c":"Приложение","q":"Как выгрузить данные в Excel?","k":["excel","таблица","csv","выгрузить тренировки"],"a":"«Ещё» → «Экспорт»: таблицы CSV — подходы, журнал, замеры, восстановление и программа. Открываются в Excel и Google Таблицах. Для переноса на телефон используй «Перенос», а не CSV."},{"c":"Приложение","q":"Где хранятся мои данные?","k":["где данные","данные в облаке","аккаунт","сервер"],"a":"Только в этом телефоне, в памяти приложения. Аккаунта и сервера нет — данные никто не видит. Поэтому раз в пару недель делай копию через «Ещё» → «Перенос»."},{"c":"Приложение","q":"Пропали данные — что делать?","k":["пропали данные","всё исчезло","удалились тренировки"],"a":"Данные стираются при очистке данных браузера или сайта и при удалении приложения. Если есть файл копии — «Ещё» → «Перенос» → «Загрузить файл». Без копии восстановить нельзя."},{"c":"Приложение","q":"Что такое простой режим?","k":["простой режим","упростить приложение","слишком много кнопок","скрыть лишнее"],"a":"«Ещё» → «Настройки» → «Простой режим»: остаются тренировка, таймер, программы, редактор, упражнения и разминка. Питание, история и инструменты скрываются, данные сохраняются."},{"c":"Приложение","q":"Как выбрать цель: набор или сушка?","k":["набор или сушка","цель","сменить цель","фаза"],"a":"«Ещё» → «Набор / Сушка». От цели зависят норма белка, калории и подсказки. На наборе — небольшой профицит калорий, на сушке — дефицит 15–20% и высокий белок."},{"c":"Приложение","q":"Как отмечать белок и воду?","k":["белок вода","отметить воду","сколько выпил","белок за день"],"a":"На главной есть строка «Белок» и «Вода»: «+20 г» и «+ 250 мл» добавляют быстро, нажатие на строку открывает подробно. Скрыть строку можно в «Настройках»."},{"c":"Приложение","q":"Как обновить приложение?","k":["обновить приложение","новая версия","не обновилось"],"a":"Открой приложение с интернетом, полностью закрой (смахни из недавних) и открой снова — и так два раза. Данные при обновлении не теряются."},{"c":"Приложение","q":"Работает ли приложение без интернета?","k":["без интернета","офлайн","нет сети"],"a":"Да. После первой загрузки работают тренировки, таймер, история и помощник «Спросить». Интернет нужен только для обновлений и QR-кода."},{"c":"Приложение","q":"Как установить приложение?","k":["установить приложение","добавить на главный экран","скачать приложение"],"a":"Android: открой сайт в Chrome → «⋮» → «Установить приложение». iPhone: в Safari → «Поделиться» → «На экран „Домой“». Дальше открывай только с иконки."},{"c":"Приложение","q":"Пропустил тренировку — что делать?","k":["пропустил тренировку","не успел в зал","пропуск дня"],"a":"Программа привязана к дням недели. Пропущенную можно сделать на следующий день: открой нужный день во вкладках и тренируйся по нему. Если пропустил больше 2 недель — первую тренировку сделай на 10–20% легче."},{"c":"Приложение","q":"Как изменить вес, если неудобно?","k":["поменять вес","вес не тот","слишком тяжёлый вес","слишком лёгкий вес"],"a":"Просто впиши свой вес в подходе. Следующий план будет считаться от того, что ты реально сделал."},{"c":"Приложение","q":"Как задать вопрос помощнику?","k":["спросить","помощник","вопрос","задать вопрос"],"a":"«Ещё» → строка «Задай вопрос» вверху. Пиши своими словами: «что съесть до тренировки», «болит колено при приседе». Помощник ищет во встроенной базе и работает без интернета."},{"c":"Приложение","q":"Как изменить пол, опыт и стартовые веса?","k":["пол","опыт","стартовые веса","я девушка"],"a":"«Ещё» → «Настройки» → «Стартовые веса»: пол и опыт. Вес тела меняется в «Ещё» → «Расчёты» → «Рабочие веса». От этого зависят серые стартовые цифры в полях."}];
