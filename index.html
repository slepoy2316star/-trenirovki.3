<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ясно</title>
<meta name="theme-color" content="#0e1124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ясно">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Небо меняется по времени суток, звёзды — сделанные дела. Одна колонка, нижняя навигация */
:root{
  --night:#0e1124; --deep:#151936; --card:#1b2044; --card2:#232a57; --line:#30376b;
  --ink:#eef0ff; --muted:#9ea4cf; --dawn:#ffb35c; --rose:#ff7d8c; --sea:#5fd0c4; --bad:#ff6b6b; --violet:#a78bfa;
  --on-accent:#1e1408; --on-sea:#06231f;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font:15px/1.5 var(--body);min-height:100vh;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px}
h2{font-size:16px}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 130px;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:36px}
.brand{font:800 18px var(--display);letter-spacing:.02em}
.brand span{color:var(--dawn)}
.label{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.nowrap{flex-wrap:nowrap}

/* hero */
.hero{color:#eef0ff;position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-in{padding:20px;display:grid;gap:4px;min-height:250px;align-content:start}
.greet{font:600 22px/1.2 var(--display);text-shadow:0 2px 18px rgba(0,0,0,.35)}
.big{font:800 clamp(64px,22vw,112px)/.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.big small{font-size:.32em;font-weight:600;letter-spacing:0;opacity:.8}
.hero-foot{margin-top:auto;padding-top:40px;display:grid;gap:8px}
.track{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.hero .track{background:rgba(255,255,255,.16)}
.track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--rose),var(--dawn));transition:width .4s}
.track.sea i{background:linear-gradient(90deg,var(--sea),#8fe3d9)}
.pill{display:inline-flex;gap:6px;align-items:center;background:rgba(14,17,36,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;max-width:100%}
.pill b{font-family:var(--mono)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px;min-width:0}
.stat b{font:700 20px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);line-height:1.3}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
.btn.pri{background:var(--dawn);border-color:var(--dawn);color:var(--on-accent)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.ghost{background:transparent}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.bad.solid{background:var(--bad);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.link{appearance:none;border:0;background:none;color:var(--dawn);font-weight:700;padding:0;cursor:pointer;font-size:13px}

/* inputs */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=time],input[type=date],textarea,select{width:100%;min-width:0;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--dawn)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.chip.sm{padding:5px 9px;font-size:12px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{appearance:none;min-width:0;border:1px solid var(--line);background:var(--deep);border-radius:14px;padding:8px 0;font-size:22px;cursor:pointer}
.mood[aria-pressed="true"]{border-color:var(--dawn);background:var(--card2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
.sw{appearance:none;width:46px;height:28px;flex:none;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--sea)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.counter{display:flex;align-items:center;gap:10px}
.counter button{appearance:none;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--deep);font-size:18px;font-weight:700;cursor:pointer}

/* lists */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item p{flex:1;min-width:0;overflow-wrap:anywhere}
.item.top{border-color:rgba(255,179,92,.55)}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px;cursor:pointer;flex:none}
.star{appearance:none;border:0;background:none;color:var(--line);font-size:18px;line-height:1;padding:0 2px;cursor:pointer;flex:none}
.star[aria-pressed="true"]{color:var(--dawn)}
.check{appearance:none;width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center}
.check[aria-checked="true"]{background:var(--sea);border-color:var(--sea)}
.check[aria-checked="true"]::after{content:"";width:6px;height:11px;border:solid var(--on-sea);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done p{color:var(--muted);text-decoration:line-through}
.hab{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hab .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
.hab .wk{display:flex;gap:3px;margin-top:4px}
.hab .wk i{width:12px;height:12px;border-radius:4px;background:var(--line)}
.hab .wk i.on{background:var(--sea)}
.streak{font:700 13px var(--mono);color:var(--dawn);white-space:nowrap}
.rem{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rem .tm{font:700 18px var(--mono)}
.rem .tx{min-width:0;overflow-wrap:anywhere}
.rem .dd{font-size:12px;color:var(--muted)}
.rem.off{opacity:.5}

.tip{background:linear-gradient(135deg,var(--card2),var(--card))}
.tip p{font-size:15px;line-height:1.55}

/* goals */
.goal{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.goal h3{font:600 15px var(--display);overflow-wrap:anywhere}
.area{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--violet)}

/* charts */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.week .col{display:grid;gap:4px;justify-items:center;align-content:end;height:100%}
.week .bx{width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--line);position:relative;overflow:hidden}
.week .bx i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--rose),var(--dawn));border-radius:6px 6px 3px 3px}
.week .col span{font:600 10px var(--body);color:var(--muted);text-transform:uppercase}
.week .col.today span{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font:600 10px var(--body);color:var(--muted);text-align:center;text-transform:uppercase}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--deep);border:1px solid var(--line);display:grid;place-items:center;font:500 11px var(--mono);color:var(--muted);position:relative}
.cell.fall::after{content:"";position:absolute;inset:-1px;border-radius:8px;border:2px solid var(--bad)}
.cell.today{color:var(--ink);font-weight:700}
.cell.future{opacity:.3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,120px) 1fr 26px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--rose),var(--dawn))}
.bar em{font:500 12px var(--mono);font-style:normal;color:var(--muted);text-align:right}
svg text{font-family:var(--mono)}

/* focus */
.fring{position:relative;width:min(270px,76vw);aspect-ratio:1;justify-self:center;display:grid;place-items:center}
.fring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fring .ft{font:700 clamp(44px,14vw,60px) var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fring .fm{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
.fring .fc{display:grid;justify-items:center;gap:6px}

/* knowledge */
details.k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
details.k summary{cursor:pointer;font:600 15px var(--display);list-style:none;display:flex;justify-content:space-between;gap:12px}
details.k summary::after{content:"+";color:var(--dawn);font-size:20px;line-height:1}
details.k[open] summary::after{content:"−"}
details.k summary::-webkit-details-marker{display:none}
details.k .kb{display:grid;gap:8px;margin-top:10px;color:var(--ink);line-height:1.6}
details.k code{font:500 13px var(--mono);background:var(--deep);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere;color:var(--dawn)}

.setrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.setrow div{min-width:0}
.menu{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left}
.menu::after{content:"›";font-size:24px;color:var(--muted);line-height:1}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--night) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{appearance:none;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--dawn)}
.fab{position:fixed;z-index:6;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);appearance:none;border:0;border-radius:99px;
  padding:13px 18px;font:800 14px var(--display);color:var(--on-accent);background:linear-gradient(135deg,var(--dawn),var(--rose));box-shadow:0 10px 30px rgba(255,125,140,.35);cursor:pointer}

/* layers */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,7,18,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--deep);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);justify-self:center}
.panel{position:fixed;inset:0;z-index:15;overflow-y:auto;background:var(--night);padding-top:env(safe-area-inset-top,0px)}
.panel .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.panel .seg.rtabs{position:sticky;top:8px;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.sos{position:fixed;inset:0;z-index:30;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,var(--card2) 0%,var(--night) 60%);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.sos-in{max-width:520px;margin:0 auto;display:grid;gap:16px}
.ring{position:relative;width:min(240px,70vw);aspect-ratio:1;justify-self:center;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .ball{width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--sea),#2d6f8f);transform:scale(.65);transition:transform 4s ease-in-out;display:grid;place-items:center;box-shadow:0 0 60px rgba(95,208,196,.35)}
.ring .ball b{font:600 15px var(--display);color:var(--on-sea)}
.ring .t{position:absolute;bottom:-34px;font:700 26px var(--mono);font-variant-numeric:tabular-nums}
.act{font:600 18px/1.4 var(--display)}
.ground b{font:800 40px var(--display);color:var(--dawn)}
.tag{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.tag.ok{color:var(--sea);border:1px solid var(--sea)}
.tag.fall{color:var(--bad);border:1px solid var(--bad)}
.when{font:500 12px var(--mono);color:var(--muted)}
.entry{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.entry:first-child{border-top:0;padding-top:0}
.badges{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.badge{flex:none;width:86px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:11px;line-height:1.25;color:var(--muted)}
.badge i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--display);font-style:normal;border:2px dashed var(--line);color:var(--line)}
.badge.on{color:var(--ink)}
.badge.on i{border:0;background:radial-gradient(circle at 35% 30%,var(--dawn),var(--rose));color:var(--on-accent)}

.lock{position:fixed;inset:0;z-index:50;background:var(--night);display:grid;place-items:center;padding:24px}
.lock-in{display:grid;gap:22px;justify-items:center;width:100%;max-width:300px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--dawn);border-color:var(--dawn)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.pad button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:50%;aspect-ratio:1;font:600 22px var(--display);cursor:pointer}
.pad button.empty{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:60;background:var(--ink);color:var(--night);
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* ===== design layer: ambient glow, glass, bento ===== */
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(42% 32% at 12% 6%,color-mix(in srgb,var(--dawn) 20%,transparent),transparent 70%),
  radial-gradient(46% 36% at 92% 18%,color-mix(in srgb,var(--violet) 20%,transparent),transparent 70%),
  radial-gradient(55% 40% at 40% 100%,color-mix(in srgb,var(--sea) 13%,transparent),transparent 70%)}
#app{position:relative;z-index:1}
.wrap{padding-bottom:150px}
.card{background:color-mix(in srgb,var(--card) 84%,transparent);border-color:color-mix(in srgb,var(--ink) 9%,transparent)}
nav.tabs{left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);
  border-radius:24px;padding:6px;grid-template-columns:repeat(6,1fr);gap:2px;box-shadow:0 14px 40px -12px rgba(0,0,0,.55)}
nav.tabs button{font-size:10px;border-radius:18px;padding:7px 0}
nav.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--dawn) 16%,transparent)}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.panel{background:radial-gradient(70% 40% at 100% 0%,color-mix(in srgb,var(--violet) 14%,transparent),transparent 70%),radial-gradient(60% 35% at 0% 100%,color-mix(in srgb,var(--sea) 10%,transparent),transparent 70%),var(--night)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;min-width:0;min-height:150px;border-radius:24px;padding:14px;display:grid;align-content:space-between;gap:10px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--tint,var(--dawn)) 17%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--card2) 88%,transparent),color-mix(in srgb,var(--card) 88%,transparent));
  border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ink) 9%,transparent),0 12px 30px -20px rgba(0,0,0,.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s}
.tile.w2{grid-column:span 2}
.tile[role=button]{cursor:pointer}
.tile[role=button]:active{transform:scale(.985)}
.tl{display:flex;align-items:center;gap:7px;font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
.tdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--tint,var(--dawn));box-shadow:0 0 10px var(--tint,var(--dawn))}
.tr{margin-left:auto;letter-spacing:0;text-transform:none;color:var(--ink);font-size:12px}
.tnum{font:800 36px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tnum small{font-size:.45em;font-weight:600;color:var(--muted);letter-spacing:0}
.tnum.hot{color:var(--dawn)}

<script>

       {id:uid(),title:"Подтягиваться 15 раз",area:"Тело",due:"",steps:[{id:uid(),text:"10 раз",done:false},{id:uid(),text:"12 раз",done:false},{id:uid(),text:"15 раз",done:false}]}],

  cache:{},dates:[],

  settings:{name:"",notif:false,rec:false,recFab:false,recHidden:false,pin:null,theme:"night",accent:""},

function migrate(o){ // из v2 (трекер восстановления)
  const d=defaults();
  d.rec=Object.assign(defRec(),{start:o.start,since:o.created||o.start,best:o.best||0,reasons:o.reasons||[],letter:o.letter||"",log:o.log||[],plans:o.plans||[],minutes:o.minutes||40});

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===3)return fill(s)}catch(e){}

function fill(s){const d=defaults();for(const k in d)if(s[k]===undefined)s[k]=d[k];s.settings=Object.assign(d.settings,s.settings);s.focus=Object.assign(d.focus,s.focus);if(s.rec)s.rec=Object.assign(defRec(),s.rec);const dt=d.dash.tiles;s.dash=Object.assign(d.dash,s.dash);s.dash.tiles=Object.assign(dt,s.dash.tiles);s.mem=Object.assign(d.mem,s.mem);s.mem.best=Object.assign({digits:0,pairs:null},s.mem.best);if(!s.cache)s.cache={};return s}

/* ================= helpers ================= */

function pl(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c}
const today=()=>dkey(Date.now());

const goalsOf=k=>S.goals[k]||(S.goals[k]=[]);

/* ================= sky ================= */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
const lerp=(a,b,t)=>a+(b-a)*t;
function mix(c1,c2,t){const a=c1.match(/\w\w/g).map(h=>parseInt(h,16)),b=c2.match(/\w\w/g).map(h=>parseInt(h,16));return"rgb("+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(",")+")"}
function drawSky(cv,p,stars,sunX){
  if(!cv)return;const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,mix("0b0d22","2a3f8f",p));sky.addColorStop(.55,mix("161a40","8a5aa0",p));sky.addColorStop(1,mix("2a2152","ffa070",p));
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  const sx=w*(sunX==null?.72:sunX),sy=lerp(h*1.05,h*.5,p),sr=Math.max(w,h)*.55;
  const sun=g.createRadialGradient(sx,sy,0,sx,sy,sr);
  sun.addColorStop(0,"rgba(255,190,110,"+(.2+.6*p)+")");sun.addColorStop(.25,"rgba(255,140,120,"+(.12+.3*p)+")");sun.addColorStop(1,"rgba(255,140,120,0)");
  g.fillStyle=sun;g.fillRect(0,0,w,h);
  g.beginPath();g.arc(sx,sy,18+10*p,0,7);g.fillStyle="rgba(255,214,150,"+(.45+.55*p)+")";g.fill();
  const r=rng(7),n=Math.min(Math.max(stars,0),300)+14;
  for(let i=0;i<n;i++){const x=r()*w,y=r()*h*.6,s=r()*1.4+.4,mine=i>=14;
    g.globalAlpha=(mine?.95:.35)*(1-p*.65);g.fillStyle=mine?"#ffe2b8":"#ffffff";g.beginPath();g.arc(x,y,mine?s+.6:s*.7,0,7);g.fill()}
  g.globalAlpha=1;
  [["1a1b45","4a3170",.72,.08],["131536","2e2350",.82,.06],["0e1124","171634",.92,.045]].forEach(([c1,c2,base,amp],k)=>{
    const rr=rng(31+k*11);g.beginPath();g.moveTo(0,h);let y;
    for(let x=0;x<=w+20;x+=20){y=h*base-Math.abs(Math.sin(x/(70+k*30)+k))*h*amp-rr()*h*amp*.5;g.lineTo(x,y)}
    g.lineTo(w,h);g.closePath();g.fillStyle=mix(c1,c2,p);g.fill()});
}
function dayLight(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;if(h<5||h>=22)return 0;if(h<9)return(h-5)/4;if(h<17)return 1;return 1-(h-17)/5}

function vRoutine(){
  const k=today(),hd=S.habitLog[k]||[];
  // 5 weeks heatmap of habit completion
  const now=new Date();now.setHours(12,0,0,0);const start=now.getTime()-(wd(now)+28)*DAY;
  let cells="";for(let i=0;i<35;i++){const t=start+i*DAY,dk=dkey(t),fut=t>now.getTime()+DAY/2;
    const n=(S.habitLog[dk]||[]).filter(id=>S.habits.some(h=>h.id===id)).length,f=S.habits.length?n/S.habits.length:0;
    const st=f>0?`background:${mix(T.card2,T.sea,f)};border-color:transparent;color:${f>.6?"var(--on-sea)":"var(--ink)"}`:"";
    cells+=`<div class="cell ${dk===k?"today":""} ${fut?"future":""}" style="${st}">${new Date(t).getDate()}</div>`}
  return `
  <div class="top"><h1>Режим</h1></div>
  <section class="card">
    <div class="row between"><h2>Привычки</h2><span class="label">${hd.filter(id=>S.habits.some(h=>h.id===id)).length}/${S.habits.length} сегодня</span></div>
    <div class="list">${S.habits.map(x=>{const on=hd.includes(x.id),st=habStreak(x.id);
      let wk="";for(let i=6;i>=0;i--){wk+=`<i class="${habDone(dkey(Date.now()-i*DAY),x.id)?"on":""}"></i>`}
      return`<div class="hab"><button class="check" role="checkbox" aria-checked="${on}" data-act="habit" data-id="${x.id}" aria-label="${esc(x.name)}"></button>
        <div style="min-width:0"><div class="nm">${esc(x.name)}</div><div class="wk" aria-label="Последние 7 дней">${wk}</div></div>
        <div class="row nowrap">${st?`<span class="streak">${st} ${pl(st,"день","дня","дней")}</span>`:""}<button class="x" data-act="h-del" data-id="${x.id}" aria-label="Удалить">×</button></div></div>`}).join("")}</div>
    <form class="addrow" data-form="habit"><input type="text" id="hIn" placeholder="Новая привычка" maxlength="60"><button class="btn pri" type="submit">+</button></form>
  </section>
  <section class="card">
    <h2>5 недель привычек</h2>
    <div class="cal">${DOW.map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--card2)"></i>мало</span><span><i style="background:var(--sea)"></i>все привычки</span></div>
  </section>
  <section class="card">
    <div class="row between"><h2>Напоминания</h2></div>
    <div class="list">${S.reminders.sort((a,b)=>a.time.localeCompare(b.time)).map(r=>`<div class="rem ${r.on?"":"off"}">
      <span class="tm">${r.time}</span>
      <div class="tx">${esc(r.text)}<div class="dd">${r.days.length===7?"каждый день":r.days.length===5&&!r.days.includes(5)&&!r.days.includes(6)?"по будням":r.days.map(d=>DOW[d]).join(", ")}</div></div>
      <button class="sw" role="switch" aria-checked="${r.on}" data-act="r-tog" data-id="${r.id}" aria-label="Включено"></button>
      <button class="x" data-act="r-del" data-id="${r.id}" aria-label="Удалить">×</button></div>`).join("")||`<p class="small muted">Нет напоминаний.</p>`}</div>
    <form class="card" data-form="rem" style="background:var(--deep);gap:10px;padding:12px">
      <div class="row nowrap"><input type="time" id="rT" value="09:00" style="width:auto;flex:none"><input type="text" id="rX" placeholder="О чём напомнить" maxlength="80"></div>
      <div class="chips" id="rD">${DOW.map((d,i)=>`<button type="button" class="chip sm" data-d="${i}" aria-pressed="true">${d}</button>`).join("")}</div>
      <button class="btn" type="submit">Добавить напоминание</button>
    </form>
    <div class="grid" style="display:grid;gap:8px">
      <button class="btn sea" data-act="ics">Добавить в календарь телефона</button>
      <p class="small muted">Самый надёжный способ: календарь напомнит даже без интернета и при закрытом приложении. Скачается файл — открой его, и напоминания встанут в календарь.</p>
      ${S.settings.notif?`<p class="small muted">Уведомления включены: приложение напомнит, пока оно открыто или свёрнуто.</p>`:`<button class="btn ghost" data-act="notif">Включить уведомления приложения</button>`}

  const mx=Math.max(30,...week.map(w=>w.m)),wsum=week.reduce((a,b)=>a+b.m,0);

  return `
  <div class="top"><h1>Фокус</h1><span class="small muted">${S.focus.n[k]||0} ${pl(S.focus.n[k]||0,"сессия","сессии","сессий")} сегодня</span></div>
  <section class="card" style="justify-items:center;padding-block:24px">

      <div class="fc"><div class="ft" id="fT">${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}</div><div class="fm">${f.mode==="work"?"фокус":"перерыв"}</div></div></div>

  </section>
  <section class="card">
    <h2>Длительность</h2>
    <div class="three">${[[25,5],[50,10],[90,15]].map(([w,b])=>`<button class="btn sm ${S.focus.work===w?"pri":""}" data-act="f-preset" data-w="${w}" data-b="${b}">${w} / ${b}</button>`).join("")}</div>
    <p class="small muted">Минуты фокуса / перерыва. Во время сессии экран не гаснет, телефон лучше отложить экраном вниз.</p>

    <div class="row between"><h2>Неделя</h2><span class="mono small">${hm(wsum)}</span></div>
    <div class="week">${week.map(w=>`<div class="col ${w.k===k?"today":""}"><span class="mono" style="text-transform:none">${w.m||""}</span><div class="bx" style="height:${Math.max(4,w.m/mx*80)}px"><i style="height:100%"></i></div><span>${w.d}</span></div>`).join("")}</div>
  </section>`;

function vGoals(){
  const week=[];for(let i=6;i>=0;i--){const t=Date.now()-i*DAY,k=dkey(t),g=S.goals[k]||[];week.push({k,d:DOW[wd(t)],t:g.length,n:g.filter(x=>x.done).length})}
  const gt=week.reduce((a,b)=>a+b.t,0),gn=week.reduce((a,b)=>a+b.n,0);
  let hs=0,hc=0;for(let i=0;i<7;i++){const k=dkey(Date.now()-i*DAY);hc+=S.habits.length;hs+=(S.habitLog[k]||[]).filter(id=>S.habits.some(h=>h.id===id)).length}
  let fmin=0,moods=[];for(let i=0;i<7;i++){const k=dkey(Date.now()-i*DAY);fmin+=S.focus.min[k]||0;if(S.checkins[k]&&S.checkins[k].mood)moods.push(S.checkins[k].mood)}
  const avgM=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0;
  return `
  <div class="top"><h1>Цели</h1></div>
  <section class="card">
    <h2>Итоги 7 дней</h2>
    <div class="stats">
      <div class="stat"><b>${gt?Math.round(gn/gt*100):0}%</b><span>целей дня выполнено</span></div>
      <div class="stat"><b>${hc?Math.round(hs/hc*100):0}%</b><span>привычек отмечено</span></div>
      <div class="stat"><b>${(fmin/60).toFixed(1)}</b><span>часов фокуса</span></div>
    </div>
    <div class="week">${week.map(w=>`<div class="col ${w.k===today()?"today":""}"><span class="mono" style="text-transform:none">${w.t?w.n+"/"+w.t:""}</span><div class="bx" style="height:80px"><i style="height:${w.t?w.n/w.t*100:0}%"></i></div><span>${w.d}</span></div>`).join("")}</div>
    ${avgM?`<p class="small muted">Среднее настроение за неделю: <b style="color:var(--ink)">${["","😣","😕","😐","🙂","😄"][Math.round(avgM)]} ${avgM.toFixed(1)}</b></p>`:""}
  </section>
  <div class="row between"><h2>Большие цели</h2><button class="btn sm pri" data-act="big-new">+ Цель</button></div>
  ${S.big.map(b=>{const n=b.steps.filter(s=>s.done).length,p=b.steps.length?n/b.steps.length:0;
    const due=b.due?Math.ceil((new Date(b.due+"T23:59").getTime()-Date.now())/DAY):null;
    return`<section class="goal">
      <div class="row between nowrap"><h3 class="grow">${esc(b.title)}</h3><button class="x" data-act="big-del" data-id="${b.id}" aria-label="Удалить цель">×</button></div>
      <div class="row"><span class="area">${esc(b.area)}</span>${due!=null?`<span class="small ${due<0?"":"muted"}" style="${due<0?"color:var(--bad)":""}">${due<0?"срок прошёл":due===0?"срок сегодня":"осталось "+due+" "+pl(due,"день","дня","дней")}</span>`:""}<span class="small muted mono" style="margin-left:auto">${n}/${b.steps.length}</span></div>
      <div class="track sea"><i style="width:${p*100}%"></i></div>
      <ul class="list">${b.steps.map(s=>`<li class="item ${s.done?"done":""}" style="background:var(--card)"><button class="check" role="checkbox" aria-checked="${s.done}" data-act="st-tog" data-g="${b.id}" data-id="${s.id}" aria-label="Шаг выполнен"></button><p>${esc(s.text)}</p><button class="link" data-act="st-today" data-v="${esc(s.text)}" title="В цели на сегодня">→ сегодня</button><button class="x" data-act="st-del" data-g="${b.id}" data-id="${s.id}" aria-label="Удалить шаг">×</button></li>`).join("")}</ul>
      <form class="addrow" data-form="step" data-g="${b.id}"><input type="text" placeholder="Следующий шаг" maxlength="100"><button class="btn sm" type="submit">+</button></form>
      ${p===1&&b.steps.length?`<p class="small" style="color:var(--sea);font-weight:700">Цель достигнута 🎉</p>`:""}
    </section>`}).join("")||`<p class="small muted">Большая цель — то, к чему идёшь неделями. Разбей её на шаги и переноси шаги в цели дня.</p>`}`;
}

function updFab(){let f=$("#fab");const want=S.settings.rec&&S.settings.recFab;
  if(want&&!f){f=document.createElement("button");f.id="fab";f.className="fab";f.textContent="SOS";f.onclick=()=>openSOS();document.body.appendChild(f)}

/* ================= reminders & notifications ================= */
function nextReminder(){const now=new Date(),cur=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),d=wd(now);
  return S.reminders.filter(r=>r.on&&r.days.includes(d)&&r.time>cur).sort((a,b)=>a.time.localeCompare(b.time))[0]||null}
async function notify(title,body){
  buzz([80,60,80]);toast(body?title+": "+body:title);
  if(!S.settings.notif||!("Notification"in window)||Notification.permission!=="granted")return;
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg){reg.showNotification(title,{body,icon:"icon-192.png",badge:"icon-192.png",tag:"yasno-"+Date.now()});return}}catch(e){}
  try{new Notification(title,{body,icon:"icon-192.png"})}catch(e){}
}
const fired={};
function checkReminders(){const now=new Date(),cur=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),d=wd(now),k=today();
  S.reminders.forEach(r=>{if(r.on&&r.days.includes(d)&&r.time===cur&&fired[r.id]!==k){fired[r.id]=k;notify("Ясно",r.text)}})}
async function enableNotif(){
  if(!("Notification"in window)){toast("Этот браузер не поддерживает уведомления");return false}
  let p=Notification.permission;if(p==="default")p=await Notification.requestPermission();
  if(p!=="granted"){toast("Разреши уведомления в настройках браузера");return false}
  S.settings.notif=true;save();notify("Уведомления включены","Так будут выглядеть напоминания");return true}
function icsFile(){
  const pad=n=>String(n).padStart(2,"0"),now=new Date();
  const stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+"00Z";
  const day=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
  const BY=["MO","TU","WE","TH","FR","SA","SU"];
  const clean=s=>s.replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g," ");
  let out="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Yasno//RU\r\nCALSCALE:GREGORIAN\r\n";
  S.reminders.filter(r=>r.on&&r.days.length).forEach(r=>{const[h,m]=r.time.split(":");
    out+=`BEGIN:VEVENT\r\nUID:${r.id}-${day}@yasno\r\nDTSTAMP:${stamp}\r\nDTSTART:${day}T${h}${m}00\r\nDURATION:PT10M\r\nRRULE:FREQ=WEEKLY;BYDAY=${r.days.map(d=>BY[d]).join(",")}\r\nSUMMARY:${clean(r.text)}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${clean(r.text)}\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n`});
  return out+"END:VCALENDAR\r\n"}
function download(name,text,type){const blob=new Blob([text],{type});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

/* ================= focus timer ================= */
let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function fTick(){
  const f=S.ft;if(!f.running)return;
  const left=ftLeft();
  if(tab==="focus"){const t=$("#fT"),a=$("#fArc");if(t){t.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");const tot=(f.mode==="work"?S.focus.work:S.focus.brk)*60,C=2*Math.PI*46;a.setAttribute("stroke-dashoffset",C*(1-left/tot))}}
  if(left<=0)fDone();
}
function fDone(){
  const f=S.ft,k=today();f.running=false;f.end=null;
  if(f.mode==="work"){S.focus.min[k]=(S.focus.min[k]||0)+S.focus.work;S.focus.n[k]=(S.focus.n[k]||0)+1;f.mode="break";f.left=S.focus.brk*60;notify("Сессия завершена","+"+S.focus.work+" мин фокуса. Время перерыва")}
  else{f.mode="work";f.left=S.focus.work*60;notify("Перерыв окончен","Готов к следующей сессии?")}
  keepAwake(false);save();if(tab==="focus"||tab==="today")render()}

/* ================= input events ================= */
document.addEventListener("input",e=>{
  const t=e.target,k=today();
  if(t.dataset.in==="intent"){S.intent[k]=t.value;save()}
  else if(t.dataset.j){(S.journal[k]||(S.journal[k]={}))[t.dataset.j]=t.value;save()}
  else if(t.id==="sName"){S.settings.name=t.value.trim();save()}
  else if(t.id==="fTask"){S.ft.task=t.value;save()}
  else if(t.id==="wStart"||t.id==="wEnd"){if(t.value){S.dash.work[t.id==="wStart"?"start":"end"]=t.value;save()}}
  else if(t.id==="rMin"&&S.rec){S.rec.minutes=+t.value;$("#rMinV").textContent=t.value;save()}
});
document.addEventListener("change",e=>{
  const t=e.target;if(t.id!=="importF")return;const file=t.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v===3)S=fill(d);else if(d.start)S=migrate(d);else throw 0;save();toast("Данные загружены");render()}catch(err){toast("Это не файл резервной копии Ясно")}};r.readAsText(file)});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const k=today();
  switch(f.dataset.form){
    case"goal":{const inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;const dk=f.dataset.day==="tm"?dkey(Date.now()+DAY):k,L=goalsOf(dk);L.push({id:uid(),text:v,done:false,top:L.filter(g=>g.top).length<3});save();rerender();const sel=f.dataset.day==="tm"?'[data-form=goal][data-day=tm] input':(PK==="rit"?'#panel [data-form=goal] input':'#gIn');setTimeout(()=>{const x=$(sel);if(x)x.focus()},0);break}
    case"habit":{const v=$("#hIn").value.trim();if(!v)return;S.habits.push({id:uid(),name:v});save();rererender();break}
    case"rem":{const tm=$("#rT").value,tx=$("#rX").value.trim();const days=[...document.querySelectorAll("#rD .chip")].filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>+c.dataset.d);
      if(!tm||!tx){toast("Укажи время и текст");return}if(!days.length){toast("Выбери хотя бы один день");return}
      S.reminders.push({id:uid(),time:tm,text:tx,days,on:true});save();toast("Напоминание добавлено");render();break}
    case"step":{const inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;const b=S.big.find(x=>x.id===f.dataset.g);b.steps.push({id:uid(),text:v,done:false});save();render();break}
    case"book":break;
  }
});

async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("yasno:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of"yasno:"+s)h=(h*31+c.charCodeAt(0))|0;return"x"+h}}

document.addEventListener("click",async e=>{
  const nav=e.target.closest("#tabs button,[data-tab-go]");if(nav){tab=nav.dataset.tab||nav.dataset.tabGo;render();scrollTo(0,0);return}
  const dchip=e.target.closest("#rD .chip");if(dchip){dchip.setAttribute("aria-pressed",dchip.getAttribute("aria-pressed")==="true"?"false":"true");return}

    case"g-top":{const g=G.find(x=>x.id===b.dataset.id);g.top=!g.top;save();rerender();break}

    case"carry":{const yk=dkey(Date.now()-DAY);(S.goals[yk]||[]).filter(g=>!g.done&&!g.moved).forEach(g=>{g.moved=true;G.push({id:uid(),text:g.text,done:false,top:g.top})});save();toast("Перенесено");rerender();break}
    case"habit":{const arr=S.habitLog[k]||(S.habitLog[k]=[]);const i=arr.indexOf(b.dataset.id);if(i>=0)arr.splice(i,1);else{arr.push(b.dataset.id);buzz(15)}save();render();break}
    case"h-del":S.habits=S.habits.filter(h=>h.id!==b.dataset.id);save();render();break;
    case"ci":{const c=S.checkins[k]||(S.checkins[k]={mood:0,energy:0,sleep:7,water:0});c[b.dataset.f]=+b.dataset.v;save();rerender();break}
    case"water":{const c=S.checkins[k]||(S.checkins[k]={mood:0,energy:0,sleep:7,water:0});c.water=Math.max(0,Math.min(20,(c.water||0)+ +b.dataset.v));save();rerender();break}
    case"sleep":{const c=S.checkins[k]||(S.checkins[k]={mood:0,energy:0,sleep:7,water:0});c.sleep=Math.max(0,Math.min(14,(c.sleep??7)+ +b.dataset.v));save();rerender();break}
    case"r-tog":{const r=S.reminders.find(x=>x.id===b.dataset.id);r.on=!r.on;save();render();break}
    case"r-del":S.reminders=S.reminders.filter(x=>x.id!==b.dataset.id);save();render();break;
    case"ics":if(!S.reminders.some(r=>r.on)){toast("Нет включённых напоминаний");return}download("yasno-napominaniya.ics",icsFile(),"text/calendar");toast("Открой скачанный файл");break;
    case"notif":if(S.settings.notif){S.settings.notif=false;save();render()}else{await enableNotif();render()}break;
    case"f-start":{const f=S.ft;if(f.running){f.left=ftLeft();f.running=false;f.end=null;keepAwake(false)}else{f.end=Date.now()+ftLeft()*1000;f.running=true;keepAwake(true)}save();render();break}
    case"f-reset":{const f=S.ft;f.running=false;f.end=null;f.left=(f.mode==="work"?S.focus.work:S.focus.brk)*60;keepAwake(false);save();render();break}

    case"st-tog":{const g=S.big.find(x=>x.id===b.dataset.g),s=g.steps.find(x=>x.id===b.dataset.id);s.done=!s.done;if(s.done)buzz(15);save();render();break}

function finishCheck(b){if(b.pages&&b.cur>=b.pages&&b.status!=="done"){b.status="done";b.finished=Date.now();toast("Книга прочитана 🎉");buzz([30,50,30])}}
function addPages(b,n){const was=b.cur;b.cur=Math.min(b.pages||99999,b.cur+n);logPages(b.cur-was);finishCheck(b);save()}
function setPage(b,p){p=Math.max(0,Math.min(b.pages||99999,p));logPages(p-b.cur);b.cur=p;finishCheck(b);save()}

function wInfo(c){if(c===0)return["sun","Ясно"];if(c===1)return["part","Почти ясно"];if(c===2)return["part","Переменная облачность"];if(c===3)return["cloud","Пасмурно"];if(c<=48)return["fog","Туман"];if(c<=57)return["rain","Морось"];if(c<=67)return["rain","Дождь"];if(c<=77)return["snow","Снег"];if(c<=82)return["rain","Ливень"];if(c<=86)return["snow","Снегопад"];return["storm","Гроза"]}

let fetching={};
async function getJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function loadWeather(force){
  const c=S.dash.city;if(!c||fetching.w)return;const old=S.cache.weather;
  if(!force&&old&&old.lat===c.lat&&old.lon===c.lon&&Date.now()-old.t<30*6e4)return;
  if(!force&&S.cache.wErr&&Date.now()-S.cache.wErr<6e4)return;
  fetching.w=1;
  try{const d=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=4&wind_speed_unit=ms`);
    S.cache.weather={t:Date.now(),lat:c.lat,lon:c.lon,data:d};S.cache.wErr=0;save()}
  catch(e){S.cache.wErr=Date.now()}
  fetching.w=0;dashRefresh()}
async function loadFx(force){
  if(fetching.fx)return;const old=S.cache.fx;if(!force&&old&&Date.now()-old.t<3*36e5)return;
  if(!force&&S.cache.fxErr&&Date.now()-S.cache.fxErr<6e4)return;
  fetching.fx=1;
  try{const d=await getJSON("https://www.cbr-xml-daily.ru/daily_json.js");const rates={};
    Object.keys(CURS).forEach(k=>{const v=d.Valute[k];if(v)rates[k]={v:v.Value,p:v.Previous,n:v.Nominal}});
    S.cache.fx={t:Date.now(),date:d.Date,src:"ЦБ РФ",rates};S.cache.fxErr=0;save()}
  catch(e){
    try{const d=await getJSON("https://open.er-api.com/v6/latest/RUB");const rates={};
      Object.keys(CURS).forEach(k=>{const r=d.rates[k];if(r){const n=["KZT","JPY"].includes(k)?100:k==="TRY"?10:1;rates[k]={v:n/r,p:null,n}}});
      S.cache.fx={t:Date.now(),date:new Date().toISOString(),src:"open.er-api.com",rates};S.cache.fxErr=0;save()}
    catch(e2){S.cache.fxErr=Date.now()}}
  fetching.fx=0;dashRefresh()}
function dashFetch(){loadWeather();loadFx()}

function workState(){const w=S.dash.work,now=new Date(),d=wd(now);
  const[sh,sm]=w.start.split(":").map(Number),[eh,em]=w.end.split(":").map(Number);
  const st=new Date(now);st.setHours(sh,sm,0,0);const en=new Date(now);en.setHours(eh,em,0,0);
  if(!w.days.includes(d))return{k:"off"};
  if(en<=st)return{k:"bad"};
  if(now<st)return{k:"before",ms:st-now,p:0};
  if(now>=en)return{k:"after",p:1};
  return{k:"work",ms:en-now,p:(now-st)/(en-st)}}
function fmtDur(ms){const m=Math.ceil(ms/6e4),h=Math.floor(m/60);return h+":"+String(m%60).padStart(2,"0")}
function nextOcc(x){const now=new Date();now.setHours(0,0,0,0);let y=now.getFullYear();
  const leap=yy=>yy%4===0&&(yy%100!==0||yy%400===0);
  const mk=yy=>new Date(yy,x.month-1,(x.month===2&&x.day===29&&!leap(yy))?28:x.day);
  let dt=mk(y);if(dt<now)dt=mk(++y);
  return{date:dt,days:Math.round((dt-now)/DAY),age:x.year?y-x.year:null}}
function whenTxt(n){return n===0?"сегодня":n===1?"завтра":"через "+n+" "+pl(n,"день","дня","дней")}

function datesIcs(){
  const pad=n=>String(n).padStart(2,"0"),now=new Date();
  const stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+"00Z";
  const clean=s=>s.replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g," ");
  let out="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Yasno//Dates//RU\r\nCALSCALE:GREGORIAN\r\n";
  S.dates.forEach(x=>{const o=nextOcc(x),d=o.date,ds=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
    const rule=x.month===2&&x.day===29?"FREQ=YEARLY;BYMONTH=2;BYMONTHDAY=-1":"FREQ=YEARLY";
    const title=(x.type==="bday"?"🎂 День рождения: ":x.type==="anniv"?"💍 Годовщина: ":"📅 ")+x.name;
    out+=`BEGIN:VEVENT\r\nUID:${x.id}@yasno-dates\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${ds}\r\nRRULE:${rule}\r\nSUMMARY:${clean(title)}\r\n${x.note?"DESCRIPTION:"+clean(x.note)+"\r\n":""}TRANSP:TRANSPARENT\r\n`;
    out+=`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${clean(title)}\r\nTRIGGER:PT9H\r\nEND:VALARM\r\n`;
    out+=`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Завтра: ${clean(title)}\r\nTRIGGER:-PT15H\r\nEND:VALARM\r\n`;
    if(x.remind.includes(7))out+=`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Через неделю: ${clean(title)}\r\nTRIGGER:-P6DT15H\r\nEND:VALARM\r\n`;
    out+="END:VEVENT\r\n"});
  return out+"END:VCALENDAR\r\n"}
function checkDates(){

function allDue(){return S.mem.decks.reduce((a,d)=>a+dueCards(d).length,0)}
function decksView(){
  const tot=S.mem.decks.reduce((a,d)=>a+d.cards.length,0),learned=S.mem.decks.reduce((a,d)=>a+d.cards.filter(c=>c.box>=4).length,0);
  return`<div class="stats"><div class="stat"><b>${allDue()}</b><span>на повтор сегодня</span></div><div class="stat"><b>${learned}</b><span>выучено надолго</span></div><div class="stat"><b>${tot}</b><span>карточек всего</span></div></div>
  <section class="card tip"><p class="small">Интервальное повторение: карточку, которую помнишь, приложение покажет через 1, 2, 4, 8, 16… дней. Забытая возвращается в начало. Так слова переходят в долгую память за минимум времени.</p></section>
  ${S.mem.decks.map(d=>{const due=dueCards(d).length,lv=d.cards.length?d.cards.reduce((a,c)=>a+c.box,0)/(d.cards.length*7):0;return`<section class="card">
    <div class="row between nowrap"><h2 class="grow" style="overflow-wrap:anywhere">${esc(d.name)}</h2><button class="x" data-m="deck-del" data-id="${d.id}" aria-label="Удалить колоду">×</button></div>
    <p class="small muted">${d.cards.length} ${pl(d.cards.length,"карточка","карточки","карточек")} · ${due} на сегодня</p>
    <div class="track sea"><i style="width:${(lv*100).toFixed(0)}%"></i></div>
    <div class="two"><button class="btn ${due?"pri":""}" data-m="rev" data-id="${d.id}" ${d.cards.length?"":"disabled"}>${due?"Повторить ("+due+")":"Повторить всё"}</button><button class="btn" data-m="edit" data-id="${d.id}">Карточки</button></div></section>`}).join("")}
  <form class="card" data-mform="deck" style="gap:10px"><h2>Новая колода</h2><div class="addrow"><input type="text" placeholder="Например: английский, формулы, даты" maxlength="50"><button class="btn pri" type="submit">+</button></div></form>`}
function reviewView(){const R2=M.review,d=S.mem.decks.find(x=>x.id===R2.deck);
  if(!d||R2.i>=R2.q.length){return`<section class="card" style="text-align:center;justify-items:center;padding:28px 16px"><div class="tnum">${R2.ok}/${R2.ok+R2.bad}</div><h2>Повторение закончено</h2><p class="small muted">${R2.bad?"Забытые карточки вернутся завтра.":"Всё вспомнил — отлично."}</p><button class="btn pri" data-m="back">К колодам</button></section>`}
  const c=d.cards.find(x=>x.id===R2.q[R2.i]);
  return`<div class="row between"><span class="label">${esc(d.name)}</span><span class="mono small">${R2.i+1} / ${R2.q.length}</span></div>
  <div class="track sea"><i style="width:${R2.i/R2.q.length*100}%"></i></div>
  <button class="fcard ${R2.show?"flip":""}" data-m="flip" aria-label="Перевернуть карточку"><span class="fin"><span class="ff">${esc(c.f)}<small>нажми, чтобы проверить</small></span><span class="fb">${esc(c.b)}<small>${esc(c.f)}</small></span></span></button>
  ${R2.show?`<div class="two"><button class="btn bad" data-m="bad">Не вспомнил</button><button class="btn sea" data-m="good">Помню</button></div>`:`<button class="btn" data-m="flip">Показать ответ</button>`}
  <button class="link" data-m="back" style="justify-self:center">Закончить</button>`}
function editView(){const d=S.mem.decks.find(x=>x.id===M.edit);if(!d){M.edit=null;return decksView()}
  return`<div class="row between"><button class="link" data-m="back">← Колоды</button><span class="label">${d.cards.length} ${pl(d.cards.length,"карточка","карточки","карточек")}</span></div>
  <h2>${esc(d.name)}</h2>
  <form class="card" data-mform="card" style="gap:10px"><input type="text" id="mF" placeholder="Вопрос / слово" maxlength="120"><input type="text" id="mB" placeholder="Ответ / перевод" maxlength="160"><button class="btn pri" type="submit">Добавить карточку</button></form>
  <details class="k"><summary>Добавить списком</summary><div class="kb"><p class="small muted">Каждая строка — карточка: <code>слово — перевод</code></p><textarea id="mBulk" rows="5" placeholder="apple — яблоко&#10;river — река"></textarea><button class="btn" data-m="bulk">Импортировать</button></div></details>
  <div class="list">${d.cards.map(c=>`<div class="item"><p><b>${esc(c.f)}</b><br><span class="small muted">${esc(c.b)}</span></p><span class="lvl" title="Уровень ${c.box}">${Array.from({length:7},(_,i)=>`<i class="${i<c.box?"on":""}"></i>`).join("")}</span><button class="x" data-m="card-del" data-id="${c.id}" aria-label="Удалить">×</button></div>`).join("")||`<p class="small muted">Пока пусто.</p>`}</div>`}
function digitsView(){const g=M.dg,best=S.mem.best.digits||0;
  if(g.st==="idle")return`<section class="card" style="text-align:center;justify-items:center;padding:24px 16px"><div class="digit" style="font-size:44px">7 3 9 1</div><h2>Запомни цифры</h2><p class="small muted">Цифры появятся по одной. Повтори их по порядку. Каждый верный ответ добавляет цифру. Обычный объём кратковременной памяти — 7±2.</p><p>Рекорд: <b class="mono">${best}</b></p><button class="btn pri" data-m="dg-start">Начать с 4 цифр</button></section>`;
  if(g.st==="show")return`<section class="card" style="text-align:center;padding:40px 16px"><p class="label">Запоминай · ${g.n} ${pl(g.n,"цифра","цифры","цифр")}</p><div class="digit" id="dgD">·</div></section>`;
  if(g.st==="input")return`<form class="card" data-mform="digits" style="text-align:center;justify-items:center;padding:28px 16px"><p class="label">Введи ${g.n} ${pl(g.n,"цифру","цифры","цифр")}</p><input type="text" inputmode="numeric" pattern="[0-9]*" id="dgIn" autocomplete="off" maxlength="${g.n}" style="text-align:center;font:700 32px var(--mono);letter-spacing:.2em"><button class="btn pri" type="submit" style="min-width:160px">Проверить</button></form>`;
  return`<section class="card" style="text-align:center;justify-items:center;padding:24px 16px"><h2>Результат: ${g.n-1} ${pl(g.n-1,"цифра","цифры","цифр")}</h2>
    <p class="small muted">Было: <b class="mono" style="color:var(--ink)">${g.seq}</b><br>Ты ввёл: <b class="mono" style="color:var(--bad)">${esc(g.ans)||"—"}</b></p>
    <p>Рекорд: <b class="mono">${best}</b></p><button class="btn pri" data-m="dg-start">Ещё раз</button></section>`}
function pairsView(){const P=M.pg,b=S.mem.best;
  if(!P)return`<section class="card" style="text-align:center;justify-items:center;padding:24px 16px"><div class="row" style="justify-content:center;font-size:28px;gap:10px"><span style="color:var(--dawn)">◆</span><span style="color:var(--sea)">●</span><span style="color:var(--rose)">♥</span></div><h2>Найди пары</h2><p class="small muted">16 карточек, 8 пар. Открывай по две и запоминай, где что лежит. Меньше ходов — лучше.</p>${b.pairs?`<p>Рекорд: <b class="mono">${b.pairs.moves}</b> ходов за <b class="mono">${b.pairs.time}</b> с</p>`:""}<button class="btn pri" data-m="pg-start">Начать</button></section>`;
  const done=P.c.every(c=>c.m),t=Math.round(((P.end||Date.now())-P.start)/1000);
  return`<div class="row between"><span class="label">Ходов: <b class="mono">${P.moves}</b></span><span class="label mono" id="pgT">${t} с</span></div>
  <div class="pairs">${P.c.map((c,i)=>`<button class="pc ${c.o||c.m?"open":""} ${c.m?"got":""}" data-m="pg" data-i="${i}" aria-label="Карточка ${i+1}" ${c.m?"disabled":""}><span style="color:${PCOL[c.s%4]}">${c.o||c.m?PSYM[c.s]:""}</span></button>`).join("")}</div>
  ${done?`<section class="card" style="text-align:center;justify-items:center"><h2>Готово!</h2><p>${P.moves} ходов за ${t} с</p><button class="btn pri" data-m="pg-start">Ещё раз</button></section>`:""}`}
function renderMem(){
  let body="";if(mtab==="cards")body=M.review?reviewView():M.edit?editView():decksView();else if(mtab==="digits")body=digitsView();else body=pairsView();
  $("#panel").innerHTML=`<div class="panel"><div class="wrap">
  <div class="top"><button class="btn sm ghost" data-m="close">← Назад</button><span class="label">Тренажёр памяти</span></div>
  <div class="seg rtabs">${[["cards","Карточки"],["digits","Цифры"],["pairs","Пары"]].map(([k,t])=>`<button data-m="tab" data-v="${k}" aria-pressed="${mtab===k}">${t}</button>`).join("")}</div>
  ${body}</div></div>`;
  if(mtab==="digits"&&M.dg.st==="input"){const i=$("#dgIn");if(i)setTimeout(()=>i.focus(),30)}}
function stopGames(){clearTimeout(dgTimer);clearInterval(pgTimer);if(M.dg.st==="show")M.dg.st="idle"}
function dgRun(){const g=M.dg;g.st="show";g.seq=Array.from({length:g.n},()=>Math.floor(Math.random()*10)).join("");renderMem();let i=0;
  const step=()=>{if(PK!=="mem"||mtab!=="digits"||M.dg!==g)return;const el=$("#dgD");if(!el)return;
    if(i<g.seq.length){el.textContent=g.seq[i];el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");i++;dgTimer=setTimeout(()=>{el.textContent="";dgTimer=setTimeout(step,250)},750)}
    else{g.st="input";renderMem()}};
  dgTimer=setTimeout(step,600)}
document.addEventListener("submit",e=>{const f=e.target.closest("[data-mform]");if(!f)return;e.preventDefault();
  if(f.dataset.mform==="deck"){const v=f.querySelector("input").value.trim();if(!v)return;const d={id:uid(),name:v,cards:[]};S.mem.decks.push(d);M.edit=d.id;save();renderMem()}
  else if(f.dataset.mform==="card"){const a=$("#mF").value.trim(),b=$("#mB").value.trim();if(!a||!b){toast("Заполни обе стороны");return}const d=S.mem.decks.find(x=>x.id===M.edit);d.cards.unshift({id:uid(),f:a,b,box:0,due:0});save();renderMem();setTimeout(()=>{const x=$("#mF");if(x)x.focus()},30)}
  else if(f.dataset.mform==="digits"){const g=M.dg,v=$("#dgIn").value.replace(/\D/g,"");
    if(v===g.seq){S.mem.best.digits=Math.max(S.mem.best.digits||0,g.n);save();buzz(20);toast("Верно! +1 цифра");g.n++;dgRun()}
    else{g.ans=v;g.st="over";S.mem.best.digits=Math.max(S.mem.best.digits||0,g.n-1);save();buzz(80);renderMem()}}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;const a=b.dataset.m;
  switch(a){
    case"close":stopGames();closePanel();break;
    case"tab":stopGames();mtab=b.dataset.v;renderMem();break;
    case"back":M.review=null;M.edit=null;renderMem();render();break;
    case"edit":M.edit=b.dataset.id;renderMem();break;
    case"deck-del":if(b.dataset.sure){S.mem.decks=S.mem.decks.filter(d=>d.id!==b.dataset.id);save();renderMem()}else{b.dataset.sure=1;b.textContent="Удалить?";b.style.fontSize="13px";b.style.color="var(--bad)"}break;
    case"card-del":{const d=S.mem.decks.find(x=>x.id===M.edit);d.cards=d.cards.filter(c=>c.id!==b.dataset.id);save();renderMem();break}
    case"bulk":{const d=S.mem.decks.find(x=>x.id===M.edit),lines=$("#mBulk").value.split("\n");let n=0;
      lines.forEach(l=>{const m=l.split(/\s+[—–-]\s+|\t|\s*=\s*|;/);if(m.length>=2&&m[0].trim()&&m.slice(1).join(" — ").trim()){d.cards.push({id:uid(),f:m[0].trim(),b:m.slice(1).join(" — ").trim(),box:0,due:0});n++}});
      save();toast(n?"Добавлено: "+n:"Не нашёл строк вида «слово — перевод»");renderMem();break}
    case"rev":{const d=S.mem.decks.find(x=>x.id===b.dataset.id);let q=dueCards(d).map(c=>c.id);if(!q.length)q=d.cards.map(c=>c.id);
      q.sort(()=>Math.random()-.5);M.review={deck:d.id,q,i:0,show:false,ok:0,bad:0,seen:{}};renderMem();break}
    case"flip":if(M.review){M.review.show=!M.review.show;renderMem()}break;
    case"good":case"bad":{const R2=M.review,d=S.mem.decks.find(x=>x.id===R2.deck),c=d.cards.find(x=>x.id===R2.q[R2.i]);
      if(a==="good"){if(!R2.seen[c.id]){c.box=Math.min(7,c.box+1);R2.ok++}c.due=sod(Date.now())+INTV[c.box]*DAY;buzz(12)}
      else{c.box=0;c.due=0;if(!R2.seen[c.id]){R2.bad++;R2.q.push(c.id)}}
      R2.seen[c.id]=1;R2.i++;R2.show=false;save();renderMem();break}
    case"dg-start":M.dg={st:"idle",n:4,seq:"",ans:""};dgRun();break;
    case"pg-start":{const s=[0,1,2,3,4,5,6,7,0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5);M.pg={c:s.map(x=>({s:x,o:false,m:false})),open:[],moves:0,start:Date.now(),end:null,lock:false};
      clearInterval(pgTimer);pgTimer=setInterval(()=>{const t=$("#pgT");if(t&&M.pg&&!M.pg.end)t.textContent=Math.round((Date.now()-M.pg.start)/1000)+" с"},1000);renderMem();break}
    case"pg":{const P=M.pg;if(!P||P.lock)return;const i=+b.dataset.i,c=P.c[i];if(c.o||c.m)return;c.o=true;P.open.push(i);
      if(P.open.length===2){P.moves++;const[x,y]=P.open.map(j=>P.c[j]);
        if(x.s===y.s){x.m=y.m=true;x.o=y.o=false;P.open=[];buzz(15);
          if(P.c.every(z=>z.m)){P.end=Date.now();clearInterval(pgTimer);const t=Math.round((P.end-P.start)/1000),bb=S.mem.best.pairs;if(!bb||P.moves<bb.moves||(P.moves===bb.moves&&t<bb.time)){S.mem.best.pairs={moves:P.moves,time:t};toast("Новый рекорд!")}save()}}
        else{P.lock=true;setTimeout(()=>{x.o=y.o=false;P.open=[];P.lock=false;if(PK==="mem")renderMem()},800)}}
      renderMem();break}
  }});

/* ================= install ================= */
let deferredPrompt=null;
function isStandalone(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
function installCard(){if(isStandalone()||!deferredPrompt)return"";return`<section class="card" style="border-color:var(--dawn)"><div class="row between nowrap"><div style="min-width:0"><h2>Установи «Ясно»</h2><p class="small muted">Иконка на рабочем столе и работа без интернета.</p></div><button class="btn pri" data-act="install" style="flex:none">Установить</button></div></section>`}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if((tab==="home"||tab==="more")&&!PK&&!$("#layer").innerHTML)render()});
addEventListener("appinstalled",()=>{deferredPrompt=null;toast("Готово: «Ясно» на рабочем столе");render()});
/* ================= boot ================= */
applyTheme();
render();
setInterval(()=>{fTick();dashTick()},1000);
setInterval(()=>{checkReminders();checkDates();if((tab==="today"||tab==="home")&&!$("#layer").innerHTML&&!$("#panel").innerHTML&&!document.activeElement.matches("input,textarea"))render()},20000);
checkReminders();checkDates();
if(S.ft.running)fTick();
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(tab==="today")drawSky($("#sky"),dayLight(),skyStars(),sunPos());if(tab==="home")drawSky($("#hsky"),dayLight(),skyStars(),sunPos())},150)});
addEventListener("online",()=>{S.cache.wErr=0;S.cache.fxErr=0;dashFetch()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;fTick();checkReminders();checkDates();if(S.ft.running)keepAwake(true);if(!$("#layer").innerHTML&&!$("#panel").innerHTML&&!document.activeElement.matches("input,textarea"))render()});
if("serviceWorker"in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
