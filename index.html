.ex.na{animation:none}

.sr.ok .okb{background:var(--c);border-color:var(--c);color:#0a0c0f}.sr.ok .kg{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.plt{font-size:14px;color:var(--mut);margin:6px 0 0}
.gmo{margin-top:10px;padding:7px 14px;font-size:14px}

.gm{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-width:640px;margin:0 auto}.gm[hidden]{display:none}

.gmp{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.gmp i{display:block;height:100%;background:var(--c);transition:width .3s}.gmh span{font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.gmb{flex:1;overflow-y:auto;padding:14px 0;-webkit-overflow-scrolling:touch}
.gmn{font:900 30px/1.1 system-ui;margin:10px 0 10px}

.gm .sr .kg{font-size:26px;padding:12px 4px;border-radius:14px}.gm .okb{height:60px;font-size:26px;border-radius:14px}.gm .plt{font-size:16px}

.gmf{display:grid;grid-template-columns:1fr 2fr;gap:10px}.gmf button{height:64px;border-radius:18px;font:900 20px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.gmf button:disabled{opacity:.35}.gmf .nx{background:var(--c);border-color:var(--c);color:#0a0c0f}
.bigok{width:100%;height:72px;border-radius:18px;border:2px solid var(--c);background:none;color:var(--c);font:900 22px system-ui;margin-top:12px;cursor:pointer}.bigok.on{background:var(--c);color:#0a0c0f}
.gdn{display:inline-block;margin-left:8px;font-size:13px;font-weight:800;color:var(--c)}
body.lock{overflow:hidden}
.hw{color:var(--mut)}.hw h4{margin:14px 0 4px;font:800 13px system-ui;color:var(--ink);text-transform:uppercase;letter-spacing:.6px}.hw ol,.hw ul{margin:0;padding-left:20px}.hw li{margin:4px 0}.hw li::marker{color:var(--c);font-weight:800}
.mu{color:var(--ink);font-weight:600}.tp{background:var(--c2);border-radius:12px;padding:9px 11px;color:var(--ink);margin-top:12px!important}
.adj{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.adj .tab{padding:7px 12px;font-size:14px}
.tm,.gmt{overflow:hidden;background:linear-gradient(100deg,color-mix(in srgb,var(--s) 22%,var(--card)),color-mix(in srgb,var(--r) 22%,var(--card)) 55%,color-mix(in srgb,var(--l) 22%,var(--card)));border-color:color-mix(in srgb,var(--r) 35%,var(--line));transition:background .4s,border-color .4s}
.gmt{position:relative}.tm>*,.gmt>*{position:relative}.tm .tf,.gmt .tf{position:absolute;left:0;top:0;bottom:0;background:hsl(var(--th) 85% 50% / .38);transition:width 1s linear,background 1s}
.tm.run,.gmt.run{background:var(--card);border-color:hsl(var(--th) 85% 55%);box-shadow:0 0 22px -6px hsl(var(--th) 85% 50%)}
.tt{font:900 22px system-ui;min-width:72px;text-align:center;font-variant-numeric:tabular-nums;color:hsl(var(--th,140) 85% 62%)}.gmt .tt{font-size:28px;min-width:96px}
.tm.warn .tt,.gmt.warn .tt{animation:pul .5s ease-in-out infinite alternate}@keyframes pul{to{transform:scale(1.15)}}

.tl{font-size:18px}.tm .tab,.gmt .tab{background:color-mix(in srgb,var(--card) 70%,transparent)}
.tms{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:592px;margin:auto;z-index:9;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}.tms[hidden]{display:none}
.tm.min{left:auto;right:16px;width:60px;height:60px;padding:0;border-radius:50%;gap:0;cursor:pointer;justify-content:center;box-shadow:0 8px 24px -6px rgba(0,0,0,.7)}

.tm.min .tt{font-size:15px;min-width:0}.tm.min .tl{font-size:24px}.tm .tx{padding:7px 10px}

/* ===== refined motion & typography ===== */
:root{--ease:cubic-bezier(.22,.8,.24,1);--spring:cubic-bezier(.3,1.35,.45,1)}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.ic{display:inline-block;vertical-align:-3px;flex:0 0 auto}

I.brow=["Стой, ноги на ширине плеч, колени чуть согнуты, штанга в руках хватом чуть шире плеч, корпус наклонён почти параллельно полу.","Тяни штангу к низу живота, сводя лопатки, локти вдоль тела. Спину не округляй, вверх не рывком."];
I.revlat=["Сядь, бёдра под валиком, хват снизу (ладони к себе) на ширине плеч.","Тяни перекладину к верху груди, локти вниз, грудь вперёд. Плавно верни."];
I.stcalf=["Встань носками на край степа или платформы, пятки свисают, гантели в руках, для баланса можно опереться.","Поднимись на носки как можно выше, задержись на секунду, медленно опустись ниже платформы."];
I.revcurl=["Стой, штанга или гантели в руках хватом сверху (ладони вниз), локти прижаты.","Сгибай руки, не раскачиваясь, запястья не сгибай. Медленно опусти."];
I.wristext=["Сядь, предплечье с гантелью на колене ладонью вниз, кисть свисает.","Разгибай кисть вверх, медленно опускай. Вес лёгкий."];
I.farmer=["Возьми тяжёлые гантели, встань прямо, плечи отведены назад.","Иди ровным шагом 30 м, не раскачивайся, хват не ослабляй."];
I.warm=["Лёгкое кардио 2–3 мин (дорожка или велотренажёр).","Круги плечами и руками, наклоны, потом 1–2 разминочных подхода первого упражнения с лёгким весом."];
I.facepull=["Встань к верхнему блоку с канатом, руки вытянуты вперёд на уровне плеч.","Тяни канат к лицу, разводя локти в стороны и сводя лопатки. Плавно верни."];
I.incl=["Скамья под углом ~30°, спина прижата, гантели над грудью.","Опусти гантели к верху груди, локти чуть в стороны, выжми вверх."];
I.hyper=["Ляг животом на подушку тренажёра, бёдра на подушке, ступни зафиксированы, руки скрещены на груди.","Наклонись вниз с прямой спиной, затем поднимись до прямой линии с ногами. Выше не прогибайся."];

I.rdl=["Стой с гантелями перед бёдрами, ноги на ширине таза, колени чуть согнуты.","Отводи таз назад, спина прямая, гантели скользят вдоль ног до середины голени. Встань, сжав ягодицы."];
I.run=["Разомнись 3–5 мин ходьбой, обувь удобная.","Беги 2 км в комфортном темпе, корпус чуть вперёд, шаг лёгкий, дыхание ровное. В конце 2–3 мин ходьбы."];

I.pallof=["Встань боком к блоку, рукоять на уровне груди. Отойди на шаг, чтобы трос был натянут, стопы на ширине плеч, колени чуть согнуты.","Выжми рукоять от груди вперёд на прямые руки и держи 2 с, не давая корпусу повернуться к блоку. Верни к груди."];
I.chop=["Встань боком к блоку, рукоять вверху. Возьми её двумя руками над плечом, стопы шире плеч.","Тяни рукоять по диагонали вниз к противоположному бедру, поворачивая корпус. Медленно верни."];

var MX={"warm":{"mp":"Сердечно-сосудистая система, крупные суставы (плечи, тазобедренные, колени)","ms":"Мышцы кора, связки и сухожилия","p":["Выбери кардиотренажёр: дорожка, велотренажёр или эллипс, сопротивление низкое.","Освободи место 2×2 м для суставной разминки и выпадов.","Заранее поставь гриф или лёгкие гантели для первого упражнения."],"s":["2–3 мин лёгкого кардио до ощущения тепла и лёгкой испарины. Говорить должно быть легко.","Суставы сверху вниз, по 8–10 движений: наклоны головы вперёд и в стороны (без вращений), круги плечами, локтями, кистями.","Дальше корпус и ноги: наклоны корпуса, круги тазом, коленями и стопами по 8–10 в каждую сторону.","Грудной отдел: на четвереньках рука за голову, разворачивай локоть к потолку — по 10 на сторону, взгляд за локтем.","Боковые наклоны с рукой над головой — по 20 с на сторону, тянись вверх и в сторону.","Динамика: 10 махов руками, по 5 выпадов с поворотом корпуса к передней ноге, по 10 махов ногой вперёд и в сторону.","Перед первым упражнением — 1–2 подхода по 10–12 повторов с пустым грифом или 40–50% рабочего веса."],"f":"Тепло в теле, лёгкое учащение пульса и свобода в суставах; боли и усталости быть не должно.","tm":"Плавно, без рывков · 8–10 движений на сустав · всего около 5 мин","b":"Дыши свободно и ровно через нос, не задерживай дыхание на махах и выпадах.","e":[["Статическая растяжка до тренировки","Держание поз оставь на конец, сейчас только динамика"],["Сразу рабочий вес","Сделай 1–2 лёгких подхода первого упражнения"],["Резкие вращения головой","Только плавные наклоны вперёд и в стороны"],["Разминка до усталости","Держи лёгкий темп, цель — согреться, а не устать"]],"lt":"Делай только кардио и круги в суставах, махи выполняй с меньшей амплитудой.","hd":"Добавь 10 приседаний без веса и 10 отжиманий перед разминочными подходами.","sf":"Если сустав щёлкает с болью или кружится голова — уменьши амплитуду и сбавь темп.","t":"Холодные мышцы и связки травмируются чаще — эти 5 минут окупаются весь год."},"pullup":{"mp":"Широчайшие, большая круглая, бицепс","ms":"Задние дельты, середина трапеции, ромбовидные","p":["Хват сверху чуть шире плеч, большой палец обхватывает перекладину.","Повисни на прямых руках, ноги скрести или вытяни чуть вперёд, пресс напряги.","Если меньше 6 повторов — подготовь резиновую ленту или гравитрон."],"s":["Из виса опусти плечи от ушей и чуть сведи лопатки — руки ещё прямые.","Тяни себя вверх, ведя локти вниз к рёбрам. Грудь идёт к перекладине.","Взгляд вперёд или чуть вверх, шея ровная, голову не запрокидывай.","Подбородок выше перекладины — пауза 1 с.","Опускайся подконтрольно 2–3 с, не бросай тело.","Внизу полностью выпрями руки, сохраняя лёгкий тонус в плечах, и начни следующий повтор с лопаток."],"f":"Работают широчайшие по бокам спины и бицепс; в плечевом суставе и шее давления быть не должно.","tm":"Вверх 1–2 с · пауза 1 с · вниз 2–3 с","b":"Вдох в висе, выдох на подъёме. Вниз опускайся на вдохе.","e":[["Раскачка и рывки ногами","Напряги пресс и ягодицы, ноги держи неподвижно"],["Руки внизу не выпрямляются","Каждый повтор начинай из полного виса"],["Тянешься подбородком, запрокидывая голову","Тяни грудь к перекладине, шея ровная"],["Плечи поднимаются к ушам","Перед каждым повтором опусти плечи вниз"]],"lt":"Подтягивайся с резиновой лентой или в гравитроне, либо делай только медленные опускания по 5–8 с.","hd":"Добавь вес на пояс или делай паузу 3 с в верхней точке.","sf":"При боли в плече или локте остановись; после травм плеча начни с гравитрона.","t":"Представь, что ломаешь перекладину пополам, сгибая её вниз — так включаются широчайшие."},"brow":{"mp":"Широчайшие, ромбовидные, средняя трапеция","ms":"Задние дельты, разгибатели спины, бицепс","p":["Начни с лёгкого веса, пока не освоишь стабильный наклон.","Стопы на ширине таза, гриф над серединой стопы, хват сверху чуть шире плеч.","Подними штангу с прямой спиной, как в становой, и встань в наклон."],"s":["Чуть согни колени и отведи таз назад, наклони корпус до 45° или ниже. Спина прямая, анат.","Возьмись хватом сверху на ширине плеч, отступи на полшага назад.","Стопы на ширине плеч, колени мягкие, корпус слегка наклони вперёд, локти прижми к бокам."],"s":["Опусти плечи и зафиксируй локти у корпуса — дальше двигаются только предплечья.","Начальное положение: локти согнуты на 90°, предплечья параллельны полу.","Разгибай руки вниз до полного выпрямления за 1 с.","Внизу напряги трицепс на 1 с; с канатом разведи концы в стороны.","Медленно верни рукоять вверх за 2 с до угла 90° в локтях.","Не давай локтям уходить вперёд и вверх на возврате."],"f":"Работа задней части плеча, особенно внизу; плечи и спина не должны помогать.","tm":"Вниз 1 с · пауза 1 с · вверх 2 с","b":"Выдох при разгибании вниз, вдох при возврате.","e":[["Локти гуляют вперёд-назад","Прижми локти к бокам"],["Корпус наваливается на вес","Уменьши вес, держи корпус неподвижным"],["Неполное разгибание","Выпрямляй руки до конца"],["Кисти сгибаются","Держи запястья прямыми"]],"lt":"Возьми канат и лёгкий вес, делай по 1 с паузе внизу.","hd":"Делай одной рукой с рукоятью или добавь паузу 2 с внизу.","sf":"Остановись при боли в локте; уменьши вес и не форсируй.","t":"Представь, что локти приклеены к рёбрам."},"fr":{"mp":"Трицепс (особенно длинная головка)","ms":"Пресс, мышцы предплечья","p":["Возьми EZ-гриф узким хватом на ширине 15–20 см или две гантели.","Ляг на горизонтальную скамью, стопы на полу, поясница в естественном прогибе.","Выжми вес на прямые руки над грудью, затем отведи руки к голове на 10–15°."],"s":["Зафиксируй плечи в этом положении — дальше двигаются только локти.","Сгибай локти, опуская гриф ко лбу или чуть за голову, за 2–3 с.","Локти смотрят в потолок и не расходятся в стороны.","Остановись, когда гриф в 2–3 см от лба, а трицепс растянут.","Разогни руки, возвращая вес по той же дуге.","Наверху не выпрямляй руки вертикально — держи наклон, чтобы трицепс не отдыхал."],"f":"Растяжение и работа задней поверхности плеча; локти не должны болеть.","tm":"Вниз 2–3 с · вверх 1 с","b":"Вдох при опускании, выдох при разгибании.","e":[["Локти расходятся в стороны","Своди локти на ширину плеч"],["Движение плечами","Двигай только в локтях"],["Слишком тяжёлый вес","Возьми вес на 12 чистых повторов"],["Руки вертикальны наверху","Держи наклон к голове 10–15°"]],"lt":"Делай с гантелями нейтральным хватом, ладони друг к другу.","hd":"Делай на скамье с наклоном головой вниз или добавь паузу 1 с внизу.","sf":"Остановись при боли в локтях; всегда контролируй гриф у лица.","t":"Представь, что руки — шарнир, который сгибается только в локте."},"stcalf":{"mp":"Икроножные мышцы","ms":"Камбаловидные мышцы, мышцы стопы","p":["Встань носками на край степа или блина, пятки свисают.","Возьми гантель в одну руку, другой держись за опору для баланса.","Стопы на ширине таза, носки прямо, колени почти прямые."],"s":["Перенеси вес на подушечки стоп, особенно под большим пальцем.","Опусти пятки как можно ниже за 2 с, почувствуй растяжение икр.","Задержись внизу на 1 с без пружины.","Поднимись на носки максимально высоко за 1 с.","Наверху сожми икры и держи 1–2 с.","Колени не сгибай, корпус прямой весь подход."],"f":"Жжение и растяжение в икрах; ахилл не должен колоть.","tm":"Вверх 1 с · пауза 1–2 с · вниз 2 с · пауза 1 с","b":"Выдох при подъёме на носки, вдох при опускании.","e":[["Быстрые пружинящие повторы","Делай паузы вверху и внизу"],["Неполная амплитуда","Опускай пятки ниже края"],["Вес уходит на мизинцы","Дави подушечкой большого пальца"],["Сгибаешь колени","Держи ноги почти прямыми"]],"lt":"Делай без гантели, держась двумя руками.","hd":"Делай на одной ноге с гантелью в руке.","sf":"Остановись при резкой боли в ахилле или судороге.","t":"Представь, что тянешься макушкой к потолку."},"calf":{"mp":"Камбаловидные мышцы","ms":"Икроножные мышцы","p":["Отрегулируй валик так, чтобы он плотно лежал на бёдрах у колен.","Поставь носки на край платформы, пятки свисают, стопы на ширине таза.","Выбери вес на 15 повторов с полной амплитудой и сними стопор."],"s":["Сядь ровно, руки на рукоятях, колени согнуты на 90°.","Опусти пятки как можно ниже за 2 с.","Задержись внизу на 1 с в растяжении.","Поднимись на носки максимально высоко.","Наверху сожми икры и держи 1–2 с.","Медленно опустись и повтори без отскока."],"f":"Работа глубоко в нижней части голени; колени и ахилл не должны болеть.","tm":"Вверх 1 с · пауза 1–2 с · вниз 2 с · пауза 1 с","b":"Выдох при подъёме, вдох при опускании.","e":[["Короткая амплитуда","Опускай пятки ниже платформы"],["Пружинящие повторы","Делай паузу внизу"],["Помогаешь руками","Руки только держат"],["Вес на мизинцах","Дави большим пальцем"]],"lt":"Уменьши вес и делай без пауз первые подходы.","hd":"Добавь паузу 3 с внизу или делай по одной ноге.","sf":"Остановись при боли в ахилле или судороге.","t":"Сидячий вариант лучше всего прорабатывает камбаловидные — не гонись за весом."},"goblet":{"mp":"Квадрицепс, ягодицы","ms":"Приводящие мышцы, кор, разгибатели спины","p":["Возьми гантель вертикально, держи за верхний блин обеими ладонями у груди.","Стопы чуть шире плеч, носки развёрнуты на 15–30°.","Локти направь вниз, грудь раскрой, взгляд вперёд."],"s":["Сделай вдох и напряги пресс.","Отведи таз назад и вниз, колени идут по линии носков.","Опускайся 2–3 с, держа гантель у груди и спину прямой.","Присядь до параллели бёдер с полом, ниже — если поясница не округляется.","Внизу локти могут касаться внутренней стороны коленей — слегка раздвинь их.","Встань, толкаясь всей стопой, колени не заваливай внутрь."],"f":"Работа в передней поверхности бёдер и ягодицах; поясница и колени не должны болеть.","tm":"Вниз 2–3 с · пауза 1 с · вверх 1 с","b":"Вдох перед приседом, задержи дыхание при опускании, выдох при вставании.","e":[["Колени заваливаются внутрь","Разводи колени по линии носков"],["Отрыв пяток","Дави пятками, носки чуть разверни"],["Округление поясницы","Приседай до того, где спина ровная"],["Гантель уходит от груди","Прижми её к груди"]],"lt":"Приседай на скамью или ящик сзади.","hd":"Возьми гантель тяжелее или добавь тся под тело, а не перед ним.","Корпус чуть наклонён вперёд от голеностопа, спина ровная, взгляд вдаль.","Руки согнуты под 90°, движутся вперёд-назад, плечи расслаблены.","Последние 200 м можно чуть ускориться, если самочувствие хорошее.","После финиша 2–3 мин ходьбы, пока дыхание не успокоится."],"f":"Должна быть ровная усталость в ногах и учащённое дыхание; острой боли в коленях, голени или стопе быть не должно.","tm":"Ровный разговорный темп · 2 км","b":"Ритмично: вдох на 2–3 шага, выдох на 2–3 шага; дыши носом и ртом.","e":[["Слишком быстрый старт","Первые 400 м держи темп, в котором легко говорить"],["Длинный шаг с ударом в пятку","Укороти шаг, ставь стопу под себя"],["Зажатые плечи и кулаки","Расслабь кисти, как будто держишь чипсы"],["Подпрыгивание вверх","Двигайся вперёд, а не вверх; шаг тише"]],"lt":"Чередуй 2 мин бега и 1 мин ходьбы, пока не наберёшь 2 км.","hd":"Пробеги последний километр быстрее первого или добавь пару горок.","sf":"Остановись при боли в груди, головокружении или острой боли в суставе.","t":"В день ног держи бег лёгким, чтобы не мешать восстановлению."},"cardio":{"mp":"Сердце, лёгкие","ms":"Мышцы ног, ягодицы","p":["Выбери формат: ходьба, велосипед, эллипс или скакалка.","Удобная обувь и одежда, вода под рукой.","Цель — лёгкая интенсивность: пульс примерно 110–130 уд/мин."],"s":["Первые 3 мин двигайся совсем спокойно, чтобы разогреться.","Выйди на темп, в котором можешь говорить полными предложениями.","Держи осанку: плечи опущены, спина прямая, взгляд вперёд.","Если пульс растёт выше зоны — сбавь темп, а не останавливайся.","Держи ровный темп все 20 мин, не ускоряйся в конце.","Последние 2–3 мин замедлись и дай дыханию успокоиться."],"f":"Должно быть лёгкое тепло и ровное дыхание; одышки и тяжести в ногах быть не должно.","tm":"Ровно и спокойно · 20 мин","b":"Ровное дыхание, лучше через нос; если приходится дышать ртом — сбавь темп.","e":[["Превращать восстановление в тяжёлую тренировку","Держи темп, в котором можешь говорить"],["Ускоря var FAQ=[{"c":"Питание","q":"Что поесть перед тренировкой?","k":["еда перед треней","что съесть до зала","перекус перед тренировкой","питание до тренировки","чем поесть перед спортом"],"a":"За 1,5–3 часа — обычный приём пищи: углеводы + белок + немного жира, например рис 70–100 г (сухой) с курицей 120–150 г. За 30–60 минут — лёгкий перекус: банан, йогурт, тост с вареньем. Избегай много жира и клетчатки прямо перед залом — тяжело в животе."},{"c":"Питание","q":"За сколько до тренировки нужно есть?","k":["сколько времени до трени есть","когда есть перед залом","интервал между едой и тренировкой","можно ли сразу после еды тренироваться"],"a":"Плотный приём пищи — за 2–3 часа, лёгкий перекус — за 30–60 минут. Сразу после большой еды тренироваться тяжело: тошнота, вялость. Ориентируйся на самочувствие: кому-то комфортно и через час после обеда."},{"c":"Питание","q":"Можно ли тренироваться натощак?","k":["трена на голодный желудок","тренировка без завтрака","утром натощак в зал","голодная тренировка"],"a":"Можно, если чувствуешь себя нормально — на силу и мышцы при достаточном белке за день это почти не влияет. Жира натощак сгорает не больше, итог решает дефицит калорий за сутки. Если кружится голова или падает сила — съешь банан или выпей сладкий чай за 30 минут. При слабости и потемнении в глазах остановись."},{"c":"Питание","q":"Что поесть во время тренировки?","k":["перекус на трене","можно ли есть в зале","банан во время тренировки","еда во время тренировки","что взять в зал поесть"],"a":"На тренировке до 60–75 минут еда не нужна — достаточно воды. Если занимаешься дольше 1,5 часа или очень интенсивно — 30–60 г углеводов в час: банан, финики, изотоник, мармелад. Белковые батончики и жирное во время тренировки лучше не есть — тяжело переваривать."},{"c":"Питание","q":"Что поесть после тренировки?","k":["еда после трени","питание после зала","что съесть после тренировки","пост тренировочное питание","после качалки что есть"],"a":"Нормальный приём пищи с белком 25–40 г и углеводами в течение 1–2 часов. Примеры: гречка с курицей, омлет из 3 яиц с хлебом, творог 200 г с бананом, протеин с бананом если до еды далеко. Главное — суммарный белок и калории за день, а не точные минуты."},{"c":"Питание","q":"Есть ли «белковое окно» после тренировки?","k":["анаболическое окно","углеводное окно","нужно ли есть сразу после трени","30 минут после тренировки есть"],"a":"Жёсткого окна в 30 минут нет — оно растянуто на несколько часов. Если ел за 2–3 часа до тренировки, спокойно поешь в течение 1–2 часов после. Если тренировался натощак — лучше поесть с белком в течение часа."},{"c":"Питание","q":"Сколько белка нужно в день?","k":["норма белка","сколько протеина в день","сколько грамм белка на кг","белок для роста мышц","суточная норма белка"],"a":"Для набора мышц и при сушке — 1,6–2,2 г на кг веса в день. При весе 75 кг это 120–165 г. При большом лишнем весе считай от целевого веса. Раздели на 3–5 приёмов по 25–40 г."},{"c":"Питание","q":"Сколько белка можно усвоить за один приём?","k":["сколько белка усваивается за раз","30 грамм белка за раз","можно ли съесть много белка за раз","лимит белка за прием"],"a":"Усваивается практически весь белок, просто медленнее. Для стимуляции роста мышц оптимально 25–40 г за приём (около 0,4 г/кг). Можно и 60 г за раз — не пропадёт, но удобнее делить на 3–5 приёмов."},{"c":"Питание","q":"Вреден ли избыток белка для почек?","k":["много белка вредно","белок и почки","опасно ли много протеина","высокобелковая диета вред"],"a":"У здоровых людей 1,6–2,2 г/кг и даже больше не вредит почкам — это подтверждают исследования. Пей достаточно воды. Если есть заболевания почек — норму белка обсуди с врачом."},{"c":"Питание","q":"Где взять белок, если не хватает?","k":["продукты с белком","белковые продукты список","чем добрать белок","богатые белком продукты"],"a":"На 100 г: куриная грудка ~23 г, говядина ~20 г, тунец консерв. ~24 г, творог 5% ~17 г, яйцо ~6 г за штуку, греческий йогурт ~9 г, чечевица сухая ~24 г, сыр ~25 г. Добавляй источник белка в каждый приём пищи. Если всё равно не добираешь — протеин 1–2 порции."},{"c":"Питание","q":"Какие самые дешёвые источники белка?","k":["недорогой белок","бюджетный белок","дешевые белковые продукты","белок на студенческий бюджет","где взять белок дешево"],"a":"Самые выгодные по цене за грамм белка:\n— яйца\n— куриные бедра и филе, куриная печень\n— творог в пачках, кефир\n— минтай, хек, консервы сардины и скумбрии\n— чечевица, горох, фасоль, соевый текстурат\nСывороточный протеин на развес тоже часто дешевле мяса за грамм белка."},{"c":"Питание","q":"Сколько углеводов нужно в день?","k":["норма углеводов","углеводы для тренировок","сколько углей в день","сколько углеводов на кг"],"a":"При регулярных силовых — 3–5 г/кг веса, при высоких объёмах и выносливости — 5–7 г/кг. На сушке можно снизить до 2–3 г/кг, но сила может просесть. Основа — крупы, картофель, хлеб, макароны, фрукты."},{"c":"Питание","q":"Нужно ли отказываться от углеводов, чтобы похудеть?","k":["низкоуглеводка","без углеводов похудеть","кето для похудения","углеводы мешают худеть"],"a":"Нет. Худеют от дефицита калорий, а не от отказа от углеводов. Низкоуглеводная диета даёт быстрый минус на весах за счёт воды, но жир уходит с той же скоростью при равных калориях. Углеводы помогают тренироваться тяжелее — выбирай формат, который сможешь держать."},{"c":"Питание","q":"Сколько жиров нужно в день?","k":["норма жиров","сколько жира есть","жиры на кг веса","можно ли совсем без жиров"],"a":"0,8–1 г на кг веса, минимум около 0,6 г/кг — ниже не опускай даже на сушке, страдают гормоны и самочувствие. Основа — растительные масла, орехи, рыба, яйца, авокадо. Насыщенные жиры (сало, сливочное масло) — не больше трети от всех."},{"c":"Питание","q":"Как посчитать свою норму калорий?","k":["сколько калорий в день","расчет калорий","калькулятор калорий","суточная норма ккал","как узнать свои калории"],"a":"Грубо: вес × 30–33 ккал при умеренной активности (3–4 тренировки в неделю). Например, 75 кг → ~2300–2500 ккал на поддержание. Дальше 2 недели взвешивайся и корректируй: вес стоит — это твоё поддержание. Для набора +10–15%, для сушки −15–20%."},{"c":"Питание","q":"Нужно ли считать калории?","k":["обязательно ли считать ккал","подсчет калорий нужен","можно без подсчета калорий","как питаться без подсчета"],"a":"Не обязательно, но 2–4 недели подсчёта сильно помогают понять реальные порции. Без подсчёта: белок в каждом приёме (размером с ладонь), овощи, углеводы порцией с кулак, и следи за динамикой веса раз в неделю. Если вес не меняется как надо — начинай считать."},{"c":"Питание","q":"Сколько воды пить в день?","k":["норма воды","сколько пить воды","литры воды в день","водный баланс","сколько жидкости нужно"],"a":"Ориентир — около 30–35 мл на кг веса плюс 0,5–1 л на час тренировки. Лучший индикатор — светло-соломенная моча. Не надо заливать в себя 4–5 л через силу."},{"c":"Питание","q":"Сколько пить во время тренировки?","k":["вода на тренировке","пить ли во время трени","сколько воды в зале","можно ли пить на тренировке"],"a":"Пить можно и нужно: 150–250 мл каждые 15–20 минут, ориентируйся на жажду. За тренировку обычно уходит 0,5–1 л. Если сильно потеешь и занимаешься дольше часа — добавь электролиты."},{"c":"Питание","q":"Нужны ли электролиты и изотоники?","k":["изотоник нужен ли","электролиты при потоотделении","соль и калий на тренировке","регидрон после тренировки"],"a":"Для обычной тренировки до часа хватит воды. Электролиты нужны при длительных (>60–90 мин) нагрузках, в жару и при сильном поте: натрий 300–600 мг на литр. Домашний вариант: 1 л воды, щепотка соли (~1/4 ч. л.), сок половины лимона, 1–2 ст. л. мёда."},{"c":"Питание","q":"Почему сводит мышцы судорогой?","k":["судороги ноги","сводит икры","судорога на тренировке","крампы мышц"],"a":"Чаще всего — утомление мышцы и обезвоживание с потерей натрия. Пей достаточно, добавляй соль в еду при сильном поте, растягивай мышцу при спазме. Если судороги частые, без нагрузки или с отёками — обратись к врачу."},{"c":"Питание","q":"Как питаться для набора массы?","k":["питание на массу","как набрать вес","массонабор питание","набрать мышечную массу едой","что есть чтобы набрать"],"a":"Профицит 10–15% над поддержанием (+250–400 ккал), белок 1,6–2,2 г/кг, углеводы 4–6 г/кг. Цель — +0,25–0,5% веса в неделю (для 70 кг это 0,2–0,35 кг). Ешь 4–5 раз в день и тренируйся с прогрессией нагрузки — без неё лишние калории уйдут в жир."},{"c":"Питание","q":"Не могу набрать вес, что делать?","k":["не набираю вес","эктоморф не растет","нет аппетита на массу","худой не могу поправиться","хардгейнер"],"a":"Значит, ешь меньше, чем думаешь. Добавь калорийные продукты: орехи, арахисовая паста, масло в кашу (+90 ккал на ложку), сухофрукты, сыр. Пей калории: молоко, смузи с овсянкой и бананом. Добавь лишний приём пищи и взвешивайся раз в неделю — цель +0,3 кг."},{"c":"Питание","q":"Пример дневного меню для набора массы","k":["меню на массу","рацион на массу на день","что есть за день на наборе","пример питания на массу","дневной рацион набор"],"a":"Пример ~2900 ккал, ~150 г белка (для 70–75 кг):\n— Завтрак: овсянка 100 г на молоке, банан, 2 яйца\n— Обед: рис 100 г (сух.), куриная грудка 200 г, овощи, 1 ст. л. масла\n— Перекус: творог 200 г, горсть орехов 30 г\n— Ужин: макароны 100 г (сух.), говядина 150 г, салат\n— Перед сном: кефир 300 мл или протеин"},{"c":"Питание","q":"Как питаться на сушке?","k":["питание для похудения","сушка питание","как сбросить жир едой","диета для сушки","как похудеть питанием"],"a":"Дефицит 15–25% от поддержания (−400–600 ккал), белок 1,8–2,2 г/кг, чтобы сохранить мышцы. Темп — 0,5–1% веса в неделю. Больше овощей и белковых продуктов для сытости, меньше жидких калорий и сладкого. Силовые не бросай — они удерживают мышцы."},{"c":"Питание","q":"Пример дневного меню для сушки","k":["меню на сушку","рацион на сушке на день","что есть за день при похудении","пример питания на сушке","дневной рацион похудение"],"a":"Пример ~1800 ккал, ~150 г белка (для 70–80 кг):\n— Завтрак: омлет из 2 яиц + 2 белков, хлеб 1 ломтик, огурец\n— Обед: гречка 60 г (сух.), куриная грудка 180 г, салат с 1 ч. л. масла\n— Перекус: греческий йогурт 200 г, яблоко\n— Ужин: рыба (минтай/треска) 200 г, тушёные овощи 300 г, картофель 150 г\n— Вечером: творог 0–2% 150 г"},{"c":"Питание","q":"Как быстро можно худеть без вреда?","k":["скорость похудения","сколько кг в неделю худеть","безопасный темп сушки","быстро сбросить вес"],"a":"Безопасно — 0,5–1% веса в неделю (для 80 кг это 0,4–0,8 кг). Быстрее — растёт потеря мышц, голод и риск срыва. Первые 1–2 недели может уйти больше за счёт воды — это нормально."},{"c":"Питание","q":"Почему вес стоит на сушке?","k":["плато на сушке","вес не уходит","не худею на дефиците","застрял вес","почему не худею"],"a":"Чаще всего калории посчитаны неточно: масло, соусы, перекусы. Вес также скачет на 1–2 кг из-за воды, соли и цикла. Смотри средний вес за неделю, а не ежедневный. Если 2–3 недели среднее не падает — урежь ещё 150–200 ккал или добавь 2–3 тыс. шагов в день."},{"c":"Питание","q":"Можно ли одновременно сжигать жир и растить мышцы?","k":["рекомпозиция","сушка и масса одновременно","похудеть и накачаться","рекомп"],"a":"Да, особенно у новичков, после перерыва и при лишнем весе. Условия: небольшой дефицит или поддержание калорий, белок 2 г/кг, прогрессия в силовых, сон 7–9 часов. У опытных процесс медленный — эффективнее чередовать набор и сушку."},{"c":"Питание","q":"Что поесть на перекус?","k":["идеи перекусов","полезный перекус","что перекусить между едой","перекус с белком","быстрый перекус"],"a":"Белковые и удобные варианты:\n— греческий йогурт или творог 150–200 г\n— 2 варёных яйца\n— кефир 500 мл\n— банан + горсть орехов 20–30 г\n— бутерброд с тунцом или сыром"},{"c":"Питание","q":"Что взять с собой в зал или на учёбу поесть?","k":["еда с собой","перекус в сумку","что взять в контейнер","перекус в дороге","еда на учебу"],"a":"Удобно носить: банан, яблоко, питьевой йогурт или кефир, творожный сырок с высоким белком, батончик с 15–20 г белка, варёные яйца, бутерброд с курицей, контейнер с крупой и мясом. Шейкер с порцией сухого протеина — залить водой после тренировки."},{"c":"Питание","q":"Полезны ли яйца, сколько можно в день?","k":["сколько яиц в день","яйца и холестерин","желтки вредны","можно ли есть много яиц"],"a":"Для здоровых людей 2–3 яйца в день — нормально, а у многих и больше не ухудшает холестерин. В желтке витамины, холин, половина белка яйца. Если есть повышенный холестерин или наследственные проблемы — уточни у врача."},{"c":"Питание","q":"Гречка или рис — что лучше?","k":["рис или гречка","какую крупу есть","лучшая крупа для спортсмена","крупы на массу"],"a":"По калориям почти одинаково (~340 ккал на 100 г сухой). В гречке больше клетчатки, железа и магния, рис легче переваривается перед тренировкой. Ешь то, что нравится, и чередуй: рис, гречку, булгур, овсянку, перловку."},{"c":"Питание","q":"Полезна ли овсянка?","k":["овсянка на завтрак","овсяные хлопья польза","овсянка быстрого приготовления","геркулес для спортсменов"],"a":"Да, это дешёвый источник углеводов и клетчатки: ~12 г белка и 350 ккал на 100 г. Хлопья быстрого приготовления почти так же полезны, если без сахара. Добавь белок: молоко, протеин, яйца или творог рядом."},{"c":"Питание","q":"Можно ли есть хлеб и макароны?","k":["хлеб на сушке","макароны полнеют","мучное на диете","паста при похудении"],"a":"Можно. Они не полнят сами по себе — полнит избыток калорий. Выбирай цельнозерновой хлеб и макароны из твёрдых сортов, следи за порцией (60–100 г сухих макарон) и соусами — в них часто больше калорий, чем в пасте."},{"c":"Питание","q":"Картошка — это вредно?","k":["картофель на сушке","можно ли картошку","картошка полнит","картофель для спортсмена"],"a":"Варёный или запечённый картофель — отличный и очень сытный гарнир: ~80 ккал на 100 г. Калорийным его делают масло, фритюр и майонез. Жареная картошка и чипсы — уже в 3–7 раз калорийнее."},{"c":"Питание","q":"Сколько фруктов и овощей нужно есть?","k":["норма овощей","фрукты на сушке","сколько фруктов в день","клетчатка норма"],"a":"Минимум 400–500 г овощей и фруктов в день, лучше больше овощей. Это клетчатка (цель 25–35 г/день), витамины и сытость. Фрукты 2–3 штуки в день не мешают ни сушке, ни набору."},{"c":"Питание","q":"Можно ли есть сладкое?","k":["сладкое на диете","можно ли шоколад","конфеты и тренировки","тянет на сладкое","десерт при похудении"],"a":"Можно, если укладываешься в калории: примерно 10% от суточных (~200 ккал) — это 40 г шоколада или пара конфет. Лучше есть после основного приёма пищи, а не вместо. Если тянет постоянно — проверь, хватает ли белка, сна и калорий."},{"c":"Питание","q":"Чем заменить сладкое?","k":["замена сладкого","полезные сладости","что есть вместо конфет","низкокалорийный десерт"],"a":"Варианты: фрукты и ягоды, финики 2–3 шт., творог или греческий йогурт с ягодами и подсластителем, протеиновый пудинг, тёмный шоколад 70%+ 20 г, зефир или пастила (меньше жира, чем в шоколаде). Сахарозаменители (эритрит, стевия, сукралоза) в обычных дозах безопасны."},{"c":"Питание","q":"Можно ли есть фастфуд?","k":["фастфуд и тренировки","бургер на сушке","макдональдс на массе","можно ли шаурму","пицца при похудении"],"a":"Иногда — да, если укладываешься в калории и белок. Проблема фастфуда — много калорий, мало сытости и белка. Выбирай: бургер без соуса + салат, шаурма в лаваше, роллы, куриные позиции. Избегай картошки фри, газировки и соусов — там основные лишние калории."},{"c":"Питание","q":"Что такое читмил и нужен ли он?","k":["читмил","загрузочный день","срыв диеты","один день есть всё"],"a":"Читмил — запланированный приём «любимой еды». Обмен веществ он не «разгоняет», но психологически помогает держать диету. Делай это одним приёмом пищи, а не целым днём, — день обжорства легко съедает недельный дефицит."},{"c":"Питание","q":"Можно ли есть на ночь?","k":["ужин перед сном","есть после 18","поздний ужин","можно ли есть вечером","перекус перед сном"],"a":"Можно, время приёма пищи на жир почти не влияет — важны калории за сутки. Правило «не есть после 18» работает только тем, что сокращает калории. Перед сном хорош белок: творог 200 г или кефир. Ужинай за 2–3 часа до сна, если тяжесть мешает спать."},{"c":"Питание","q":"Что съесть перед сном для мышц?","k":["творог на ночь","казеин перед сном","белок на ночь","ночной перекус для мышц"],"a":"30–40 г медленного белка: творог 200–250 г, греческий йогурт, кефир 500 мл или казеиновый протеин. Это немного улучшает восстановление, но не обязательно, если дневная норма белка набрана."},{"c":"Питание","q":"Интервальное голодание — работает ли?","k":["интервальное голодание","16 8","голодание 16/8","IF для похудения","окно питания"],"a":"Работает так же, как обычный дефицит калорий, — не лучше и не хуже. Удобно, если тебе легче есть 2–3 раза в окне 8 часов. Проследи, чтобы в окне набирался белок 1,6–2 г/кг, иначе пострадают мышцы. При расстройствах пищевого поведения, диабете и в подростковом возрасте — не рекомендую."},{"c":"Питание","q":"Можно ли тренироваться при интервальном голодании?","k":["тренировка в голодании","16/8 и зал","когда тренироваться при голодании","тренироваться в голодное окно"],"a":"Можно. Удобнее тренироваться в окне питания или ближе к его началу, чтобы сразу поесть с белком 30–40 г. Если тренируешься натощак и падает сила — сдвинь окно так, чтобы поесть за 2–3 часа до зала."},{"c":"Питание","q":"Сколько раз в день нужно есть?","k":["количество приемов пищи","дробное питание","есть 6 раз в день","частота еды"],"a":"Для результата частота почти не важна — решают калории и белок. Удобно 3–5 приёмов с 25–40 г белка в каждом. Дробное питание обмен веществ не «разгоняет»."},{"c":"Питание","q":"Нужен ли завтрак?","k":["можно ли без завтрака","пропуск завтрака","обязательно ли завтракать","завтрак и похудение"],"a":"Не обязателен — завтракай, если тебе так комфортнее. Если пропускаешь, добери белок и калории за остальные приёмы. Перед утренней тренировкой лёгкий завтрак обычно помогает работать лучше."},{"c":"Питание","q":"Можно ли накачаться на вегетарианстве?","k":["вегетарианец и мышцы","веган качок","растительное питание и зал","без мяса набрать массу","веганство и спорт"],"a":"Да. Белок — 1,8–2,2 г/кг (растительный чуть хуже усваивается), сочетай разные источники: соя, тофу, чечевица, фасоль, нут, сейтан, гороховый протеин. Вегетарианцам — ещё яйца и молочка. Следи за B12 (веганам добавка обязательна), железом, цинком, омега-3 и витамином D."},{"c":"Питание","q":"Где брать белок вегетарианцу?","k":["растительный белок","белок без мяса","веганский белок продукты","соя белок"],"a":"На 100 г: тофу ~12–15 г, соевый текстурат сухой ~50 г, чечевица сухая ~24 г, нут ~19 г, сейтан ~25 г, творог ~17 г, яйцо ~6 г за шт. Сочетай бобовые и крупы за день. Удобно добрать гороховым или соевым протеином."},{"c":"Питание","q":"Как алкоголь влияет на результаты?","k":["алкоголь и тренировки","пиво и мышцы","можно ли пить на массе","алкоголь на сушке","выпил перед тренировкой"],"a":"Алкоголь ухудшает синтез мышечного белка, сон и восстановление, а 1 г — 7 ккал «пустых» калорий. Пара бокалов изредка не перечеркнёт прогресс, большие дозы — заметно тормозят его на 1–2 дня. Не тренируйся с похмелья или сразу после выпивки — выше риск травм."},{"c":"Питание","q":"Можно ли тренироваться после алкоголя?","k":["тренировка с похмелья","зал после пьянки","похмелье и спорт","выпил вчера идти ли в зал"],"a":"После крупной дозы лучше отложить тяжёлую тренировку на день: обезвоживание, хуже координация, выше нагрузка на сердце. Если чувствуешь себя нормально — лёгкое кардио или прогулка и много воды. При сердцебиении, головокружении — не тренируйся."},{"c":"Питание","q":"Можно ли пить кофе перед тренировкой?","k":["кофе до тренировки","кофе и спорт","эспрессо перед залом","кофе как предтрен"],"a":"Да, кофе — один из самых рабочих бустеров: 1–2 чашки (100–200 мг кофеина) за 30–60 минут до тренировки повышают силу и выносливость. Не пей позже чем за 6–8 часов до сна. Максимум — 400 мг кофеина в день."},{"c":"Питание","q":"Сколько кофе можно пить в день?","k":["норма кофе","сколько чашек кофе","кофе вредно ли","лимит кофеина"],"a":"Для здорового взрослого — до 400 мг кофеина в день: это 3–4 чашки заварного кофе. Если появляется тревожность, сердцебиение, проблемы со сном — уменьши. При проблемах с давлением и сердцем — согласуй с врачом."},{"c":"Питание","q":"Можно ли пить газировку и соки?","k":["кола на диете","сок полезен ли","сладкие напитки","кола зеро можно ли"],"a":"Сладкая газировка и соки — легко выпить 200–400 ккал без сытости, на сушке лучше ограничить. Напитки без сахара (зеро, лайт) в обычных количествах безопасны и подходят. Лучше съесть фрукт, чем выпить сок."},{"c":"Питание","q":"Сколько соли можно есть?","k":["соль и спорт","соль задерживает воду","норма соли","соль на сушке"],"a":"Ориентир — до 5 г соли в день для обычного человека; при сильном поте и большом объёме тренировок потребность выше. Соль задерживает воду на весах, но жир не добавляет. Не убирай соль полностью — это ухудшит самочувствие на тренировках."},{"c":"Питание","q":"Какое молоко и молочка полезны?","k":["молочные продукты","молоко и мышцы","кефир или йогурт","творог какой жирности"],"a":"Молочка — удобный белок: творог 5% ~17 г, греческий йогурт ~9 г, молоко ~3 г на 100 г. На сушке бери 0–2%, на массе можно 5%. Если плохо переносишь лактозу — безлактозные продукты, творог и сыры."},{"c":"Питание","q":"Полезны ли орехи и арахисовая паста?","k":["орехи на сушке","арахисовая паста калории","миндаль польза","сколько орехов в день"],"a":"Полезны: жиры, магний, витамин E. Но калорийны — 600 ккал на 100 г. Норма — 20–30 г в день (горсть) или 1 ст. л. пасты. На массе — отличный способ добрать калории."},{"c":"Питание","q":"Какая рыба полезна и сколько её есть?","k":["рыба для спортсменов","жирная рыба","сколько раз есть рыбу","лосось или минтай"],"a":"Ешь рыбу 2–3 раза в неделю, хотя бы раз — жирную (лосось, скумбрия, сельдь, сардины) ради омега-3. Белая рыба (минтай, треска, хек) — почти чистый белок, ~17–20 г на 100 г, отлично для сушки. Консервы в собственном соку тоже подходят."},{"c":"Питание","q":"Красное мясо — вредно?","k":["говядина вред","свинина можно ли","красное мясо и здоровье","колбаса вредна"],"a":"Нежирная говядина и свинина — хороший источник белка, железа и цинка; 2–3 порции в неделю — нормально. Ограничивай переработанное мясо: колбасы, сосиски, бекон — в них много соли и есть связь с рисками для здоровья."},{"c":"Питание","q":"Можно ли есть сосиски, пельмени и полуфабрикаты?","k":["пельмени на массе","сосиски белок","полуфабрикаты можно ли","магазинные котлеты"],"a":"Изредка — да, но белка в них меньше, чем кажется, а жира и соли больше. Смотри этикетку: в хороших пельменях ~10–12 г белка на 100 г, в сосисках ~10 г при 25 г жира. Лучше — куриное филе, фарш, рыба."},{"c":"Питание","q":"Что такое гликемический индекс и важен ли он?","k":["гликемический индекс","ГИ продуктов","быстрые и медленные углеводы","сахар в крови"],"a":"ГИ показывает, как быстро продукт повышает сахар в крови. Для здорового человека он вторичен: важнее общие калории, клетчатка и сытость. Медленные углеводы (крупы, бобовые) лучше насыщают; быстрые (банан, белый рис) удобны перед и после тренировки."},{"c":"Питание","q":"Как бороться с голодом на сушке?","k":["постоянно хочу есть","голод на диете","как не сорваться","чувство голода на дефиците"],"a":"Работает:\n— белок в каждом приёме пищи\n— много овощей и объёмной еды (супы, салаты)\n— вода и несладкие напитки\n— сон 7–9 часов\n— не слишком большой дефицит (не больше 25%)"},{"c":"Питание","q":"Что такое «углеводная загрузка» и нужна ли она?","k":["углеводная загрузка","загрузка углеводами","рефид","углеводный день"],"a":"Это повышенное потребление углеводов перед долгими соревнованиями на выносливость (больше 90 минут). Для обычного зала не нужна. На длинной сушке «рефид» — 1–2 дня на поддержании с упором на углеводы — может помочь самочувствию и силе."},{"c":"Питание","q":"Нужно ли есть больше в дни тренировок?","k":["питание в день отдыха","калории в выходной от зала","есть меньше без тренировки","циклирование калорий"],"a":"Можно чуть больше углеводов в день тренировки и меньше в день отдыха, но это не обязательно. Белок держи одинаковым каждый день — восстановление идёт и в отдых. Главное — недельный баланс калорий."},{"c":"Питание","q":"Как питаться студенту с маленьким бюджетом?","k":["дешевое питание","питание студента","бюджетный рацион","как питаться дешево и правильно"],"a":"Основа: крупы (гречка, рис, овсянка), макароны, картофель, яйца, курица, творог, кефир, бобовые, замороженные овощи, сезонные фрукты, рыбные консервы. Готовь на 2–3 дня вперёд. Протеин покупай только если не добираешь белок едой."},{"c":"Питание","q":"Как готовить еду заранее на несколько дней?","k":["meal prep","заготовка еды","готовить на неделю","контейнеры с едой","мил преп"],"a":"Раз в 2–3 дня готовь: крупу 300–500 г сухой, курицу или фарш 1–1,5 кг, запечённые овощи. Раскладывай по контейнерам, храни в холодильнике до 3–4 дней, остальное — в морозилку. Меняй соусы и специи, чтобы не надоедало."},{"c":"Питание","q":"Правда ли, что надо есть отдельно белки и углеводы?","k":["раздельное питание","белки и углеводы вместе","смешивать белки и углеводы"],"a":"Нет, это миф. Пищеварение отлично справляется со смешанной едой, а сочетание белка и углеводов после тренировки даже полезно. Ешь как удобно."},{"c":"Питание","q":"Правда ли, что фрукты вечером превращаются в жир?","k":["фрукты вечером","банан на ночь","углеводы вечером полнеют"],"a":"Миф. Ни фрукты, ни углеводы вечером не превращаются в жир сильнее, чем днём. Жир набирается от избытка калорий за сутки."},{"c":"Питание","q":"Что есть, если тренировка рано утром?","k":["утренняя тренировка питание","завтрак перед утренней треней","в зал в 7 утра что есть"],"a":"Если до тренировки меньше часа — что-то лёгкое: банан, йогурт, тост с мёдом, кофе. Можно и натощак, если самочувствие хорошее. Полноценный завтрак с белком 30–40 г — сразу после тренировки."},{"c":"Питание","q":"Что есть, если тренировка поздно вечером?","k":["вечерняя тренировка питание","ужин после тренировки поздно","тренировка в 21 что есть"],"a":"Нормально пообедай и сделай перекус за 1–2 часа до зала (йогурт, бутерброд, банан). После тренировки — лёгкий ужин с белком: омлет, творог, рыба с овощами. Ужин после вечерней тренировки не помешает результату."},{"c":"Питание","q":"Как понять, что я недоедаю?","k":["признаки недоедания","мало ем симптомы","слишком большой дефицит","энергии нет на тренировках"],"a":"Признаки: падает сила несколько недель подряд, постоянная усталость, плохой сон, раздражительность, холодно, у девушек — сбой цикла. Вес падает быстрее 1% в неделю. Подними калории на 200–300 ккал. При выраженных симптомах обратись к врачу."},{"c":"Питание","q":"Как девушкам питаться для тренировок?","k":["питание для девушек","девушка набор мышц","женская диета для зала","сколько белка девушке"],"a":"Принципы те же: белок 1,6–2,2 г/кг, жиры не ниже 0,8 г/кг (важно для гормонов), дефицит не больше 20%. Следи за железом (мясо, печень, бобовые) — особенно при обильных месячных. Если пропал цикл — это сигнал недоедания, обратись к врачу."},{"c":"Питание","q":"Можно ли тренироваться и питаться по-спортивному подростку?","k":["подросток питание","мне 15 питание для зала","школьник и спорт питание"],"a":"Да, но без дефицитов и диет: подростку нужно много энергии для роста. Белок ~1,2–1,8 г/кг из обычной еды, 3 приёма пищи + перекусы. Добавки, жиросжигатели и предтрены не нужны. Любые ограничения в еде — только с врачом."},{"c":"Питание","q":"Что делать, если тошнит на тренировке?","k":["тошнота в зале","мутит на тренировке","тошнит после еды на трене"],"a":"Остановись, отдохни, выпей воды небольшими глотками. Частые причины: поел слишком близко к тренировке, слишком интенсивно, обезвоживание или низкий сахар. В следующий раз ешь за 2–3 часа, а не за 30 минут. Если тошнота с болью в груди, одышкой или головокружением — прекрати и обратись к врачу."},{"c":"Питание","q":"Что делать, если кружится голова в зале?","k":["головокружение на тренировке","темнеет в глазах","слабость в зале","чуть не упал в обморок"],"a":"Сразу прекрати упражнение, сядь или ляг, подними ноги. Выпей сладкого — сок или чай. Частые причины: натощак, обезвоживание, задержка дыхания, резкий подъём. Если повторяется или есть боль в груди и сбой пульса — обратись к врачу."},{"c":"Питание","q":"Полезны ли смузи и протеиновые коктейли домашние?","k":["смузи на массу","домашний коктейль для массы","рецепт белкового коктейля","коктейль без протеина"],"a":"Да, это лёгкий способ выпить калории и белок. На массу: молоко 400 мл, банан, овсянка 50 г, арахисовая паста 1 ст. л., творог 100 г — ~800 ккал и ~45 г белка. На сушке: кефир или йогурт, ягоды, протеин."},{"c":"Питание","q":"Можно ли есть мёд и сухофрукты?","k":["мед вместо сахара","сухофрукты на сушке","финики польза","изюм перед тренировкой"],"a":"Можно, но это почти чистый сахар: мёд ~320 ккал, финики ~280 ккал на 100 г. Отличны перед или во время длинной тренировки. На сушке — в пределах 20–30 г в день."},{"c":"Питание","q":"Влияет ли питание на сон и восстановление?","k":["еда и сон","питание для восстановления","что есть чтобы восстановиться","восстановление после тренировки еда"],"a":"Да: недостаток калорий и белка ухудшает восстановление, а плотная жирная еда и алкоголь перед сном — качество сна. Ужинай за 2–3 часа до сна, кофеин — не позже 6–8 часов. Для восстановления важны белок, углеводы и сон 7–9 часов."},{"c":"Добавки","q":"Нужен ли протеин?","k":["нужен ли протеин новичку","без протеина можно накачаться","зачем протеин","обязателен ли протеин"],"a":"Не обязателен — это просто удобный белок. Нужен, если не добираешь 1,6–2,2 г/кг обычной едой. Порция 30 г порошка = ~22–25 г белка, примерно как 100 г куриной грудки."},{"c":"Добавки","q":"Как правильно пить протеин?","k":["как принимать протеин","когда пить протеин","протеин дозировка","сколько протеина пить","протеин на воде или молоке"],"a":"1 порция 25–40 г белка, 1–2 раза в день — после тренировки или как перекус. Время не критично, важна суточная норма белка. На воде — меньше калорий, на молоке — +12 г белка и ~120 ккал, удобно на массе."},{"c":"Добавки","q":"Какой протеин выбрать?","k":["виды протеина","сывороточный или казеин","изолят или концентрат","лучший протеин","какой протеин купить"],"a":"Сывороточный концентрат — оптимум цены и качества. Изолят — если плохо переносишь лактозу. Казеин — медленный, удобен на ночь. Растительный (гороховый, соевый) — для веганов. Смотри на содержание белка: от 70–75 г на 100 г и известного производителя."},{"c":"Добавки","q":"Вреден ли протеин?","k":["протеин вред","протеин и почки","протеин и печень","протеин химия","опасен ли протеин"],"a":"Нет, это концентрат молочного или растительного белка — та же еда. У здоровых людей не вредит почкам и печени. Возможно вздутие при непереносимости лактозы — тогда изолят или безлактозный. Покупай у проверенных брендов."},{"c":"Добавки","q":"Можно ли пить протеин вместо еды?","k":["протеин вместо обеда","заменить еду протеином","протеин вместо ужина"],"a":"Изредка — да, но постоянно не стоит: в еде есть клетчатка, витамины и она лучше насыщает. Если нет времени — добавь к коктейлю банан, овсянку или орехи. Основа рациона — обычная еда."},{"c":"Добавки","q":"Как принимать протеин в дни отдыха?","k":["протеин в выходной","протеин без тренировки","нужен ли протеин в день отдыха"],"a":"Так же — если не добираешь белок едой. Мышцы восстанавливаются и в дни отдыха, суточная норма белка та же. Выпей порцию в любое удобное время."},{"c":"Добавки","q":"Что такое креатин и работает ли он?","k":["креатин","зачем креатин","креатин эффект","креатин моногидрат","работает ли креатин"],"a":"Креатин — самая изученная и эффективная спортивная добавка. Увеличивает силу и рабочий объём, помогает набирать мышцы быстрее. Бери обычный креатин моногидрат — дороже формы не лучше."},{"c":"Добавки","q":"Как принимать креатин?","k":["креатин дозировка","сколько креатина пить","загрузка креатином","когда пить креатин","креатин схема"],"a":"3–5 г в день каждый день, в любое время, можно с едой. Загрузка не обязательна: без неё эффект через 3–4 недели, с загрузкой (20 г/день 5–7 дней) — через неделю. Перерывы и курсы не нужны."},{"c":"Добавки","q":"Вреден ли креатин?","k":["креатин вред","креатин и почки","креатин и выпадение волос","побочки креатина","креатин опасен"],"a":"В дозах 3–5 г/день безопасен для здоровых людей — это подтверждено многолетними исследованиями. Возможен рост веса на 1–2 кг за счёт воды в мышцах. Данных о вреде почкам у здоровых нет. При болезнях почек — только по согласованию с врачом."},{"c":"Добавки","q":"Креатин задерживает воду?","k":["креатин отеки","креатин вода","креатин на сушке","от креатина плывешь"],"a":"Креатин удерживает воду внутри мышц, а не под кожей, поэтому «заплывания» нет. Вес может вырасти на 1–2 кг в первые недели. На сушке его можно и нужно продолжать — он помогает сохранить силу."},{"c":"Добавки","q":"Нужно ли пить креатин с углеводами или соком?","k":["креатин с соком","креатин с чем пить","креатин с глюкозой","креатин транспортная система"],"a":"Не обязательно. Углеводы немного ускоряют насыщение мышц, но через пару недель разницы нет. Пей с водой, едой или в протеиновом коктейле."},{"c":"Добавки","q":"Нужны ли BCAA?","k":["бцаа","BCAA польза","аминокислоты нужны ли","бцаа на сушке","незаменимые аминокислоты"],"a":"Если ты получаешь 1,6–2,2 г белка на кг — BCAA бесполезны: в любом белке их уже достаточно. Это дорогой способ получить немного аминокислот. Лучше потратить деньги на протеин или еду."},{"c":"Добавки","q":"Что такое гейнер и нужен ли он?","k":["гейнер","гейнер для массы","гейнер или протеин","гейнер для худых"],"a":"Гейнер — смесь углеводов (часто 60–80%) и белка. Нужен только тем, кто физически не может съесть нужные калории. Дешевле сделать самому: протеин + овсянка 50–80 г + банан + молоко. На сушке и при склонности к полноте гейнер не нужен."},{"c":"Добавки","q":"Работает ли предтренировочный комплекс?","k":["предтрен","предтреник","pre-workout","предтренировочный комплекс","стоит ли брать предтрен"],"a":"Основное действие предтрена — кофеин (часто 200–300 мг) + бета-аланин, цитруллин. Небольшой прирост работоспособности есть, но кофе даёт почти тот же эффект дешевле. Не мешай с другими стимуляторами и энергетиками, не принимай вечером."},{"c":"Добавки","q":"Безопасен ли предтрен?","k":["предтрен вред","покалывание от предтрена","предтрен и сердце","опасный предтрен","DMAA"],"a":"Покалывание кожи — от бета-аланина, это безвредно. Риски — высокая доза кофеина, сердцебиение, проблемы со сном, тревога. Не бери продукты с DMAA, DMHA, синефрином и «секретными смесями». При проблемах с сердцем и давлением — не используй. При боли в груди и сильном сердцебиении прекрати тренировку и обратись к врачу."},{"c":"Добавки","q":"Как принимать кофеин для тренировок?","k":["кофеин в таблетках","кофеин дозировка","кофеин перед тренировкой","сколько кофеина перед залом"],"a":"3–6 мг на кг веса за 30–60 минут до тренировки, но начни с 1–2 мг/кг (100–150 мг) — часто этого хватает. Максимум 400 мг в день. Не позже чем за 6–8 часов до сна. Привыкание развивается — используй не на каждой тренировке."},{"c":"Добавки","q":"Можно ли пить энергетики перед тренировкой?","k":["энергетик перед залом","ред булл перед тренировкой","монстр перед трени","энергетики вред"],"a":"Изредка можно: в банке 0,5 л ~150–160 мг кофеина. Минусы — много сахара (если не zero) и легко перебрать кофеин, особенно вместе с кофе и предтреном. Больше 1 банки в день и в сочетании с алкоголем — не рекомендую."},{"c":"Добавки","q":"Нужна ли омега-3?","k":["омега 3","рыбий жир","омега-3 польза","рыбий жир спортсменам"],"a":"Если ешь жирную рыбу 2 раза в неделю — добавка не обязательна. Если нет — 1–2 г EPA+DHA в день (смотри именно на сумму EPA+DHA, а не на «рыбий жир 1000 мг»). Пей с едой. Веганам — омега-3 из водорослей."},{"c":"Добавки","q":"Нужен ли витамин D?","k":["витамин д","витамин D дозировка","D3 спортсменам","дефицит витамина D"],"a":"В России в осенне-зимний период дефицит частый. Профилактическая доза — 1000–2000 МЕ в день с едой, содержащей жиры. Точную дозу лучше подобрать по анализу 25(OH)D. Высокие дозы без анализа и контроля не принимай."},{"c":"Добавки","q":"Нужен ли магний?","k":["магний B6","магний для сна","магний спортсменам","какой магний лучше"],"a":"Нужен, если не хватает с едой (орехи, гречка, бобовые, зелень, тёмный шоколад) или сильно потеешь. Дозировка — 200–400 мг элементарного магния в день, лучше цитрат или глицинат, вечером. Оксид усваивается хуже и может послабить."},{"c":"Добавки","q":"Нужны ли мультивитамины?","k":["витамины для спортсменов","мультивитамины нужны ли","комплекс витаминов","какие витамины пить"],"a":"При разнообразном питании — не обязательны. Могут быть полезны на сильной сушке, при однообразном рационе или веганстве. Лучше сдать анализы и закрыть конкретные дефициты (D, железо, B12), чем пить всё подряд."},{"c":"Добавки","q":"Нужно ли железо?","k":["железо добавка","ферритин низкий","анемия и спорт","железо для девушек"],"a":"Только при подтверждённом дефиците — по анализу ферритина и гемоглобина. Чаще нужно девушкам, веганам и тем, кто много бегает. Принимать железо без анализа не стоит — избыток вреден. Дозу назначает врач."},{"c":"Добавки","q":"Работают ли жиросжигатели?","k":["жиросжигатель","жиросжигатели для похудения","л-карнитин похудение","таблетки для похудения","фат бернер"],"a":"Почти нет. Большинство — это кофеин и экстракты с эффектом в пределах 50–100 ккал в день или вообще без эффекта. Жир сжигает дефицит калорий. Опасны продукты с ДМАА, синефрином, йохимбином, «тайскими таблетками» — не рекомендую."},{"c":"Добавки","q":"Работает ли L-карнитин?","k":["л карнитин","карнитин для похудения","карнитин перед кардио","L-carnitine"],"a":"Для похудения у здоровых людей с нормальным питанием эффекта практически нет: организм сам синтезирует карнитин, его хватает. Деньги лучше потратить на еду или протеин."},{"c":"Добавки","q":"Какие добавки бесполезны?","k":["бесполезные добавки","на что не тратить деньги","развод в спортпите","какие добавки не работают"],"a":"Не стоит тратить деньги на: BCAA (при нормальном белке), глютамин, L-карнитин для похудения, тестобустеры (трибулус и т. п.), жиросжигатели, ZMA без дефицита, «анаболические» травы. Рабочие: креатин, протеин (удобство), кофеин, витамин D при дефиците."},{"c":"Добавки","q":"Какие добавки реально работают?","k":["рабочие добавки","что из спортпита работает","доказанные добавки","топ добавок для зала"],"a":"С хорошей доказательной базой:\n— креатин моногидрат 3–5 г/день\n— кофеин 1–6 мг/кг перед тренировкой\n— протеин — как удобный белок\n— бета-аланин 3–6 г/день для нагрузок 1–4 минуты\n— витамин D и омега-3 — при дефиците"},{"c":"Добавки","q":"Работают ли тестобустеры?","k":["тестобустер","трибулус","повысить тестостерон добавками","бустер тестостерона"],"a":"Нет, у здоровых мужчин тестобустеры (трибулус, D-аспарагиновая кислота, пажитник) заметно тестостерон не поднимают и на рост мышц не влияют. Лучшие «бустеры» — сон 7–9 часов, нормальные калории, жиры не ниже 0,8 г/кг, отсутствие лишнего жира. При подозрении на низкий тестостерон — анализ и врач."},{"c":"Добавки","q":"Стоит ли принимать стероиды?","k":["стероиды","анаболики","курс стероидов","химия в зале","фарма для массы","SARMs"],"a":"Не рекомендую. Риски: проблемы с сердцем и давлением, печенью, угнетение собственного тестостерона, бесплодие, акне, гинекомастия, психические изменения; в РФ оборот ряда веществ уголовно наказуем. SARMs тоже не безопасны. Натуральный прогресс — годы стабильных тренировок, еды и сна."},{"c":"Добавки","q":"Нужен ли глютамин?","k":["глютамин","глютамин для восстановления","глютамин польза"],"a":"Для здоровых людей с нормальным белком — нет. Исследования не показывают эффекта на рост мышц, силу или восстановление. Глютамина достаточно в обычной еде."},{"c":"Добавки","q":"Что такое бета-аланин?","k":["бета аланин","бета-аланин покалывание","бета аланин дозировка"],"a":"Повышает выносливость в усилиях 1–4 минуты (многоповторные подходы, интервалы). Доза — 3–6 г в день, эффект накапливается за 2–4 недели. Безвредное покалывание кожи уменьшается, если делить дозу на 2–3 приёма."},{"c":"Добавки","q":"Работает ли цитруллин?","k":["цитруллин малат","L-citrulline","памп добавки","аргинин для пампа"],"a":"Цитруллин малат 6–8 г за час до тренировки может немного повысить количество повторений и «памп». Эффект небольшой, не у всех. Аргинин работает хуже цитруллина."},{"c":"Добавки","q":"Можно ли принимать несколько добавок одновременно?","k":["совмещать добавки","креатин и протеин вместе","можно ли пить креатин с протеином","сочетание спортпита"],"a":"Да, основные добавки совместимы: протеин, креатин, омега-3, витамин D можно пить вместе, даже в одном шейкере. Не совмещай несколько стимуляторов: предтрен + энергетик + кофе. При приёме лекарств уточни совместимость у врача."},{"c":"Добавки","q":"Можно ли принимать спортпит подростку?","k":["протеин подростку","креатин в 16 лет","добавки школьнику","с какого возраста протеин"],"a":"Протеин — это еда, его можно, если не хватает белка. Креатин изучен у подростков меньше — лучше с согласия врача и родителей. Предтрены, жиросжигатели, энергетики и тестобустеры подросткам не рекомендую."},{"c":"Добавки","q":"Как выбрать надёжный спортпит?","k":["как не купить подделку","проверенный спортпит","качество протеина","как выбрать бренд добавок"],"a":"Покупай в официальных магазинах и у известных брендов, проверяй состав и количество белка на порцию. Хорошо, если есть независимая проверка (Informed Sport, NSF). Избегай «запатентованных смесей» без указания доз и слишком дешёвых аналогов."},{"c":"Добавки","q":"Есть ли срок годности у протеина и креатина?","k":["просроченный протеин","срок годности креатина","как хранить протеин"],"a":"Храни в сухом прохладном месте, плотно закрытым. Креатин очень стабилен и годен долго после даты. Протеин после срока может потерять вкус и немного белка; если нет запаха прогорклости, комков с плесенью — обычно безопасен, но лучше не затягивать."},{"c":"Добавки","q":"Помогают ли коллаген и хондропротекторы для суставов?","k":["коллаген для суставов","глюкозамин хондроитин","хондропротекторы","добавки для связок"],"a":"Доказательства слабые. Коллаген 10–15 г с витамином C за 30–60 минут до нагрузки может немного помочь связкам, но не заменяет правильную технику и разминку. Глюкозамин и хондроитин — эффект минимален. При боли в суставах обратись к врачу."},{"c":"Добавки","q":"Нужны ли электролиты в таблетках?","k":["солевые таблетки","электролиты добавка","таблетки с натрием","электролиты в порошке"],"a":"На обычных тренировках в зале — нет, хватает еды и воды. Нужны при длительных (больше 1,5 часа) нагрузках, в жару или при сильном потоотделении. Можно заменить щепоткой соли и соком в бутылке воды."},{"c":"Добавки","q":"Нужен ли казеин на ночь?","k":["казеин","ночной протеин","казеин или творог","медленный белок"],"a":"Не обязателен. 30–40 г казеина перед сном немного улучшают восстановление, но творог 200–250 г даёт то же самое. Если дневная норма белка набрана, без казеина результат почти не изменится."},{"c":"Добавки","q":"Что делать, если от протеина пучит?","k":["вздутие от протеина","протеин живот болит","протеин понос","газы от протеина"],"a":"Чаще всего причина — лактоза. Перейди на изолят или безлактозный/растительный протеин, разводи на воде, а не на молоке. Также виноваты подсластители (сорбит, мальтит) — смени марку. Если боль стойкая — обратись к врачу."},{"c":"Добавки","q":"Можно ли принимать мелатонин для сна?","k":["мелатонин","мелатонин для сна","добавки для сна","плохо сплю после трени"],"a":"Мелатонин 0,5–3 мг за 30–60 минут до сна помогает при сбитом режиме и смене часовых поясов. Он не снотворное и не решает проблему, если пьёшь кофеин вечером или сидишь в телефоне. Долго принимать без врача не рекомендую."},{"c":"Добавки","q":"Работает ли ашваганда?","k":["ашваганда","адаптогены","ашвагандха стресс","ашваганда тестостерон"],"a":"Есть умеренные данные о снижении стресса и небольшом улучшении сна, слабые — о силе и тестостероне. Обычная доза — 300–600 мг экстракта в день. Есть сообщения о вреде печени и влиянии на щитовидку — при заболеваниях и приёме лекарств не используй без врача."},{"c":"Добавки","q":"Помогает ли цинк спортсменам?","k":["цинк","цинк тестостерон","ZMA","цинк для иммунитета"],"a":"Если цинка в рационе достаточно (мясо, морепродукты, яйца, бобовые) — добавка не нужна и тестостерон не повысит. Нужен при подтверждённом дефиците, иногда веганам. Не превышай 25–40 мг в день без врача."},{"c":"Тренировки","q":"Сколько подходов и повторений делать?","k":["сколько подходов","сколько повторов","схема подходов","сколько раз делать упражнение","подходы и повторения","сколько сетов"],"a":"Универсально: 3–4 рабочих подхода по 6–12 повторений в базовых упражнениях и 2–3 подхода по 10–15 в изолирующих. На одну мышцу набирай 10–20 рабочих подходов в неделю. Последние 1–3 повтора должны быть тяжёлыми, но с чистой техникой."},{"c":"Тренировки","q":"Какой вес брать для упражнения?","k":["какой вес брать","подобрать вес","с каким весом работать","рабочий вес","сколько кг брать","как понять свой вес"],"a":"Бери вес, с которым делаешь нужное число повторов чисто и у тебя остаётся 1–3 повтора в запасе. Начни с лёгкого, сделай пробный подход на 10 повторов и оцени: если легко дошёл до 15 — добавь, если техника развалилась до 8 — сбрось. Первые 2–3 недели вес лучше недобрать, чем перебрать."},{"c":"Тренировки","q":"Когда прибавлять вес?","k":["когда увеличивать вес","когда добавлять блины","прогрессия нагрузки","как прибавлять вес","когда переходить на больший вес","двойная прогрессия"],"a":"Используй двойную прогрессию: выбери диапазон, например 8–12. Когда во всех подходах делаешь верхнюю границу (12) с хорошей техникой — прибавь 2,5–5 кг в базе или 1–2 кг в изоляции и снова работай от 8. Если вес не растёт, прибавляй сначала повторы, потом подходы."},{"c":"Тренировки","q":"Сколько отдыхать между подходами?","k":["отдых между подходами","сколько отдыхать","пауза между сетами","сколько минут отдыха","отдых между упражнениями"],"a":"Базовые тяжёлые упражнения (присед, жим, тяга): 2–3 минуты, на силу до 3–5. Изоляция и лёгкие упражнения: 60–90 секунд. Короткий отдых не «сжигает больше жира», а просто снижает рабочий вес и объём. Ориентир — дыхание восстановилось и ты готов сделать подход качественно."},{"c":"Тренировки","q":"Как правильно разминаться перед тренировкой?","k":["разминка","как размяться","разминка перед залом","нужна ли разминка","разогрев перед тренировкой","суставная разминка"],"a":"5–7 минут лёгкого кардио до тёплого ощущения, затем динамические движения для работающих суставов (махи, вращения, выпады без веса). Перед первым базовым упражнением сделай 2–4 разминочных подхода с нарастающим весом: 40–50% ×10, 60–70% ×5, 80% ×2–3. Статическую растяжку на 60 секунд перед тяжёлой работой лучше не делать."},{"c":"Тренировки","q":"Нужна ли заминка после тренировки?","k":["заминка","что делать после тренировки","растяжка после зала","охлаждение после тренировки","заминка обязательна"],"a":"Заминка не обязательна для роста, но помогает спокойно снизить пульс. Достаточно 5–10 минут лёгкой ходьбы или велосипеда и, по желанию, растяжки на мышцы, которые тренировал, по 20–30 секунд. Восстановление больше зависит от сна, еды и разумного объёма."},{"c":"Тренировки","q":"Сколько раз в неделю тренироваться?","k":["сколько раз в неделю","частота тренировок","как часто ходить в зал","сколько тренировок в неделю","каждый день в зал можно","2 или 3 раза в неделю"],"a":"Новичку — 3 раза в неделю на всё тело, с днём отдыха между. Опытному — 3–5 раз: фулбади, верх/низ или сплит. Каждую мышцу полезно нагружать 2 раза в неделю. Тренироваться каждый день можно только при умеренном объёме и разных мышечных группах."},{"c":"Тренировки","q":"Сколько должна длиться тренировка?","k":["длительность тренировки","сколько по времени тренироваться","тренировка 2 часа это нормально","сколько минут в зале","долго тренироваться вредно"],"a":"Оптимально 45–75 минут без учёта долгой болтовни. Если тренировка растягивается на 2 часа — обычно слишком много упражнений или долгий отдых. Мифа про «кортизол после 45 минут» не бойся: важнее качество подходов, а не таймер."},{"c":"Тренировки","q":"Что делать, если застрял на одном весе (плато)?","k":["плато","вес не растёт","застой","не прогрессирую","стою на месте","силовые не растут"],"a":"Проверь основу: спишь 7–9 часов, ешь достаточно белка (1,6–2,2 г/кг) и калорий. Далее варианты: разгрузочная неделя, смена диапазона повторов (например, с 8–12 на 5–8), добавление 1–2 подходов, замена упражнения на похожее. Прибавляй мелкими шагами — 1–2,5 кг или по одному повтору."},{"c":"Тренировки","q":"Нужно ли тренироваться до отказа?","k":["отказ","работа до отказа","до отказа или нет","отказные подходы","мышечный отказ","надо ли до отказа"],"a":"Не обязательно. Для роста достаточно оставлять 0–3 повтора в запасе. В последнем подходе изоляции можно дойти до отказа, а в тяжёлой базе (присед, становая, жим) отказ повышает риск травмы и сильно утомляет. Постоянный отказ во всех подходах ухудшает восстановление."},{"c":"Тренировки","q":"Что важнее — техника или вес?","k":["техника или вес","читинг","раскачка","плохая техника","можно ли с плохой техникой","техника важнее"],"a":"Техника. Вес с развалившейся техникой нагружает связки и спину, а не целевую мышцу. Правило: полная амплитуда, контроль в негативе 2–3 секунды, без рывков. Если для чистого повтора нужно раскачаться — вес слишком большой."},{"c":"Тренировки","q":"С чего начать новичку в зале?","k":["новичок в зале","первый раз в зале","с чего начать тренировки","программа для новичка","как начать заниматься","я новичок что делать"],"a":"Тренируйся 3 раза в неделю на всё тело: присед или жим ногами, жим лёжа или отжимания, тяга блока или гантели, жим над головой, планка. По 3 подхода по 8–12, вес небольшой. Первый месяц цель — освоить технику и привычку, а не рекорды. Прибавляй вес, когда все подходы даются легко."},{"c":"Тренировки","q":"Можно ли тренироваться дома без железа?","k":["тренировки дома","домашние тренировки","без зала","тренировка без инвентаря","упражнения дома","можно ли накачаться дома"],"a":"Можно, особенно новичку. База: отжимания, приседания, выпады, ягодичный мост, планка, подтягивания на турнике, тяга в наклоне с рюкзаком. Прогрессия — больше повторов, медленнее темп, сложнее вариант (на одной ноге, ноги на возвышении). Резиновые петли и пара разборных гантелей сильно расширят выбор."},{"c":"Тренировки","q":"Что можно сделать на турнике и брусьях?","k":["турник и брусья","упражнения на турнике","брусья упражнения","воркаут","площадка во дворе","тренировка на турнике"],"a":"Турник: подтягивания разными хватами (спина, бицепс), подъёмы ног в висе (пресс), австралийские подтягивания на низкой перекладине. Брусья: отжимания на грудь (наклон вперёд, локти в стороны) и трицепс (корпус прямо), подъём ног в упоре. Добавь приседания и выпады — и получится полноценная тренировка на всё тело."},{"c":"Тренировки","q":"Как подтянуться первый раз?","k":["не могу подтянуться","первое подтягивание","как научиться подтягиваться","подтягивания с нуля","0 подтягиваний","научиться подтягиваться"],"a":"Делай 3 раза в неделю: негативы — запрыгни наверх и опускайся 3–5 секунд, 3–5 повторов × 3 подхода. Добавь австралийские подтягивания 3×8–12, вис 20–40 секунд и подтягивания с резиной. Сбрось лишний вес, если он есть. Обычно первое чистое подтягивание приходит за 4–8 недель."},{"c":"Тренировки","q":"Как увеличить количество подтягиваний?","k":["больше подтягиваний","прогресс в подтягиваниях","увеличить подтягивания","как подтягиваться 20 раз","подтягивания программа"],"a":"Делай много подходов не до отказа: например, 5–8 подходов по 50–70% от максимума с отдыхом 1,5–2 минуты, 3 раза в неделю. Раз в неделю — тяжёлый день с отягощением или медленными негативами. Укрепляй хват висами и тягами. Каждую неделю добавляй по 1 повтору в часть подходов."},{"c":"Тренировки","q":"Как научиться отжиматься, если не получается?","k":["не могу отжаться","отжимания для начинающих","научиться отжиматься","отжимания с колен","отжимания от стены","слабые руки отжимания"],"a":"Начни с отжиманий от стены, затем от стола или скамьи, постепенно снижая опору. Делай 3–4 подхода по 8–15, 3 раза в неделю. Добавь негативы с пола: опускайся 3–5 секунд. Корпус держи прямым как планку, локти под 30–45° к телу."},{"c":"Тренировки","q":"Как увеличить количество отжиманий?","k":["больше отжиманий","отжиматься 100 раз","прогресс в отжиманиях","отжимания программа","увеличить отжимания"],"a":"3–4 раза в неделю делай 4–6 подходов по 60–70% от максимума, отдых 60–90 секунд. Раз в неделю — сложный вариант: ноги на возвышении, медленный негатив или с рюкзаком. Добавь жим лёжа или отжимания на брусьях для силы. Каждую неделю прибавляй 1–2 повтора в подход."},{"c":"Тренировки","q":"Как научиться стоять на руках?","k":["стойка на руках","хендстенд","handstand","стоять на руках","стойка у стены"],"a":"Подготовка: планка, отжимания уголком (pike), упор на прямых руках. Затем стойка у стены животом к стене по 20–40 секунд, 4–6 подходов. Учи выход из стойки (кувырок или шаг в сторону), чтобы не бояться упасть. Тренируй 10–15 минут почти каждый день — это навык, а не только сила."},{"c":"Тренировки","q":"Как сделать выход силой?","k":["выход силой","muscle up","масл ап","выход на две","как научиться выходу силой"],"a":"Нужна база: 10–12 чистых подтягиваний и 15–20 отжиманий на брусьях. Тренируй взрывные подтягивания до груди или пояса, ложный хват и переход над перекладиной с резиной или с низкой перекладины. Негативы выхода силой медленно сверху вниз. Работай свежим, в начале тренировки, 3–5 подходов по 1–3 попытки."},{"c":"Тренировки","q":"С чего начать калистенику?","k":["калистеника","street workout","упражнения с собственным весом","калистеника для новичка","программа калистеники"],"a":"Основа — 4 движения: подтягивания (или австралийские), отжимания, отжимания на брусьях, приседания. Плюс пресс: подъёмы ног в висе и планка. 3 раза в неделю на всё тело, по 3–4 подхода. Прогрессируй через усложнение вариантов: от наклонных отжиманий к обычным, к узким, к на одной руке."},{"c":"Тренировки","q":"Чем отличаются тренировки на силу, массу и выносливость?","k":["сила или масса","тренировка на силу","тренировка на массу","на выносливость","гипертрофия","диапазон повторений"],"a":"Сила: тяжёлый вес, 1–6 повторов, отдых 3–5 минут. Масса (гипертрофия): 6–15 повторов близко к отказу, 10–20 подходов на мышцу в неделю. Выносливость: 15–30+ повторов, короткий отдых. Мышцы растут в широком диапазоне от 5 до 30 повторов, если подход тяжёлый в конце."},{"c":"Тренировки","q":"Как накачать широкие плечи?","k":["широкие плечи","накачать плечи","дельты","средняя дельта","плечи как шар","махи в стороны"],"a":"Ширину даёт средняя дельта: махи гантелями в стороны 3–4 подхода по 12–20, 2–3 раза в неделю, без раскачки. Добавь жим над головой 3×6–10 и упражнения на заднюю дельту (обратные махи, face pull). Ширина спины тоже визуально расширяет верх."},{"c":"Тренировки","q":"Как накачать широкую спину («крылья»)?","k":["крылья","широкая спина","широчайшие","накачать спину","v-образная фигура","спина шире"],"a":"Широчайшие качают вертикальные тяги: подтягивания и тяга верхнего блока 3–4 подхода по 6–12. Добавь горизонтальные тяги (тяга гантели, тяга сидя) для толщины спины. Тяни локтями вниз к бокам, а не руками. Итого 12–18 подходов на спину в неделю."},{"c":"Тренировки","q":"Как накачать пресс и увидеть кубики?","k":["кубики","накачать пресс","пресс кубиками","кубики пресса","как увидеть пресс","плоский живот"],"a":"Кубики есть у всех — их скрывает жир. Видны обычно при 10–12% жира у мужчин и 18–20% у женщин, так что главное — дефицит калорий. Пресс тренируй 2–3 раза в неделю: подъёмы ног в висе, скручивания на блоке, планка, ролик, по 3 подхода. Сотни скручиваний каждый день жир с живота не уберут."},{"c":"Тренировки","q":"Как убрать бока?","k":["убрать бока","жир на боках","бока на талии","ушки на талии","косые мышцы бока","наклоны с гантелью бока"],"a":"Локально жир не сжигается: наклоны с гантелью в стороны бока не уберут, а могут даже расширить талию. Нужен дефицит калорий 300–500 ккал, 8–10 тыс. шагов в день и силовые на всё тело. Бока обычно уходят одними из последних — нужна терпеливость."},{"c":"Тренировки","q":"Можно ли сжечь жир в конкретном месте?","k":["локальное жиросжигание","похудеть в животе","сжечь жир на ногах","убрать жир с рук","похудеть в одном месте"],"a":"Нет, жир уходит со всего тела, а порядок определяет генетика. Упражнение на проблемную зону укрепляет мышцу под жиром, но жир над ней не сжигает. Работает только общий дефицит калорий плюс силовые и активность."},{"c":"Тренировки","q":"Как накачать ноги?","k":["накачать ноги","тренировка ног","квадрицепсы","ноги не растут","толстые ноги мышцы","день ног"],"a":"База: присед или жим ногами 3–4×6–10, румынская тяга 3×8–10, выпады или болгарские сплит-приседания 3×10. Добавь разгибания и сгибания ног в тренажёре и подъёмы на носки. Тренируй ноги 2 раза в неделю и не пропускай — это крупнейшие мышцы тела."},{"c":"Тренировки","q":"Как накачать ягодицы?","k":["накачать ягодицы","попа","ягодичный мост","ягодицы упражнения","круглая попа","ягодичные мышцы"],"a":"Лучшие упражнения: ягодичный мост или хип-траст со штангой 3–4×8–12, румынская тяга, болгарские сплит-приседания, глубокие выпады шагом назад. Отведение ноги в тренажёре — для верхней части. 2–3 тренировки в неделю, 12–18 подходов, постепенно прибавляй вес."},{"c":"Тренировки","q":"Как накачать руки — бицепс и трицепс?","k":["накачать руки","бицепс","трицепс","большие руки","руки не растут","тренировка рук"],"a":"Трицепс — около 2/3 объёма руки, не забывай его: французский жим, разгибания на блоке, жим узким хватом. Бицепс: подъём штанги или гантелей, молотки. По 6–10 прямых подходов на каждую мышцу в неделю плюс работа в тягах и жимах. Без набора общей массы руки сильно не вырастут."},{"c":"Тренировки","q":"Как накачать шею?","k":["накачать шею","толстая шея","тренировка шеи","трапеции","упражнения для шеи"],"a":"Начни аккуратно: изометрия — дави ладонью на лоб, затылок и бока головы по 10–20 секунд. Затем сгибания и разгибания шеи лёжа на скамье с блином на лбу или затылке, 2–3×15–20, лёгкий вес. Трапеции — шраги 3×10–15. Шея травмируется легко: без рывков и большого веса. При боли или онемении в руках остановись и обратись к врачу."},{"c":"Тренировки","q":"Как накачать грудь?","k":["накачать грудь","грудные мышцы","грудь не растёт","верх груди","жим лёжа для груди"],"a":"База: жим лёжа штангой или гантелями 3–4×6–10 и жим на наклонной скамье 30° для верха. Добавь отжимания на брусьях с наклоном вперёд и сведения в кроссовере или гантелями 2–3×12–15. Лопатки сведены, амплитуда полная. 10–16 подходов на грудь в неделю."},{"c":"Тренировки","q":"Можно ли накачать нижний пресс?","k":["нижний пресс","низ живота","низ пресса","подъём ног пресс","живот внизу"],"a":"Прямая мышца живота — одна, но подъёмы ног и таза сильнее нагружают её нижнюю часть. Делай подъёмы ног в висе или лёжа, обратные скручивания 3×10–15. Низ живота обычно теряет жир последним, поэтому видимость зависит от общего процента жира."},{"c":"Тренировки","q":"Надо ли каждый день качать пресс?","k":["пресс каждый день","качать пресс ежедневно","сколько раз в неделю пресс","пресс каждый день вредно"],"a":"Не нужно. Пресс — обычная мышца: 2–3 тренировки в неделю по 6–10 подходов хватит. Он и так работает в приседе, становой и жимах стоя. Ежедневные скручивания жир с живота не уберут."},{"c":"Тренировки","q":"Как улучшить растяжку и гибкость?","k":["растяжка","гибкость","как растянуться","стретчинг","улучшить гибкость","сесть на шпагат"],"a":"Растягивайся 3–5 раз в неделю после тренировки или отдельно, к
