<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Тренировки</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a0c0f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Тренировки"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a0c0f;--card:#13171c;--c2:#1a2027;--ink:#f2f5f7;--mut:#8b97a3;--line:#232a32;--s:#ff5a2c;--l:#2ee6c5;--r:#a98bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f6;--card:#fff;--c2:#f3f5f8;--ink:#10151a;--mut:#5b6773;--line:#dde2e8;--s:#e2481b;--l:#08a58a;--r:#7a55e6}}
:root[data-theme="light"]{--bg:#f1f3f6;--card:#fff;--c2:#f3f5f8;--ink:#10151a;--mut:#5b6773;--line:#dde2e8;--s:#e2481b;--l:#08a58a;--r:#7a55e6}
:root[data-theme="dark"]{--bg:#0a0c0f;--card:#13171c;--c2:#1a2027;--ink:#f2f5f7;--mut:#8b97a3;--line:#232a32;--s:#ff5a2c;--l:#2ee6c5;--r:#a98bff}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:640px;padding:14px 14px 104px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;margin-bottom:14px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,90,44,.5),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(46,230,197,.28),transparent 60%),#12161b;color:#f2f5f7;border:1px solid rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.ey{font-size:12px;font-weight:800;letter-spacing:2.5px;color:#ffb199}
.hero h1{font:900 30px/1.05 "Arial Black",Impact,system-ui,sans-serif;margin:6px 0 16px;letter-spacing:-.5px;max-width:82%}
.go{border:0;border-radius:999px;padding:11px 22px;font:800 15px system-ui;background:#fff;color:#0a0c0f;cursor:pointer}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px system-ui;border-radius:999px;cursor:pointer}
.tabs .tab{min-width:48px;height:48px;padding:0 14px;position:relative}
.tab[aria-selected=true]{background:var(--c);border-color:var(--c);color:#0a0c0f;box-shadow:0 6px 18px -6px var(--c)}
.tabs .tab.today::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--c)}
.tab[aria-selected=true].today::after{background:#0a0c0f}
.hd{display:flex;align-items:center;gap:14px;margin:6px 0 14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--c) 38%,var(--line))}
.hl{flex:1;min-width:0}.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:3px 9px;border-radius:999px;background:var(--c);color:#0a0c0f}
.hd h2{margin:8px 0 4px;font:800 22px/1.1 system-ui}.meta{color:var(--mut);font-size:14px}
.ring{position:relative;width:68px;height:68px;flex:0 0 auto}.ring svg{width:100%;height:100%}.rb{fill:none;stroke:var(--line);stroke-width:6}.rf{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}.hd.all .ring b{color:var(--c)}
.ex{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.row{display:grid;grid-template-columns:26px 1fr auto;column-gap:12px;row-gap:6px;align-items:center;padding:12px 12px 12px 16px}.row input[type=checkbox]{grid-row:1/3;grid-column:1}.nm{grid-column:2;grid-row:1}.sets{grid-column:2;grid-row:2;justify-self:start}.row .kg{grid-column:3;grid-row:1/3}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;margin:0;display:grid;place-content:center;cursor:pointer}
.row input[type=checkbox]:checked{background:var(--c);border-color:var(--c)}
.row input[type=checkbox]:checked::after{content:"✓";color:#0a0c0f;font-weight:900;font-size:15px;line-height:1}
.nm{flex:1;min-width:0;background:none;border:0;color:inherit;text-align:left;font:700 17px/1.2 system-ui;cursor:pointer;padding:0}
.n{display:inline-block;font-style:normal;font-size:12px;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;margin-right:8px;background:var(--c2);color:var(--mut)}
.sets{flex:0 0 auto;font-weight:800;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ex.done .nm{opacity:.4;text-decoration:line-through}
.how{display:none;padding:2px 14px 14px 16px;color:var(--mut);font-size:15.5px}.ex.open .how{display:block}.how p{margin:6px 0}.how b{color:var(--c)}
.pic{display:flex;gap:8px;margin:6px 0 10px}.pic figure{flex:1;margin:0;text-align:center;max-width:50%}.pic svg{width:100%;height:auto;background:#eef1f3;border-radius:14px;display:block}.pic figcaption{font-size:13px;color:var(--mut);margin-top:3px}
.kg{width:64px;flex:0 0 auto;padding:7px 4px;border:1px solid var(--line);border-radius:10px;background:var(--c2);color:var(--ink);font:600 16px system-ui;text-align:center}
.tr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.tr b{flex:1;font-weight:600}.tr span{color:var(--mut)}
.th{margin:20px 0 6px;font:800 20px system-ui}.note{color:var(--mut);margin:12px 0;font-size:15px}
.f{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.f label{font-size:13px;color:var(--mut)}.f .kg{width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--mut);font-weight:600}
.rules h3{margin:20px 0 6px;font:800 19px system-ui;padding-left:10px;border-left:4px solid var(--s)}.rules ul{margin:0;padding-left:20px;color:var(--mut)}.rules li{margin:4px 0}
.tm{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;padding:8px 10px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);display:flex;gap:6px;align-items:center;justify-content:center;font-size:17px;font-weight:800}.tm .tab{min-width:0;padding:7px 12px;font-size:15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--c,var(--s));outline-offset:2px}
@media(prefers-reduced-motion:reduce){.ex{animation:none}.rf{transition:none}}

h+='<h3 class="th">История рабочих весов</h3>';var any=0;
