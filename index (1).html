<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>План тренировок</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0a0c0f;--card:#13171c;--c2:#1a2027;--ink:#f2f5f7;--mut:#8b97a3;--line:#232a32;--s:#ff5a2c;--l:#2ee6c5;--r:#a98bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f6;--card:#fff;--c2:#f3f5f8;--ink:#10151a;--mut:#5b6773;--line:#dde2e8;--s:#e2481b;--l:#08a58a;--r:#7a55e6}}
:root[data-theme="light"]{--bg:#f1f3f6;--card:#fff;--c2:#f3f5f8;--ink:#10151a;--mut:#5b6773;--line:#dde2e8;--s:#e2481b;--l:#08a58a;--r:#7a55e6}
:root[data-theme="dark"]{--bg:#0a0c0f;--card:#13171c;--c2:#1a2027;--ink:#f2f5f7;--mut:#8b97a3;--line:#232a32;--s:#ff5a2c;--l:#2ee6c5;--r:#a98bff}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{margin:0 auto;max-width:640px;padding:14px 14px 104px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;margin-bottom:14px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,90,44,.5),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(46,230,197,.28),transparent 60%),#12161b;color:#f2f5f7;border:1px solid rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.ey{font-size:12px;font-weight:800;letter-spacing:2.5px;color:#ffb199}
.hero h1{font:900 30px/1.05 "Arial Black",Impact,system-ui,sans-serif;margin:6px 0 16px;letter-spacing:-.5px;max-width:82%}
.go{border:0;border-radius:999px;padding:11px 22px;font:800 15px system-ui;background:#fff;color:#0a0c0f;cursor:pointer}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px system-ui;border-radius:999px;cursor:pointer}
.tabs .tab{min-width:48px;height:48px;padding:0 14px;position:relative}
.tab[aria-selected=true]{background:var(--c);border-color:var(--c);color:#0a0c0f;box-shadow:0 6px 18px -6px var(--c)}
.tabs .tab.today::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--c)}
.tab[aria-selected=true].today::after{background:#0a0c0f}
.hd{display:flex;align-items:center;gap:14px;margin:6px 0 14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--c) 38%,var(--line))}
.hl{flex:1;min-width:0}.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:3px 9px;border-radius:999px;background:var(--c);color:#0a0c0f}
.hd h2{margin:8px 0 4px;font:800 22px/1.1 system-ui}.meta{color:var(--mut);font-size:14px}
.ring{position:relative;width:68px;height:68px;flex:0 0 auto}.ring svg{width:100%;height:100%}.rb{fill:none;stroke:var(--line);stroke-width:6}.rf{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}.hd.all .ring b{color:var(--c)}
.ex{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.row{display:grid;grid-template-columns:26px 1fr auto;column-gap:12px;row-gap:6px;align-items:center;padding:12px 12px 12px 16px}.row input[type=checkbox]{grid-row:1/3;grid-column:1}.nm{grid-column:2;grid-row:1}.sets{grid-column:2;grid-row:2;justify-self:start}.row .kg{grid-column:3;grid-row:1/3}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;margin:0;display:grid;place-content:center;cursor:pointer}
.row input[type=checkbox]:checked{background:var(--c);border-color:var(--c)}
.row input[type=checkbox]:checked::after{content:"✓";color:#0a0c0f;font-weight:900;font-size:15px;line-height:1}
.nm{flex:1;min-width:0;background:none;border:0;color:inherit;text-align:left;font:700 17px/1.2 system-ui;cursor:pointer;padding:0}
.n{display:inline-block;font-style:normal;font-size:12px;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;margin-right:8px;background:var(--c2);color:var(--mut)}
.sets{flex:0 0 auto;font-weight:800;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ex.done .nm{opacity:.4;text-decoration:line-through}
.how{display:none;padding:2px 14px 14px 16px;color:var(--mut);font-size:15.5px}.ex.open .how{display:block}.how p{margin:6px 0}.how b{color:var(--c)}
.pic{display:flex;gap:8px;margin:6px 0 10px}.pic figure{flex:1;margin:0;text-align:center;max-width:50%}.pic svg{width:100%;height:auto;background:#eef1f3;border-radius:14px;display:block}.pic figcaption{font-size:13px;color:var(--mut);margin-top:3px}
.kg{width:64px;flex:0 0 auto;padding:7px 4px;border:1px solid var(--line);border-radius:10px;background:var(--c2);color:var(--ink);font:600 16px system-ui;text-align:center}
.tr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.tr b{flex:1;font-weight:600}.tr span{color:var(--mut)}
.th{margin:20px 0 6px;font:800 20px system-ui}.note{color:var(--mut);margin:12px 0;font-size:15px}
.f{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.f label{font-size:13px;color:var(--mut)}.f .kg{width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--mut);font-weight:600}
.rules h3{margin:20px 0 6px;font:800 19px system-ui;padding-left:10px;border-left:4px solid var(--s)}.rules ul{margin:0;padding-left:20px;color:var(--mut)}.rules li{margin:4px 0}
.tm{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;padding:8px 10px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);display:flex;gap:6px;align-items:center;justify-content:center;font-size:17px;font-weight:800}.tm .tab{min-width:0;padding:7px 12px;font-size:15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--c,var(--s));outline-offset:2px}
.hint{grid-column:2/4;grid-row:3;font-size:13px;font-weight:700;color:var(--mut)}.hint.up{color:var(--c)}.hint.rec{color:#f5b301}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.pt{display:flex;justify-content:space-between;align-items:baseline}.pt span{font-weight:800;color:var(--l)}
.pg{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 10px}.pg i{display:block;height:100%;background:var(--l);border-radius:4px;transition:width .3s}
.btns{display:flex;gap:6px;flex-wrap:wrap}.btns .tab{padding:7px 14px;font-size:15px}
.hero .tab{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.22)}
.dlb{margin:0 0 14px;padding:10px 12px;border-radius:14px;background:rgba(169,139,255,.18);border:1px solid rgba(169,139,255,.45);font-size:14px}
.cy{font-size:13px;color:#b7c0c8;margin:-8px 0 14px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);max-width:90%;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);padding:10px 18px;border-radius:999px;font-weight:800;transition:transform .3s;z-index:9;text-align:center}.toast.on{transform:translate(-50%,0)}
.ex.na{animation:none}
.sl{margin:4px 0 12px}.slh,.sr{display:grid;grid-template-columns:22px 1fr 14px 1fr 44px;gap:6px;align-items:center}
.slh{font-size:12px;color:var(--mut);text-align:center}.sr{margin:6px 0}.sr b{color:var(--mut);text-align:center}.sr>span{text-align:center;color:var(--mut)}.sr .kg{width:100%;box-sizing:border-box}
.okb{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--c2);color:var(--mut);font:900 18px system-ui;cursor:pointer}
.sr.ok .okb{background:var(--c);border-color:var(--c);color:#0a0c0f}.sr.ok .kg{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.plt{font-size:14px;color:var(--mut);margin:6px 0 0}
.gmo{margin-top:10px;padding:7px 14px;font-size:14px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stt b{display:block;font:900 24px/1.15 system-ui}.stt span{font-size:13px;color:var(--mut)}.stt small{display:block;font-size:12px;margin-top:2px}
.bb{display:flex;align-items:center;gap:3px;height:110px;margin:10px 0}.bb i{width:16px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:0 0 auto}.bb .s1{width:60px;height:12px;background:#9aa3aa;border-radius:3px 0 0 3px}.bb .s2{width:24px;height:12px;background:#9aa3aa;border-radius:0 3px 3px 0}
.gm{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-width:640px;margin:0 auto}.gm[hidden]{display:none}
.gmh{display:flex;align-items:center;gap:10px}.gx{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.gmp{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.gmp i{display:block;height:100%;background:var(--c);transition:width .3s}.gmh span{font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.gmb{flex:1;overflow-y:auto;padding:14px 0;-webkit-overflow-scrolling:touch}
.gmn{font:900 30px/1.1 system-ui;margin:10px 0 10px}
.gm .hint{display:block;font-size:15px;margin:10px 0}
.gm .slh,.gm .sr{grid-template-columns:30px 1fr 18px 1fr 64px;gap:10px}.gm .sr{margin:10px 0}.gm .sr b{font-size:20px}
.gm .sr .kg{font-size:26px;padding:12px 4px;border-radius:14px}.gm .okb{height:60px;font-size:26px;border-radius:14px}.gm .plt{font-size:16px}
.gm details{margin-top:14px;color:var(--mut)}.gm summary{font-weight:800;color:var(--ink);cursor:pointer;padding:8px 0}.gm details b{color:var(--c)}
.gmt{display:flex;align-items:center;gap:6px;justify-content:center;padding:8px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}.gmt b{font:900 24px system-ui;min-width:100px;text-align:center;font-variant-numeric:tabular-nums}.gmt.run b{color:var(--c)}.gmt .tab{padding:8px 12px;font-size:15px}
.gmf{display:grid;grid-template-columns:1fr 2fr;gap:10px}.gmf button{height:64px;border-radius:18px;font:900 20px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.gmf button:disabled{opacity:.35}.gmf .nx{background:var(--c);border-color:var(--c);color:#0a0c0f}
.bigok{width:100%;height:72px;border-radius:18px;border:2px solid var(--c);background:none;color:var(--c);font:900 22px system-ui;margin-top:12px;cursor:pointer}.bigok.on{background:var(--c);color:#0a0c0f}
.gdn{display:inline-block;margin-left:8px;font-size:13px;font-weight:800;color:var(--c)}
body.lock{overflow:hidden}
.hw{color:var(--mut)}.hw h4{margin:14px 0 4px;font:800 13px system-ui;color:var(--ink);text-transform:uppercase;letter-spacing:.6px}.hw ol,.hw ul{margin:0;padding-left:20px}.hw li{margin:4px 0}.hw li::marker{color:var(--c);font-weight:800}
.mu{color:var(--ink);font-weight:600}.tp{background:var(--c2);border-radius:12px;padding:9px 11px;color:var(--ink);margin-top:12px!important}
.adj{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.adj .tab{padding:7px 12px;font-size:14px}
.tm,.gmt{overflow:hidden;background:linear-gradient(100deg,color-mix(in srgb,#ff5a2c 22%,var(--card)),color-mix(in srgb,#a98bff 22%,var(--card)) 55%,color-mix(in srgb,#2ee6c5 22%,var(--card)));border-color:color-mix(in srgb,#a98bff 35%,var(--line));transition:background .4s,border-color .4s}
.gmt{position:relative}.tm>*,.gmt>*{position:relative}.tm .tf,.gmt .tf{position:absolute;left:0;top:0;bottom:0;background:hsl(var(--th) 85% 50% / .38);transition:width 1s linear,background 1s}
.tm.run,.gmt.run{background:var(--card);border-color:hsl(var(--th) 85% 55%);box-shadow:0 0 22px -6px hsl(var(--th) 85% 50%)}
.tt{font:900 22px system-ui;min-width:72px;text-align:center;font-variant-numeric:tabular-nums;color:hsl(var(--th,140) 85% 62%)}.gmt .tt{font-size:28px;min-width:96px}
.tm.warn .tt,.gmt.warn .tt{animation:pul .5s ease-in-out infinite alternate}@keyframes pul{to{transform:scale(1.15)}}
.tm.go,.gmt.go{background:linear-gradient(90deg,#2ee6c5,#8fd16a);border-color:#8fd16a;animation:glow .6s ease-in-out 3 alternate}.tm.go .tt,.gmt.go .tt{color:#0a0c0f;min-width:0}@keyframes glow{to{box-shadow:0 0 30px 0 #8fd16a}}
.tl{font-size:18px}.tm .tab,.gmt .tab{background:color-mix(in srgb,var(--card) 70%,transparent)}
.tms{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:592px;margin:auto;z-index:9;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}.tms[hidden]{display:none}
.tm.min{left:auto;right:16px;width:60px;height:60px;padding:0;border-radius:50%;gap:0;cursor:pointer;justify-content:center;box-shadow:0 8px 24px -6px rgba(0,0,0,.7)}
.tm.min.run{background:conic-gradient(hsl(var(--th) 85% 50%) var(--tp,0deg),var(--line) 0);border-color:transparent}.tm.min.run::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.tm.min .tt{font-size:15px;min-width:0}.tm.min .tl{font-size:24px}.tm .tx{padding:7px 10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f3 .kg{width:100%;box-sizing:border-box}
@media(prefers-reduced-motion:reduce){.tm.warn .tt,.gmt.warn .tt,.tm.go,.gmt.go{animation:none}.ex{animation:none}.rf{transition:none}}
</style></head><body>
<div class="hero" id="hero"></div>
<div class="card" id="prot"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"></div><div class="tm" id="tm"></div><div class="tms card" id="tms" hidden></div><div class="toast" id="toast" role="status"></div><div class="gm" id="gm" hidden></div>
<script>
var I={
legpress:["Сядь в тренажёр, спина прижата, стопы на платформе на ширине плеч.","Опусти платформу до угла в коленях ~90°, выжми пятками. Колени в конце не выпрямляй до упора."],
legext:["Сядь, валик на голенях у стоп, колени у края сиденья.","Выпрями ноги, задержись на секунду, медленно опусти."],
legcurl:["Ляг на живот, валик над пятками.","Согни ноги к ягодицам, таз не отрывай, медленно вернись."],
lunge:["Стой с гантелями в руках, спина прямая.","Шаг вперёд, заднее колено к полу, толкнись передней ногой и вернись."],
abd:["Сядь в тренажёр, подушки у внешней (затем внутренней) стороны бёдер.","Разводи ноги, затем своди — плавно, без рывков."],
calf:["Сядь, носки на платформе, колени под валиком.","Поднимись на носки, задержись, медленно опустись."],
crunch:["Лёжа на спине, колени согнуты, руки у висков.","Скрути корпус, отрывая лопатки от пола. Шею не тяни."],
plank:["Упор на предплечья, локти под плечами.","Тело — прямая линия, пресс и ягодицы напряжены, поясницу не прогибай."],
hang:["Возьмись за турник хватом чуть шире плеч.","Повисни расслабленно, плечи слегка оттяни от ушей."],
pullup:["Хват чуть шире плеч, вис на прямых руках.","Подтянись подбородком выше перекладины, опускайся плавно и полностью."],
pushup:["Упор лёжа, ладони чуть шире плеч.","Опустись грудью почти к полу, тело прямое, выжмись вверх."],
dips:["Упор на брусьях, руки прямые, корпус слегка вперёд.","Опустись до угла в локтях ~90°, вытолкни вверх."],
stretch:["Выбери позы для спины, груди, ног и плеч.","Держи каждую 20–30 сек, дыши ровно, без боли и рывков."],
cardio:["Лёгкий темп, дыхание ровное.","Ходьба, скакалка или бег — так, чтобы можно было говорить."],
lat:["Сядь, бёдра под валиком, хват шире плеч.","Тяни перекладину к верху груди, сводя лопатки, плавно верни."],
row:["Сядь, ноги упёрты в упор, спина прямая.","Тяни рукоять к поясу, сводя лопатки, плавно отпусти."],
dbrow:["Колено и рука на скамье, спина параллельна полу.","Тяни гантель к поясу, локоть вдоль тела, опускай медленно."],
pullover:["Встань у верхнего блока, руки почти прямые, корпус слегка наклонён.","Тяни рукоять дугой к бёдрам, чувствуя спину, плавно вернись."],
shrug:["Стой с гантелями вдоль тела.","Подними плечи к ушам, задержись, опусти. Не крути плечами."],
curl:["Стой, гантели в руках, локти прижаты к корпусу.","Согни руки, поворачивая кисть ладонью вверх, медленно опусти."],
hammer:["Как сгибания, но хват нейтральный — ладони смотрят друг на друга.","Сгибай руки, корпус не раскачивай."],
shc:["Стой прямо, руки расслаблены.","Делай большие круги плечами вперёд, затем назад."],
twist:["Ноги на ширине плеч, руки на поясе.","Плавные наклоны в стороны и повороты корпуса."],
bike:["Лёжа на спине, руки у висков, ноги над полом.","Тяни локоть к противоположному колену, «крути педали»."],
bench:["Ляг, лопатки сведены, стопы на полу, хват шире плеч.","Опусти штангу к низу груди, выжми вверх. Нужен страхующий."],
